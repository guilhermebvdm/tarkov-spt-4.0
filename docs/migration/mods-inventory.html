<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPT 4.0 — Inventário de Mods</title>
<style>
:root {
  --bg:      #09090b; --bg2:#0d0e10; --bg3:#121416; --bg4:#181a1e; --bg5:#1e2126;
  --border:  #1c1f24; --border2:#252a32;
  --gold:    #c8a96e; --gold2:#a88950;
  --text:    #7a8290; --text2:#a8b0bc; --text3:#d0d8e4;
  --green2:  #5aa050;
  --inst-bg: rgba(36,90,46,.22);
  --inst-bg-hover: rgba(36,90,46,.34);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text2);font-family:'Segoe UI',system-ui,sans-serif;font-size:13px}

/* ── HEADER ── */
.hdr{
  background:linear-gradient(180deg,#0e0f11 0%,#09090b 100%);
  border-bottom:1px solid var(--gold2);
  padding:14px 24px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
.hdr-left{display:flex;align-items:baseline;gap:14px}
.hdr-left h1{font-size:16px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);text-shadow:0 0 24px rgba(200,169,110,.25)}
.hdr-sub{color:var(--text);font-size:11px;letter-spacing:.06em}
.hdr-badge{background:var(--bg3);border:1px solid var(--border2);color:var(--gold);font-size:10px;font-weight:700;letter-spacing:.12em;padding:4px 10px;text-transform:uppercase}

/* ── STATS ── */
.stats{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sc{display:flex;align-items:center;gap:7px;background:var(--bg3);border:1px solid var(--border);padding:5px 10px}
.sc .lbl{color:var(--text);font-size:9px;letter-spacing:.1em;text-transform:uppercase}
.sc .val{font-weight:700;font-size:14px}
.sc .val.gold{color:var(--gold)} .sc .val.gr{color:#5aa050} .sc .val.or{color:#c07030}
.sc .val.re{color:#c04040} .sc .val.bl{color:#5080c8} .sc .val.pu{color:#9070c8}
.sc .val.tl{color:#38b2b8} .sc .val.ya{color:#d4a820} .sc .val.inst{color:#4caf72}
.stats-sep{width:1px;height:28px;background:var(--border2)}
.prog-wrap{display:flex;gap:2px;height:4px;width:100%;overflow:hidden}
.prog-seg{height:100%}

/* ── FILTERS ── */
.filters{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.fg{display:flex;flex-direction:column;gap:4px}
.fg>.lbl{color:var(--text);font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.fr{display:flex;gap:3px;flex-wrap:wrap}
.fb{background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-size:11px;padding:3px 8px;cursor:pointer;transition:all .12s;font-family:inherit;white-space:nowrap}
.fb:hover{border-color:var(--gold2);color:var(--text2)}
.fb.on{background:var(--bg5);border-color:var(--gold);color:var(--gold)}
.search-wrap{display:flex;flex-direction:column;gap:4px}
.search-wrap>.lbl{color:var(--text);font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
input[type=text]{background:var(--bg3);border:1px solid var(--border2);color:var(--text2);font-size:12px;padding:5px 10px;outline:none;font-family:inherit;width:220px;transition:border-color .12s}
input[type=text]:focus{border-color:var(--gold2)}
input[type=text]::placeholder{color:var(--text)}

/* ── TABLE ── */
.tbl-wrap{padding:14px 24px 40px;overflow-x:auto}
.count-row{color:var(--text);font-size:11px;letter-spacing:.04em;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.count-row strong{color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{
  background:var(--bg3);color:var(--gold);font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  padding:8px 10px;text-align:left;border-bottom:1px solid var(--gold2);border-right:1px solid var(--border);
  white-space:nowrap;cursor:pointer;-webkit-user-select:none;user-select:none;position:sticky;top:0;z-index:10;
}
thead th:last-child{border-right:none}
thead th:hover{background:var(--bg4)}
thead th .si{margin-left:4px;opacity:.3;font-size:8px}
thead th.asc .si::after{content:'▲';opacity:1} thead th.desc .si::after{content:'▼';opacity:1}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:nth-child(even){background:rgba(255,255,255,.012)}
tbody tr:hover{background:rgba(200,169,110,.04)}
tbody tr.installed{background:var(--inst-bg) !important}
tbody tr.installed:hover{background:var(--inst-bg-hover) !important}
tbody tr.naoincluir{background:rgba(70,75,85,.18) !important}
tbody tr.naoincluir:hover{background:rgba(70,75,85,.28) !important}
tbody tr.naoincluir td{color:var(--text);opacity:.62}
tbody tr.naoincluir td .mod-name{color:var(--text)}
tbody td{padding:6px 10px;border-right:1px solid var(--border);vertical-align:middle}
tbody td:last-child{border-right:none}

/* Col widths */
.c-num{width:30px;min-width:30px;text-align:right;color:var(--text);font-size:11px;font-variant-numeric:tabular-nums}
.c-name{min-width:175px;max-width:220px}
.c-tipo,.c-atu,.c-cat,.c-pri,.c-status,.c-spt4{white-space:nowrap}
.c-spt4{width:58px;min-width:58px;text-align:center}
.spt4-yes{font-size:14px;line-height:1}
.spt4-no {font-size:14px;line-height:1;opacity:.7}
.c-esc{min-width:120px}
.c-forge{min-width:65px;white-space:nowrap}
.c-repo{min-width:140px}
.c-fn{min-width:180px;max-width:260px}
.c-inst{width:80px;min-width:80px;text-align:center}
.c-trl{width:60px;min-width:60px;text-align:center;white-space:nowrap}

/* TRL 3.0? badges */
.btrl-Sim{background:rgba(55,75,120,.18);color:#7090c0;border-color:rgba(55,75,120,.38)}
.btrl-New{background:rgba(75,125,25,.18);color:#88c030;border-color:rgba(75,125,25,.38)}
.btrl-q  {background:rgba(50,50,60,.2);color:#606878;border-color:rgba(50,50,60,.3);font-style:italic}

/* Mod name */
.mod-name{color:var(--text3);font-weight:500;line-height:1.3;display:flex;align-items:center;gap:5px}
.mod-name.int{color:#7aaad4}
.review-dot{width:5px;height:5px;border-radius:50%;background:#c07030;flex-shrink:0}

/* ── BADGES (shared base) ── */
.b{display:inline-flex;align-items:center;padding:2px 6px;font-size:10px;font-weight:600;letter-spacing:.04em;white-space:nowrap;border:1px solid transparent;gap:3px}

/* STATUS */
.bs-Avaliar    {background-color:rgba(200,144,26,.12);color:#e8b040;border-color:rgba(200,144,26,.28)}
.bs-Instalar   {background-color:rgba(20,110,115,.14);color:#38b2b8;border-color:rgba(20,110,115,.38)}
.bs-Evoluir    {background-color:rgba(30,96,176,.12);color:#4080d0;border-color:rgba(30,96,176,.28)}
.bs-Desenvolver{background-color:rgba(80,64,160,.12);color:#8878cc;border-color:rgba(80,64,160,.28)}
.bs-Aguardar   {background-color:rgba(120,64,32,.12);color:#c07040;border-color:rgba(120,64,32,.28)}
.bs-Bloqueado  {background-color:rgba(136,32,32,.14);color:#cc4848;border-color:rgba(136,32,32,.3)}
.bs-NaoIncluir {background-color:rgba(56,60,66,.25);color:#5a6070;border-color:rgba(56,60,66,.45)}
.bs-Instalado  {background-color:rgba(36,90,46,.28);color:#4caf72;border-color:rgba(36,90,46,.55);font-weight:700}
/* STATUS DROPDOWN */
.sdd{position:relative;display:inline-block}
.sdd-trg{cursor:pointer;-webkit-user-select:none;user-select:none;gap:5px;padding-right:7px;transition:filter .1s}
.sdd-trg:hover{filter:brightness(1.15)}
.sdd-arr{font-size:9px;opacity:.45;transition:transform .18s,opacity .18s;line-height:1}
.sdd.open .sdd-trg .sdd-arr{transform:rotate(180deg);opacity:.9}
@keyframes sdd-in{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.sdd-menu{
  display:none;position:fixed;z-index:300;
  background:#0b0c0f;border:1px solid var(--gold2);
  padding:5px;flex-direction:column;gap:2px;min-width:165px;
  box-shadow:0 10px 36px rgba(0,0,0,.8);
}
.sdd.open .sdd-menu{display:flex;animation:sdd-in .12s ease}
.sdd-head{color:var(--text);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;
  padding:2px 6px 5px;border-bottom:1px solid var(--border);margin-bottom:1px;font-weight:700}
.sdd-sep{height:1px;background:var(--border);margin:2px 0}
.sdd-item{
  cursor:pointer;width:100%;box-sizing:border-box;
  justify-content:space-between;padding:3px 8px;
  transition:filter .1s;
}
.sdd-item:hover{filter:brightness(1.3)}
.sdd-item.cur{box-shadow:inset 0 0 0 1px currentColor;filter:brightness(1.2)}
.sdd-chk{opacity:0;font-size:9px;font-weight:900;margin-left:6px;flex-shrink:0}
.sdd-item.cur .sdd-chk{opacity:1}

/* TIPO */
.bt-Client{background:rgba(38,78,128,.2);color:#5a90cc;border-color:rgba(38,78,128,.4)}
.bt-Server{background:rgba(38,100,58,.2);color:#50a870;border-color:rgba(38,100,58,.4)}
.bt-Misto {background:rgba(100,58,128,.2);color:#a070cc;border-color:rgba(100,58,128,.4)}
.bt-q     {background:rgba(50,50,60,.2);color:#606878;border-color:rgba(50,50,60,.3);font-style:italic}

/* ATUAÇÃO */
.ba-Hideout{background:rgba(80,60,18,.2);color:#b89040;border-color:rgba(80,60,18,.4)}
.ba-Raid   {background:rgba(100,28,28,.2);color:#cc5858;border-color:rgba(100,28,28,.4)}
.ba-Ambos  {background:rgba(38,80,80,.2);color:#50b0b0;border-color:rgba(38,80,80,.4)}
.ba-Geral  {background:rgba(38,60,100,.2);color:#6090cc;border-color:rgba(38,60,100,.4)}
.ba-q      {background:rgba(50,50,60,.2);color:#606878;border-color:rgba(50,50,60,.3);font-style:italic}

/* CATEGORIA — mesmo visual em filtro E tabela */
.bk-QoL          {background:rgba(58,100,160,.15);color:#70a0d8;border-color:rgba(58,100,160,.32)}
.bk-Realismo     {background:rgba(140,28,28,.15);color:#d06060;border-color:rgba(140,28,28,.32)}
.bk-Hardcore     {background:rgba(160,20,20,.2);color:#e04848;border-color:rgba(160,20,20,.42)}
.bk-Balanceamento{background:rgba(100,78,18,.15);color:#c8a840;border-color:rgba(100,78,18,.32)}
.bk-Progressão   {background:rgba(58,100,58,.15);color:#70c070;border-color:rgba(58,100,58,.32)}
.bk-Conteúdo     {background:rgba(78,48,120,.15);color:#a080d8;border-color:rgba(78,48,120,.32)}
.bk-Framework    {background:rgba(38,42,50,.3);color:#8090a0;border-color:rgba(58,62,72,.5)}
.bk-Cosmético    {background:rgba(140,58,100,.15);color:#d08098;border-color:rgba(140,58,100,.32)}
.bk-q            {background:rgba(50,50,60,.2);color:#606878;border-color:rgba(50,50,60,.3);font-style:italic}

/* PRIORIDADE */
.bp-Crítica{color:#ff6060;border-color:rgba(200,50,50,.4);background:rgba(200,50,50,.1)}
.bp-Alta   {color:#f0a050;border-color:rgba(200,140,50,.4);background:rgba(200,140,50,.1)}
.bp-Média  {color:#909090;border-color:rgba(110,110,110,.3);background:rgba(70,70,70,.1)}
.bp-Baixa  {color:#505860;border-color:rgba(70,72,80,.3);background:rgba(50,52,58,.1)}
.bp-q      {color:#505860;border-color:rgba(60,60,60,.2);background:transparent;font-style:italic}

/* ESCOPO chips — visual diferente da categoria: outline, sem fill */
.esc-chips{display:flex;gap:3px;flex-wrap:wrap}
.ec{
  display:inline-flex;align-items:center;gap:3px;
  border:1px solid rgba(70,85,100,.45);color:var(--text);
  font-size:9px;padding:1px 5px;white-space:nowrap;
  background:rgba(30,38,48,.5);
}

/* FORGE & REPO links */
.forge-link{
  display:inline-flex;align-items:center;gap:5px;
  color:var(--gold);font-size:11px;font-weight:600;text-decoration:none;
  border-bottom:1px solid rgba(200,169,110,.3);transition:color .12s,border-color .12s;
}
.forge-link:hover{color:var(--gold2);border-color:var(--gold)}
.forge-check{font-size:10px;color:#5aa050}
.repo-link{
  display:inline-flex;align-items:center;gap:4px;
  color:#6090c8;font-size:11px;text-decoration:none;
  border-bottom:1px solid rgba(80,120,180,.25);transition:color .12s,border-color .12s;
  word-break:break-all;
}
.repo-link:hover{color:#80aae0;border-color:#80aae0}
.repo-link svg{flex-shrink:0;opacity:.7}
.repo-absent{color:var(--text);font-size:11px;opacity:.5}
.repo-search{color:#7a5030;font-size:11px}

/* Fn text */
.fn{color:var(--text);font-size:11px;line-height:1.45}

/* INSTALLED BUTTON */
.btn-inst{
  background:transparent;border:1px solid rgba(70,85,100,.5);
  color:var(--text);font-size:10px;font-weight:600;letter-spacing:.04em;
  padding:3px 8px;cursor:pointer;font-family:inherit;
  transition:all .15s;white-space:nowrap;
}
.btn-inst:hover{border-color:#4caf72;color:#4caf72}
.btn-inst.on{background:rgba(36,90,46,.35);border-color:#4caf72;color:#4caf72}
.btn-inst.disabled{cursor:not-allowed;opacity:.45;border-color:rgba(70,85,100,.3);color:var(--text)}
.btn-inst.disabled:hover{border-color:rgba(70,85,100,.3);color:var(--text)}

/* FORGE POPOVER */
.fpop{
  display:none;position:fixed;z-index:500;
  background:#0c0d10;border:1px solid var(--gold2);
  width:280px;box-shadow:0 12px 40px rgba(0,0,0,.85);
  pointer-events:auto;
}
.fpop.visible{display:block}
.fpop-thumb{width:100%;height:118px;overflow:hidden;background:var(--bg3);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.fpop-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.fpop-thumb-placeholder{color:var(--border2);font-size:32px;opacity:.5}
.fpop-body{padding:10px 12px 12px}
.fpop-name{color:var(--gold);font-weight:700;font-size:12px;letter-spacing:.04em;line-height:1.3;margin-bottom:7px}
.fpop-badges{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.fpop-divider{height:1px;background:var(--border);margin-bottom:8px}
.fpop-id{color:var(--text);font-size:10px;margin-bottom:4px}
.fpop-id strong{color:var(--gold2)}
.fpop-link{display:flex;align-items:center;gap:5px;font-size:10px}
.fpop-link a{color:#6090c8;text-decoration:none;word-break:break-all;line-height:1.4}
.fpop-link a:hover{color:#80aae0;text-decoration:underline}
.fpop-arrow{color:var(--text);font-size:9px;flex-shrink:0}
.fpop-ph-hidden{display:none}
.fpop-img-hidden{display:none}
.fpop-cat{background:rgba(200,169,110,.08);border:1px solid rgba(200,169,110,.2);color:var(--gold2);font-size:10px}

/* No results */
.no-results{text-align:center;padding:60px 24px;color:var(--text);letter-spacing:.12em;text-transform:uppercase;font-size:11px}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2)}
::-webkit-scrollbar-thumb:hover{background:var(--gold2)}

/* Footer */
.footer{border-top:1px solid var(--border);padding:10px 24px;color:var(--text);font-size:10px;letter-spacing:.06em;display:flex;align-items:center;justify-content:space-between}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <h1>SPT 4.0 — Inventário de Mods</h1>
    <span class="hdr-sub">Migração 3.x → 4.0 · docs/migration/mods-inventory.md</span>
  </div>
  <div class="hdr-badge">SPT 4.0.x · EFT 0.16.9</div>
</div>

<div class="stats" id="stats"></div>

<div class="filters">
  <div class="search-wrap">
    <div class="lbl">Busca</div>
    <input type="text" id="search" placeholder="Nome do mod..." oninput="render()">
  </div>
  <div class="fg">
    <div class="lbl">Status</div>
    <div class="fr" id="f-status"></div>
  </div>
  <div class="fg">
    <div class="lbl">Tipo</div>
    <div class="fr" id="f-tipo"></div>
  </div>
  <div class="fg">
    <div class="lbl">Atuação</div>
    <div class="fr" id="f-atu"></div>
  </div>
  <div class="fg">
    <div class="lbl">Categoria</div>
    <div class="fr" id="f-cat"></div>
  </div>
  <div class="fg">
    <div class="lbl">Escopo</div>
    <div class="fr" id="f-esc"></div>
  </div>
  <div class="fg">
    <div class="lbl">Origem</div>
    <div class="fr" id="f-origin"></div>
  </div>
  <div class="fg">
    <div class="lbl">SPT 4.0</div>
    <div class="fr" id="f-spt4"></div>
  </div>
  <div class="fg">
    <div class="lbl">Instalado</div>
    <div class="fr" id="f-inst"></div>
  </div>
  <div class="fg">
    <div class="lbl">TRL 3.0?</div>
    <div class="fr" id="f-trl"></div>
  </div>
  <div class="fg">
    <div class="lbl">Revisão</div>
    <div class="fr">
      <button type="button" class="fb" id="f-review" onclick="toggleReview()">⚠ Precisa revisão</button>
    </div>
  </div>
  <div class="fg" style="margin-left:auto">
    <div class="lbl">Ações</div>
    <div class="fr">
      <button type="button" class="fb" onclick="clearAll()" style="border-color:#444">✕ Limpar filtros</button>
    </div>
  </div>
</div>

<div class="tbl-wrap">
  <div class="count-row" id="count-row"></div>
  <table>
    <thead id="thead"></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div class="footer">
  <span>SPT 4.0 Mod Inventory · Gerado de docs/migration/mods-inventory.md</span>
  <span id="footer-date"></span>
</div>

<script>
// ── DATA FORMAT ───────────────────────────────────────────────────────────────
// [n, name, tipo, atuacao, cat, esc_csv, forge_id, r4_path, fn, status, pri, intern, spt4]
// forge_id : null=absent  ""=unknown  "123"=forge mod ID
// r4_path  : null=absent  ""=unknown  "user/repo"=github  "https://..."=other
const MODS = [

[6,"acidphantasm-progressivebotsystem","Client","Raid","Balanceamento","IA","1594","acidphantasm/progressivebotsystem-csharp","Sistema progressivo de bots (era Server/TS em 3.x, reescrito como BepInEx C# para 4.0)","Instalar","?",false,true,"Sim",false],
[7,"acidphantasm-refsptfriendlyquests","Client","Geral","Balanceamento","Quests","1538","acidphantasm/reffriendlyquests-csharp","Quests amigáveis (compatível com Ref — era Server/TS em 3.x, reescrito como BepInEx C# para 4.0)","Instalar","?",false,true,"Sim",false],
[8,"acidphantasm-simpleworkoutqte","Server","Hideout","QoL","Hideout","1437","acidphantasm/acidphantasm-simpleworkoutqte","QTE de workout no hideout","Avaliar","?",false,true,"Sim",false],

// ── STATUS OVERRIDES ──────────────────────────────────────────────────────────
const STATUS_OVR_KEY = 'spt4-mods-status';
function loadStatusOverrides() {
  try { return new Map(Object.entries(JSON.parse(localStorage.getItem(STATUS_OVR_KEY)||'{}')).map(([k,v])=>[+k,v])); }
  catch { return new Map(); }
}
function saveStatusOverrides() {
  const obj = {}; state.statusOverrides.forEach((v,k) => { obj[k]=v; });
  localStorage.setItem(STATUS_OVR_KEY, JSON.stringify(obj));
}
function setStatusOverride(n, status) {
  state.statusOverrides.set(n, status);
  saveStatusOverrides();
  renderStats();
  render();
}
function effectiveStatus(m) {
  return state.statusOverrides.get(m[I.n]) || m[I.status];
}

// ── INSTALLED STATE ───────────────────────────────────────────────────────────
// Source of truth: the "Instalado" column in mods-inventory.md (carried into the
// MODS data by the sync). state.installed is derived from that data at boot.
//
// SERVER_MODE (page served by `node scripts/serve-inventory.js` over http://):
//   toggling writes the column in the .md and re-syncs the HTML — persisted + git.
// file:// (page opened directly): toggling is an IN-SESSION PREVIEW only.
const SERVER_MODE = location.protocol === 'http:' || location.protocol === 'https:';

function deriveInstalled() {
  return new Set(MODS.filter(m => m[I.inst]).map(m => m[I.n]));
}
function toggleInstalled(n) {
  if (!state.installed.has(n)) {
    const m = MODS.find(x => x[I.n] === n);
    if (m && effectiveStatus(m) === 'NaoIncluir') return;
  }
  const willInstall = !state.installed.has(n);
  // optimistic UI
  if (willInstall) state.installed.add(n); else state.installed.delete(n);
  renderStats();
  render();

  if (!SERVER_MODE) return; // file:// — preview only, not persisted

  fetch('/api/installed', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ n, installed: willInstall }),
  })
    .then(r => r.json())
    .then(res => {
      if (!res.ok) throw new Error(res.error || 'falha ao salvar');
      const m = MODS.find(x => x[I.n] === n); // keep in-memory data consistent
      if (m) m[I.inst] = willInstall;
    })
    .catch(err => {
      // revert optimistic change
      if (willInstall) state.installed.delete(n); else state.installed.add(n);
      renderStats();
      render();
      alert('Não foi possível salvar no .md: ' + err.message);
    });
}

const state = {
  sort: {col:'n', dir:1},

  review: false,
  installed: deriveInstalled(),
  statusOverrides: loadStatusOverrides(),
};

// ── HELPERS ───────────────────────────────────────────────────────────────────
function escArr(m) {
  const v = m[I.esc];
  return (!v || v==='?') ? [] : v.split(',');
}

function needsReview(m) {
  return m[I.cat]==='?' || m[I.esc]==='?' || m[I.tipo]==='?' ||
         m[I.status]==='Avaliar' || m[I.r4]==='';
}

  buildGroup('f-status', statusOrder, k => (statusIcons[k]||'')+' '+STATUS_LABELS[k], 'status');

  // Tipo
  buildGroup('f-tipo', ['Client','Server','Misto','?'],
    k => (TIPO_META[k]?.icon||'')+' '+k, 'tipo');

  // Atuação
  buildGroup('f-atu', ['Raid','Ambos','Geral','Hideout','?'],
    k => (ATU_META[k]?.icon||'')+' '+k, 'atu');

  // Categoria
  buildGroup('f-cat', Object.keys(CAT_META),
    k => { const m=CAT_META[k]; return (m.icon?m.icon+' ':'')+m.label; }, 'cat');

  // Escopo
  buildGroup('f-esc', Object.keys(ESC_META),
    k => { const m=ESC_META[k]; return (m.icon?m.icon+' ':'')+k; }, 'esc');

  // Origem
  buildGroup('f-origin', ['community','internal'],
    k => k==='community'?'🌍 Comunidade':'🏠 Internos', 'origin');

  // SPT 4.0
  buildGroup('f-spt4', ['yes','no'],
    k => k==='yes'?'✅ Tem 4.0':'❌ Sem 4.0', 'spt4');

  // Instalado
  buildGroup('f-inst', ['yes','no'],
    k => k==='yes'?'✓ Instalados':'— Não instalados', 'inst');

  // TRL 3.0?
  buildGroup('f-trl', ['Sim','New'],
    k => k==='Sim'?'TRL 3.0':'New', 'trl');
}

function buildGroup(id, keys, labelFn, fk) {
  const el = document.getElementById(id);
  el.innerHTML = '';
  keys.forEach(k => {
    const b = document.createElement('button');
    b.className = 'fb';
    b.textContent = labelFn(k);
    b.onclick = () => { toggleFilter(fk, k, b); };
    el.appendChild(b);
  });
}

function toggleFilter(fk, k, btn) {
  const s = state.filters[fk];
  if (s.has(k)) { s.delete(k); btn.classList.remove('on'); }
  else { s.add(k); btn.classList.add('on'); }
  render();
}

function toggleReview() {
  state.review = !state.review;
  document.getElementById('f-review').classList.toggle('on', state.review);
  render();
}

function clearAll() {
  Object.values(state.filters).forEach(s => s.clear());
  state.review = false;
  document.getElementById('search').value = '';
  document.querySelectorAll('.fb').forEach(b => b.classList.remove('on'));
  render();
}

// ── FILTER + SORT ─────────────────────────────────────────────────────────────
function filtered() {
  const q = document.getElementById('search').value.toLowerCase();
  return MODS.filter(m => {
    if (q && !m[I.name].toLowerCase().includes(q) && !m[I.fn].toLowerCase().includes(q)) return false;
    const {status,tipo,atu,cat,esc,origin,spt4,inst,trl} = state.filters;
    if (status.size) {
      const isInst = state.installed.has(m[I.n]);
      const eff = effectiveStatus(m);
      if (!(status.has('Instalado') && isInst) && !status.has(eff)) return false;
    }
    if (tipo.size && !tipo.has(m[I.tipo])) return false;
    if (atu.size && !atu.has(m[I.atu])) return false;
    if (cat.size && !cat.has(m[I.cat])) return false;
    if (esc.size) {
      const modEscs = escArr(m);
      if (!modEscs.some(e => esc.has(e))) return false;
    }
    if (origin.size) {
      if (origin.has('internal') && !origin.has('community') && !m[I.intern]) return false;
      if (origin.has('community') && !origin.has('internal') && m[I.intern]) return false;
    }
    if (spt4.size) {
      if (spt4.has('yes') && !spt4.has('no') && m[I.spt4] !== true) return false;
      if (spt4.has('no') && !spt4.has('yes') && m[I.spt4] !== false) return false;
    }
    if (inst.size) {
      const isInst = state.installed.has(m[I.n]);
      if (inst.has('yes') && !inst.has('no') && !isInst) return false;
      if (inst.has('no') && !inst.has('yes') && isInst) return false;
    }
    if (trl.size && !trl.has(m[I.trl])) return false;
    if (state.review && !needsReview(m)) return false;
    return true;
  });
}

const SORT_IDX = {n:I.n,name:I.name,tipo:I.tipo,atu:I.atu,cat:I.cat,
                  esc:I.esc,forge:I.forge,r4:I.r4,spt4:I.spt4,fn:I.fn,status:I.status,pri:I.pri,trl:I.trl};

function sorted(list) {
  const {col,dir} = state.sort;
  if (col === 'inst') {
    return [...list].sort((a,b) => {
      const av = state.installed.has(a[I.n]) ? 1 : 0;
      const bv = state.installed.has(b[I.n]) ? 1 : 0;
      return (bv - av) * dir;
    });
  }
  return [...list].sort((a,b) => {
    const av = col==='status' ? effectiveStatus(a) : String(a[SORT_IDX[col]]??'');
    const bv = col==='status' ? effectiveStatus(b) : String(b[SORT_IDX[col]]??'');
    if (col==='n') return (Number(av)-Number(bv))*dir;
    return av.localeCompare(bv,'pt')*dir;
  });
}

function sortBy(col) {
  if (state.sort.col===col) state.sort.dir*=-1;
  else { state.sort.col=col; state.sort.dir=1; }
  document.querySelectorAll('thead th').forEach(th => {
    th.classList.remove('asc','desc');
    if (th.dataset.col===col) th.classList.add(state.sort.dir===1?'asc':'desc');
  });
  render();
}

function b(cls, ...parts) {
  return `<span class="b ${cls}">${parts.join('')}</span>`;
}

function tipoBadge(v) {
  const cls = v==='?'?'bt-q':`bt-${v}`;
  const icon = TIPO_META[v]?.icon||'';
  return b(cls, icon?`<span>${icon}</span>`:'', v);
}

function atuBadge(v) {
  const cls = v==='?'?'ba-q':`ba-${v}`;
  const icon = ATU_META[v]?.icon||'';
  return b(cls, icon?`<span>${icon}</span>`:'', v);
}

function catBadge(v) {
  const cls = v==='?'?'bk-q':`bk-${v}`;
  const meta = CAT_META[v]||{icon:'',label:v};
  return b(cls, meta.icon?`<span>${meta.icon}</span> `:'', meta.label);
}

function statusBadge(v) {
  return b('bs-'+v, STATUS_LABELS[v]||v);
}

function priBadge(v) {

function escCell(m) {

function trlCell(m) {

}

function instCell(m) {
  const on = state.installed.has(m[I.n]);
  const blocked = effectiveStatus(m) === 'NaoIncluir' && !on;
  if (blocked) {
    return `<button class="btn-inst disabled" disabled title="Mod marcado como NÃO INCLUIR">—</button>`;
  }
  return `<button class="btn-inst${on?' on':''}" title="Preview na sessão — para salvar/sincronizar, edite a coluna Instalado no .md e rode o sync" onclick="event.stopPropagation();toggleInstalled(${m[I.n]})">${on?'✓ Sim':'—'}</button>`;
}

const STATUS_OPTS = ['Instalar','Evoluir','Avaliar','Aguardar','Desenvolver','Bloqueado','NaoIncluir'];
function statusCell(m) {
  if (state.installed.has(m[I.n])) return b('bs-Instalado', 'INSTALADO');
  const n = m[I.n];
  const eff = effectiveStatus(m);
  const lbl = STATUS_LABELS[eff] || eff;
  const DESTRUCTIVE = new Set(['Bloqueado','NaoIncluir']);
  let sepDone = false;
  const items = STATUS_OPTS.map(s => {
    let pre = '';
    if (!sepDone && DESTRUCTIVE.has(s)) { sepDone = true; pre = '<div class="sdd-sep"></div>'; }
    return pre + `<div class="sdd-item b bs-${s}${s===eff?' cur':''}" onclick="event.stopPropagation();pickStatus(${n},'${s}')">${STATUS_LABELS[s]||s}<span class="sdd-chk">✓</span></div>`;
  }).join('');
  return `<div class="sdd" id="sdd-${n}">
    <div class="sdd-trg b bs-${eff}" onclick="event.stopPropagation();openSdd(${n})">${lbl}<span class="sdd-arr">▼</span></div>
    <div class="sdd-menu"><div class="sdd-head">Alterar status</div>${items}</div>
  </div>`;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  const list = sorted(filtered());
  document.getElementById('count-row').innerHTML =
    `Exibindo <strong>${list.length}</strong> de <strong>${MODS.length}</strong> mods`;

  // thead
  document.getElementById('thead').innerHTML = '<tr>' + COLS.map(c => {
    const sc = state.sort.col===c.key ? (state.sort.dir===1?'asc':'desc') : '';
    return `<th class="${sc}" data-col="${c.key}" onclick="sortBy('${c.key}')">${c.label}<span class="si"></span></th>`;
  }).join('') + '</tr>';

  if (!list.length) {
    document.getElementById('tbody').innerHTML =
      `<tr><td colspan="${COLS.length}" class="no-results">Nenhum mod encontrado</td></tr>`;
    return;
  }

  document.getElementById('tbody').innerHTML = list.map(m => {
    const rv = needsReview(m);
    const isInst = state.installed.has(m[I.n]);
    const isNaoIncluir = !isInst && effectiveStatus(m) === 'NaoIncluir';
    const nameCls = m[I.intern] ? 'mod-name int' : 'mod-name';
    const revDot = rv ? '<span class="review-dot"></span>' : '';
    const rowCls = isInst ? ' class="installed"' : (isNaoIncluir ? ' class="naoincluir"' : '');
    return `<tr${rowCls}>
      <td class="c-num">${m[I.n]}</td>
      <td class="c-inst">${instCell(m)}</td>
      <td class="c-name"><div class="${nameCls}">${revDot}${m[I.name]}</div></td>
      <td class="c-tipo">${tipoBadge(m[I.tipo])}</td>
      <td class="c-atu">${atuBadge(m[I.atu])}</td>
      <td class="c-cat">${catBadge(m[I.cat])}</td>
      <td class="c-esc">${escCell(m)}</td>
      <td class="c-forge">${forgeCell(m)}</td>
      <td class="c-repo">${r4Cell(m)}</td>
      <td class="c-spt4">${spt4Cell(m)}</td>
      <td class="c-fn"><div class="fn">${m[I.fn]}</div></td>
      <td class="c-status">${statusCell(m)}</td>
      <td class="c-pri">${priBadge(m[I.pri])}</td>
      <td class="c-trl">${trlCell(m)}</td>
    </tr>`;
  }).join('');
}

// ── STATS ──────────────────────────────────────────────────────────────────────
function renderStats() {
  const byStatus = {};
  MODS.forEach(m => { const s = effectiveStatus(m); byStatus[s] = (byStatus[s]||0)+1; });
  const r4present = MODS.filter(m => m[I.r4] && m[I.r4]!=='').length;
  const spt4count = MODS.filter(m => m[I.spt4] === true).length;
  const needsRev  = MODS.filter(needsReview).length;
  const internal  = MODS.filter(m => m[I.intern]).length;
  const instCount = state.installed.size;
  const total = MODS.length;

  function sc(label, val, cls) {
    return `<div class="sc"><span class="lbl">${label}</span><span class="val ${cls}">${val}</span></div>`;
  }

  document.getElementById('stats').innerHTML = [
    sc('Total', total, 'gold'),
    sc('Instalados ✓', instCount, 'inst'),
    '<div class="stats-sep"></div>',
    sc('À Instalar', byStatus.Instalar||0, 'tl'),
    sc('Evoluir', byStatus.Evoluir||0, 'bl'),
    sc('Avaliar', byStatus.Avaliar||0, 'ya'),
    sc('Aguardar', byStatus.Aguardar||0, 'or'),
    sc('Desenvolver', byStatus.Desenvolver||0, 'pu'),
    byStatus.Bloqueado ? sc('Bloqueado', byStatus.Bloqueado, 're') : '',
    '<div class="stats-sep"></div>',
    sc('Repo 4.0', r4present, 'gr'),
    sc('SPT 4.0 ✅', spt4count, 'gr'),
    sc('Internos 🏠', internal, 'bl'),
    sc('Revisão ⚠', needsRev, 'or'),
    `<div style="flex:1 1 100%;padding:2px 0 0 0"><div class="prog-wrap">${
      [
        ...Object.entries(byStatus).map(([k,v]) => {
          const colors = {Instalar:'#1a7a80',Evoluir:'#1e60b0',Avaliar:'#c89020',
                          Aguardar:'#784020',Desenvolver:'#503a90',Bloqueado:'#882020',NaoIncluir:'#3a3f48'};
          return `<div class="prog-seg" style="width:${(v/total*100).toFixed(1)}%;background:${colors[k]||'#444'}"></div>`;
        }),
        instCount ? `<div class="prog-seg" style="width:${(instCount/total*100).toFixed(1)}%;background:#4caf72;opacity:.7"></div>` : '',
      ].join('')
    }</div></div>`,
  ].join('');
}

// ── FORGE POPOVER ─────────────────────────────────────────────────────────────
const _fpop = {el:null, timer:null};
function _fpopSetImg(id) {
  const img  = document.getElementById('fpop-img');
  const ph   = document.getElementById('fpop-ph');
  const stem = FORGE_IMG[id];
  if (stem) {
    img.src = `https://forge-static.sp-tarkov.com/mods/${stem}.png`;
    img.classList.remove('fpop-img-hidden');
    ph.classList.add('fpop-ph-hidden');
  } else {
    img.classList.add('fpop-img-hidden');
    ph.classList.remove('fpop-ph-hidden');
  }
}

function fpopShow(n, anchor) {
  clearTimeout(_fpop.timer);
  const m = MODS.find(x => x[I.n] === n);
  if (!m) return;
  if (!_fpop.el) _fpop.el = document.getElementById('forge-pop');

  const id       = m[I.forge];
  const slug     = FORGE_SLUGS[id] || '';
  const forgeUrl = slug
    ? `https://forge.sp-tarkov.com/mod/${id}/${slug}`
    : `https://forge.sp-tarkov.com/mod/${id}/`;
  const name     = m[I.name].replace(/🏠\s*/,'');
  const catMeta  = CAT_META[m[I.cat]] || {icon:'', label: m[I.cat]};
  const eff      = effectiveStatus(m);

  _fpopSetImg(id);

  document.getElementById('fpop-name').textContent = name;
  document.getElementById('fpop-badges').innerHTML =
    `<span class="b bt-${m[I.tipo]}">${m[I.tipo]}</span>` +
    `<span class="b ba-${m[I.atu]}">${m[I.atu]}</span>` +
    (catMeta.icon ? `<span class="b fpop-cat">${catMeta.icon} ${catMeta.label}</span>` : '') +
    `<span class="b bs-${eff}">${STATUS_LABELS[eff]||eff}</span>`;
  document.getElementById('fpop-id').innerHTML =
    `forge.sp-tarkov.com / mod / <strong>${id}</strong>${slug ? ' / '+slug : ''}`;
  document.getElementById('fpop-url').innerHTML =
    `<a href="${forgeUrl}" target="_blank">${forgeUrl}</a>`;

  // Position: below anchor, avoid right-edge overflow
  const r = anchor.getBoundingClientRect();
  const pw = 280;
  let left = r.left;
  if (left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
  _fpop.el.style.left = left + 'px';
  _fpop.el.style.top  = (r.bottom + 6) + 'px';
  _fpop.el.classList.add('visible');
}
function fpopHide() {
  _fpop.timer = setTimeout(() => { _fpop.el && _fpop.el.classList.remove('visible'); }, 140);
}
function fpopKeep() { clearTimeout(_fpop.timer); }

// ── STATUS DROPDOWN CONTROL ───────────────────────────────────────────────────
let _openSdd = null;
function openSdd(n) {
  const el = document.getElementById('sdd-'+n);
  if (!el) return;
  if (_openSdd && _openSdd !== el) _openSdd.classList.remove('open');
  if (el.classList.contains('open')) { el.classList.remove('open'); _openSdd = null; return; }

  const trg  = el.querySelector('.sdd-trg');
  const menu = el.querySelector('.sdd-menu');
  const r = trg.getBoundingClientRect();
  // tentative: open below the trigger, then measure and adjust to stay on-screen
  menu.style.top  = (r.bottom + 4) + 'px';
  menu.style.left = r.left + 'px';
  el.classList.add('open');                       // render so offsetHeight/Width are real

  const mh = menu.offsetHeight, mw = menu.offsetWidth;
  const spaceBelow = window.innerHeight - r.bottom;
  if (spaceBelow < mh + 8 && r.top > spaceBelow) {           // not enough room below → flip up
    menu.style.top = Math.max(4, r.top - 4 - mh) + 'px';
  }
  menu.style.left = Math.max(4, Math.min(r.left, window.innerWidth - mw - 4)) + 'px'; // keep on-screen
  _openSdd = el;
}
function pickStatus(n, status) {
  if (_openSdd) { _openSdd.classList.remove('open'); _openSdd = null; }
  if (!SERVER_MODE) { setStatusOverride(n, status); return; } // file:// — preview only

  const m = MODS.find(x => x[I.n] === n);
  const prev = m ? m[I.status] : null;
  // optimistic: write the canonical status into the in-memory data (no override)
  if (m) m[I.status] = status;
  renderStats();
  render();

  fetch('/api/status', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ n, status }),
  })
    .then(r => r.json())
    .then(res => { if (!res.ok) throw new Error(res.error || 'falha ao salvar'); })
    .catch(err => {
      if (m) m[I.status] = prev; // revert
      renderStats();
      render();
      alert('Não foi possível salvar o status no .md: ' + err.message);
    });
}
document.addEventListener('click', () => {
  if (_openSdd) { _openSdd.classList.remove('open'); _openSdd = null; }
});

// ── BOOT ──────────────────────────────────────────────────────────────────────
// Installed state is data-driven (Instalado column in the .md) — no localStorage seeding.
// In SERVER_MODE the .md is authoritative for status too: ignore any localStorage
// status overrides (those are only a file:// preview), so the table reflects the .md.
if (SERVER_MODE) state.statusOverrides.clear();
buildFilters();
renderStats();
render();
document.getElementById('footer-date').textContent =
  'Atualizado: ' + new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});

// ── CONNECTION BADGE ────────────────────────────────────────────────────────────
(function connBadge() {
  const b = document.createElement('div');
  b.style.cssText = 'position:fixed;bottom:10px;right:12px;z-index:9998;font:12px system-ui,sans-serif;'
    + 'padding:6px 12px;border-radius:20px;box-shadow:0 2px 8px rgba(0,0,0,.4);'
    + (SERVER_MODE
        ? 'background:#173d23;color:#5fd08a;border:1px solid #2e7d46'
        : 'background:#3a2410;color:#e0a94c;border:1px solid #8a5a1a');
  b.textContent = SERVER_MODE
    ? '● Servidor — cliques salvam no .md'
    : '○ file:// — preview (não salva). Rode: node scripts/serve-inventory.js';
  document.body.appendChild(b);
})();
</script>
<!-- Forge popover (global singleton) -->
<div id="forge-pop" class="fpop"
  onmouseenter="fpopKeep()" onmouseleave="fpopHide()">
  <div class="fpop-thumb" id="fpop-thumb">
    <img id="fpop-img" src="" alt=""
      onload="this.classList.remove('fpop-img-hidden')"
      onerror="this.classList.add('fpop-img-hidden');document.getElementById('fpop-ph').classList.remove('fpop-ph-hidden')">
    <span class="fpop-thumb-placeholder fpop-ph-hidden" id="fpop-ph">⚙</span>
  </div>
  <div class="fpop-body">
    <div class="fpop-name" id="fpop-name"></div>
    <div class="fpop-badges" id="fpop-badges"></div>
    <div class="fpop-divider"></div>
    <div class="fpop-id" id="fpop-id"></div>
    <div class="fpop-link"><span class="fpop-arrow">↗</span><span id="fpop-url"></span></div>
  </div>
</div>
