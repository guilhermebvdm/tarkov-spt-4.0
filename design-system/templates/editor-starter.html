  <header class="trl-topbar">
    <a class="trl-brand" href="#">
      <img src="../assets/trl-logo-mark.png" alt="Tarkov Red Line">
      <span>My Mod</span>
      <span class="trl-brand__version">v0.1.0</span>
    </a>
    <span class="trl-topbar__sep"></span>
    <span class="trl-breadcrumb">
      <a href="#">Profiles</a><span class="trl-breadcrumb__sep">/</span>
      <span class="trl-breadcrumb__current">Default</span>
    </span>
    <span class="trl-topbar__spacer"></span>
    <button class="trl-btn trl-btn--sm"><svg class="trl-icon trl-icon--sm"><use href="#trl-i-refresh"/></svg>Reload</button>
    <button class="trl-btn trl-btn--primary trl-btn--sm"><svg class="trl-icon trl-icon--sm"><use href="#trl-i-device-floppy"/></svg>Save all</button>
  </header>

  <!-- sidebar: primary navigation -->
  <aside class="trl-sidebar">
    <nav class="trl-nav">
      <div class="trl-nav__label">My Mod</div>
      <a class="trl-nav__item is-active" href="#">Overview</a>
      <a class="trl-nav__item" href="#">Items</a>
      <a class="trl-nav__item" href="#">Settings</a>
    </nav>
  </aside>

  <!-- main: toolbar + 3-column workspace (collapses under 1100px) -->
  <main class="trl-main">
    <div class="trl-eyebrow">My Mod · Editor</div>
    <h1 class="trl-h2">Overview</h1>

    <div class="trl-toolbar">
      <span class="trl-search" style="width:260px">
        <input class="trl-input" name="search" placeholder="Search…">
        <button class="trl-search__clear" type="button">×</button>
      </span>
      <div class="trl-multiselect" id="filter-category">
        <button class="trl-multiselect__trigger" type="button">
          Category
          <span class="trl-multiselect__count">1</span>
        </button>
        <div class="trl-multiselect__panel">
          <div class="trl-multiselect__option is-checked">General</div>
          <div class="trl-multiselect__option">Advanced</div>
        </div>
      </div>
      <span class="trl-toolbar__spacer"></span>
      <span class="trl-tag trl-tag--green"><span class="trl-tag__dot"></span>Server online</span>
    </div>

    <div class="trl-workspace trl-u-mt-3">

      <!-- left: list/tree panel -->
      <div class="trl-panel trl-panel--flush">
        <div class="trl-screen-bar">
          <span class="trl-screen-bar__dot trl-screen-bar__dot--ok"></span>
          <span class="trl-screen-bar__title">◪ Entries</span>
          <span class="trl-screen-bar__meta">3</span>
        </div>
        <div class="trl-panel__body" style="padding:8px 0">
          <div class="trl-tree">
            <div class="trl-tree__node is-active"><span class="trl-tree__chev" style="visibility:hidden"></span>First entry</div>
            <div class="trl-tree__node"><span class="trl-tree__chev" style="visibility:hidden"></span>Second entry</div>
            <div class="trl-tree__node"><span class="trl-tree__chev" style="visibility:hidden"></span>Third entry</div>
          </div>
        </div>
      </div>

      <!-- center: main editing surface (no --flush: forms need the body padding) -->
      <div class="trl-panel">
        <div class="trl-screen-bar">
          <!-- swap --ok for --live while there are unsaved changes -->
          <span class="trl-screen-bar__dot trl-screen-bar__dot--ok"></span>
          <span class="trl-screen-bar__title">◪ First entry</span>
          <span class="trl-screen-bar__meta">synced</span>
        </div>
        <div class="trl-panel__body">
          <div class="trl-form-grid">
            <label class="trl-field">
              <span class="trl-field__label">Name</span>
              <input class="trl-input" name="entry-name" value="First entry">
            </label>
            <label class="trl-field">
              <span class="trl-field__label">Category</span>
              <select class="trl-select" name="category"><option>General</option><option>Advanced</option></select>
            </label>
            <label class="trl-field trl-form-grid__full">
              <span class="trl-field__label">Description</span>
              <textarea class="trl-input" name="description" placeholder="Optional notes…"></textarea>
            </label>
          </div>
          <div class="trl-u-flex trl-u-gap-4 trl-u-mt-3">
            <label class="trl-switch"><input type="checkbox" name="enabled" checked><span>Enabled</span></label>
            <label class="trl-checkbox"><input type="checkbox" name="fika-only"><span>Fika-only</span></label>
          </div>
        </div>
      </div>

      <!-- right: summary / details -->
      <div class="trl-panel">
        <div class="trl-panel__head"><h2 class="trl-panel__title">Summary</h2></div>
        <div class="trl-panel__body">
          <ul class="trl-kv">
            <li class="trl-kv__row"><span class="trl-kv__k">Status</span><span class="trl-kv__v"><b>Valid</b></span></li>
            <li class="trl-kv__row"><span class="trl-kv__k">Updated</span><span class="trl-kv__v trl-u-num">2026-07-03</span></li>
          </ul>
          <hr class="trl-divider">
          <div class="trl-sec">Progress</div>
          <div class="trl-progress"><div class="trl-progress__fill" style="width:66%"></div></div>
          <div class="trl-u-faint trl-u-mt-1" style="font-size:11px">2 of 3 entries configured</div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- toasts mount here; append .trl-toast nodes from your app code -->
<div class="trl-toast-container" id="toasts"></div>

<script>
/* keep scripts inline if this ever ships inside a mod's wwwroot —
 * SPT's ModValidator rejects loose .js files. */
(function () {
  'use strict';
  /* multiselect: toggle + check + count (panel persists across clicks) */
  var ms = document.getElementById('filter-category');
  var count = ms.querySelector('.trl-multiselect__count');
  ms.querySelector('.trl-multiselect__trigger').addEventListener('click', function () {
    ms.classList.toggle('is-open');
  });
  ms.querySelectorAll('.trl-multiselect__option').forEach(function (opt) {
    opt.addEventListener('click', function () {
      opt.classList.toggle('is-checked');
      count.textContent = ms.querySelectorAll('.trl-multiselect__option.is-checked').length;
    });
  });
  document.addEventListener('click', function (e) {
    if (!ms.contains(e.target)) ms.classList.remove('is-open');
  });

  /* search clear */
  document.querySelectorAll('.trl-search').forEach(function (sw) {
    var clear = sw.querySelector('.trl-search__clear');
    var input = sw.querySelector('.trl-input');
    if (clear && input) clear.addEventListener('click', function () {
      input.value = '';
      input.dispatchEvent(new Event('input', { bubbles: true }));
      input.focus();
    });
  });
})();
</script>
</body>
</html>
