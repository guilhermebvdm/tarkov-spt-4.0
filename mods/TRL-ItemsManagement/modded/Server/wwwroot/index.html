      toast(`${(item && (item.shortName || item.name)) || tpl}: buyback override removed → reference · restart SPT to apply${data.warning ? ` (${data.warning})` : ''}`, data.warning ? 'warn' : 'ok');
    } catch (err) {
      toast('Failed to restore: ' + err.message, 'err');
      restore.disabled = false; save.disabled = false; cancel.disabled = false;
    }
  };
}

function renderDetail(it) {
  const c = it.consolidated;
  const dev = it.tarkovDev && it.tarkovDev.pve;
  const reg = it.tarkovDev && it.tarkovDev.regular;
  const mkt = it.tarkovMarket && it.tarkovMarket.pve;
  const spt = it.spt;

  const traderSell = buildBuySourceRows(it);

  const sptTraders = spt && spt.traders ? spt.traders : [];

  return `<div class="detail-grid">
    <div class="detail-img">
      ${it.image && it.image.large ? `<img src="${escapeAttr(it.image.large)}" alt="">` : '<div class="no-img" style="width:200px;height:200px">no image</div>'}
      <div class="meta-line">
        <b>${escapeHtml(it.name || '')}</b><br>
        <span class="types">${(it.types||[]).join(', ')}</span><br>
        ${it.wikiLink ? `<a href="${escapeAttr(it.wikiLink)}" target="_blank">Wiki ↗</a> · ` : ''}
        ${mkt && mkt.link ? `<a href="${escapeAttr(mkt.link)}" target="_blank">Market ↗</a>` : `<a href="https://tarkov-market.com/?search=${escapeAttr(it.id)}" target="_blank">Market ↗</a>`} ·
        <a href="${it.normalizedName ? 'https://tarkov.dev/item/'+escapeAttr(it.normalizedName) : 'https://tarkov.dev/?search='+escapeAttr(it.id)}" target="_blank">tarkov.dev ↗</a>
      </div>
      <div class="meta-line">
        ID: <code>${escapeHtml(it.id)}</code><br>
        Dims: ${it.dims ? `${it.dims.weight}kg · ${it.dims.width}×${it.dims.height}` : '—'}
        ${it.grids && it.grids.length ? '<br>Grid: ' + it.grids.map(g =>
          `${g.cellsH}×${g.cellsV}` + (g.name && it.grids.length > 1 ? ` (${escapeHtml(g.name)})` : '')
        ).join(' · ') + ` <span class="vendor">= ${it.grids.reduce((sum,g) => sum + g.cellsH*g.cellsV, 0)} slots</span>` : ''}
      </div>
    </div>
    <div class="detail-sections">

      <div class="detail-section">
        <h3>SPT base / handbook</h3>
        <table>
          <tr><td class="k">basePrice</td><td class="v">${fmt(spt && spt.basePrice)} ₽</td></tr>
          <tr><td class="k">condition</td><td class="v">${c.conditionType}</td></tr>
          <tr><td class="k">group</td><td class="v">${escapeHtml(c.group||'—')}</td></tr>
          <tr><td class="k">path</td><td class="v">${(it.category && it.category.path || []).join(' › ')}</td></tr>
          <tr><td class="k">flea ban</td><td class="v">${spt && spt.fleaBanned ? '<span class="banned-icon">'+ICON_BANNED+'</span> banned ('+spt.fleaBanReasons.join(', ')+')' : '✓ allowed'}</td></tr>
        </table>
      </div>

      <div class="detail-section source-card source-card--spt">
        <h3>SPT <small class="source-card__when">${fmtRelTime(META && META.sources && META.sources.spt && META.sources.spt.fleaPricesMtime)}</small></h3>
        <table>
          <tr><td class="k">fleaPrice</td><td class="v">${fmt(c.priceFleaSpt)} ₽</td></tr>
          <tr><td class="k">source</td><td class="v">${META && META.sources && META.sources.spt && escapeHtml(META.sources.spt.fleaPricesSource || '—')}</td></tr>
        </table>
      </div>

      <div class="detail-section source-card source-card--dev">
        <h3>tarkov.dev <small class="source-card__when">${fmtRelTime(dev && dev.updated)}</small></h3>
        <table>
          <tr><td class="k">avg 24h</td><td class="v">${fmt(c.priceFleaDevAvg24h)} ₽</td></tr>
          <tr><td class="k">lastLow</td><td class="v">${fmt(c.priceFleaDevLastLow)} ₽</td></tr>
          <tr><td class="k">low 24h</td><td class="v">${fmt(dev && dev.low24h)} ₽</td></tr>
          <tr><td class="k">high 24h</td><td class="v">${fmt(dev && dev.high24h)} ₽</td></tr>
          <tr><td class="k">change 48h</td><td class="v">${dev && dev.change48h != null ? (dev.change48h>0?'+':'') + fmt(dev.change48h) + ' ₽ ' + (dev.change48hPct != null ? `<small class="vendor">(${(dev.change48hPct>0?'+':'')+dev.change48hPct.toFixed(1)}%)</small>` : '') : '—'}</td></tr>
        </table>
      </div>

      <div class="detail-section source-card source-card--market">
        <h3>tarkov-market <small class="source-card__when">${fmtRelTime(mkt && mkt.updated)}</small></h3>
        <table>
          <tr><td class="k">avg 24h</td><td class="v">${fmt(c.priceFleaMarketAvg24h)} ₽</td></tr>
          <tr><td class="k">avg 7d</td><td class="v">${fmt(mkt && mkt.avg7days)} ₽</td></tr>
          <tr><td class="k">price (last)</td><td class="v">${fmt(mkt && mkt.price)} ₽</td></tr>
          <tr><td class="k">trader (best)</td><td class="v">${mkt && mkt.traderName ? escapeHtml(mkt.traderName) + ' · ' + fmt(mkt.traderPrice) + ' ₽' : '—'}</td></tr>
        </table>
      </div>

      <div class="detail-section detail-section--full">
        <h3>Trader buy (tarkov.dev ref) — best: <span class="price is-canonical" data-tip="What the trader pays you (buyback)">${c.priceTraderSell ? fmt(c.priceTraderSell.value)+' ₽ ('+escapeHtml(c.priceTraderSell.vendor)+')' : '—'}</span>${BUY_MOD_INSTALLED ? '' : ' <span class="trader-mod-warn" data-tip="Install TRLTraderPrices (client + server) for edits to take effect in-game.">⚠ mod not installed</span>'}</h3>
        <table class="buy-edit-table" data-buy-tpl="${escapeAttr(it.id)}">
          ${traderSell.length === 0 ? '<tr><td>—</td></tr>' :
            traderSell.map(s => renderBuyRow(it, s)).join('')}
        </table>
        <div class="trader-edit-note${BUY_MOD_INSTALLED ? '' : ' is-warn'}">${BUY_MOD_INSTALLED
          ? 'Edit in the trader\'s native currency — what the trader pays YOU (buyback). Requires the client-side patch too (Rota B); restart SPT to apply.'
          : 'TRLTraderPrices not installed — edits are saved but inert. Install both mod halves (client + server), then restart SPT to apply.'}</div>
      </div>

      <div class="detail-section detail-section--full">
        <h3>Trader sell (SPT assort) <span class="vendor" style="text-transform:none;font-weight:400" data-tip="The price the trader sells this for — what you pay. This is the editable price.">— what you pay</span>${TRADER_MOD_INSTALLED ? '' : ' <span class="trader-mod-warn" data-tip="Install TRLTraderPrices for edits to take effect in-game.">⚠ mod not installed</span>'}</h3>
        <table class="trader-edit-table" data-trader-tpl="${escapeAttr(it.id)}">
          ${sptTraders.length === 0 ? '<tr><td>—</td></tr>' :
            sptTraders.map(t => renderTraderRow(it, t)).join('')}
        </table>
        <div class="trader-edit-note${TRADER_MOD_INSTALLED ? '' : ' is-warn'}">${TRADER_MOD_INSTALLED
          ? 'Edit in the trader\'s native currency (the amount the game charges). Applies to all loyalty levels. Restart SPT to apply.'
          : 'TRLTraderPrices not installed — edits are saved but inert. Install the mod, then restart SPT to apply.'}</div>
      </div>

    </div>
  </div>`;
}

// ── Utilities ───────────────────────────────────────────────────────────────
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

load();
</script>
