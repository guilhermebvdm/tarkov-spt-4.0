// Shareable/bookmarkable view state. Read side: a snapshot taken once at script load,
// consulted by each buildXFilter()/buildDeltaFilter()/bindControls()/load() to seed
// initial state (URL wins over localStorage when present). Write side: syncUrlFromState()
// (near render()) mirrors current state back into the URL via replaceState on every
// render, so it never pollutes browser back-history.
const URL_INITIAL = new URLSearchParams(location.search);
function urlListOverride(paramKey, storageKey, targetSet) {
  if (URL_INITIAL.has(paramKey)) {
    URL_INITIAL.get(paramKey).split(',').filter(Boolean).forEach(v => targetSet.add(v));
    // Consume it: buildEditedFilter() (and any future buildXFilter()) gets rebuilt after
    // every edit via refreshEditedFilter() to refresh its counts — without deleting the
    // key here, that rebuild would re-add this frozen page-load snapshot on top of
    // whatever the user has since picked, silently reintroducing a deselected value.
    URL_INITIAL.delete(paramKey);
    return;
  }
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey) || '[]');
    if (Array.isArray(saved)) saved.forEach(v => targetSet.add(v));
  } catch (e) { /* ignore */ }
}

// Reusable dropdown component (single or multi-select). Options shape:
//   [{ value: string, label: string, icon?: string, count?: number }]
// Returns { root, getValue, setValue, refresh } where value is an array.
function createDropdown({ placeholder, options, multi = false, searchable = false, onChange }) {
  const selected = new Set();
  const root = document.createElement('div');
  root.className = 'dropdown' + (multi ? ' dropdown--multi' : '');

  const trigger = document.createElement('button');
  trigger.type = 'button';
  trigger.className = 'dropdown__trigger';
  trigger.innerHTML = '<span class="dropdown__label"></span><span class="dropdown__badge" style="display:none">0</span><span class="chev"></span>';
  root.appendChild(trigger);

  const panel = document.createElement('div');
  panel.className = 'dropdown__panel';
  root.appendChild(panel);

  // Optional search input
  let searchInput = null;
  if (searchable) {
    searchInput = document.createElement('input');
    searchInput.type = 'text';
    searchInput.className = 'dropdown__search';
    searchInput.placeholder = 'Filter…';
    panel.appendChild(searchInput);
  }

  // Action buttons (only for multi)
  if (multi) {
    const actions = document.createElement('div');
    actions.className = 'dropdown__actions';
    const clearBtn = document.createElement('button');
    clearBtn.type = 'button'; clearBtn.className = 'dropdown__action'; clearBtn.textContent = 'Clear';
    clearBtn.onclick = (e) => { e.stopPropagation(); selected.clear(); refresh(); emit(); };
    const selectAllBtn = document.createElement('button');
    selectAllBtn.type = 'button'; selectAllBtn.className = 'dropdown__action'; selectAllBtn.textContent = 'All';
    selectAllBtn.onclick = (e) => { e.stopPropagation(); options.forEach(o => selected.add(o.value)); refresh(); emit(); };
    actions.appendChild(clearBtn);
    actions.appendChild(selectAllBtn);
    panel.appendChild(actions);
  }

  const optionsList = document.createElement('div');
  optionsList.className = 'dropdown__options';
  panel.appendChild(optionsList);

  function renderOptions() {
    optionsList.innerHTML = '';
    if (!options.length) {
      const empty = document.createElement('div');
      empty.className = 'dropdown__empty';
      empty.textContent = 'No options';
      optionsList.appendChild(empty);
      return;
    }
    for (const opt of options) {
      const item = document.createElement('div');
      item.className = 'dropdown__option' + (selected.has(opt.value) ? ' is-selected' : '');
      item.dataset.value = opt.value;
      item.dataset.label = (opt.label || '').toLowerCase();
      const check = multi ? '<span class="check"></span>' : '';
      // Icon: prefer raw HTML (`iconHtml`) for inline SVG/symbols, fall back to URL (`icon`)
      let icon = '';
      if (opt.iconHtml)      icon = `<span class="icon">${opt.iconHtml}</span>`;
      else if (opt.icon)     icon = `<span class="icon"><img src="${escapeAttr(opt.icon)}" alt="" loading="lazy"></span>`;
      const count = opt.count != null ? `<span class="count">${opt.count}</span>` : '';
      // Label: if opt.badge is set, render the table-style badge instead of plain text
      const labelText = opt.label || opt.value;
      const label = opt.badge
        ? `<span class="label"><span class="badge badge--${escapeAttr(opt.badge)}">${escapeHtml(labelText)}</span></span>`
        : `<span class="label">${escapeHtml(labelText)}</span>`;
      item.innerHTML = check + icon + label + count;
      item.onclick = (e) => {
        e.stopPropagation();
        if (multi) {
          if (selected.has(opt.value)) selected.delete(opt.value);
          else selected.add(opt.value);
          item.classList.toggle('is-selected');
        } else {
          selected.clear();
          selected.add(opt.value);
          close();
        }
        refresh();
        emit();
      };
      optionsList.appendChild(item);
    }
  }

  function refresh() {
    const label = root.querySelector('.dropdown__label');
    const badge = root.querySelector('.dropdown__badge');
    if (selected.size === 0) {
      label.textContent = placeholder;
      label.style.color = '';
      badge.style.display = 'none';
    } else if (multi) {
      label.textContent = placeholder;
      badge.textContent = selected.size;
      badge.style.display = '';
    } else {
      const first = [...selected][0];
      const opt = options.find(o => o.value === first);
      label.textContent = opt ? (opt.label || opt.value) : first;
      label.style.color = 'var(--fg-primary)';
      badge.style.display = 'none';
    }
    // Update selected visual on existing option elements
    for (const el of optionsList.querySelectorAll('.dropdown__option')) {
      el.classList.toggle('is-selected', selected.has(el.dataset.value));
    }
  }

  function emit() { if (onChange) onChange([...selected]); }

  function open()  { root.classList.add('is-open'); if (searchInput) { searchInput.value=''; applySearch(''); setTimeout(() => searchInput.focus(), 0); } }
  function close() { root.classList.remove('is-open'); }
  function toggle() { root.classList.contains('is-open') ? close() : open(); }

  function applySearch(q) {
    q = q.toLowerCase();
    for (const el of optionsList.querySelectorAll('.dropdown__option')) {
      el.classList.toggle('is-hidden', q && !el.dataset.label.includes(q));
    }
  }

  trigger.addEventListener('click', (e) => { e.stopPropagation(); toggle(); });
  if (searchInput) searchInput.addEventListener('input', () => applySearch(searchInput.value));
  document.addEventListener('click', (e) => { if (!root.contains(e.target)) close(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });

  renderOptions();
  refresh();

  return {
    root,
    getValue: () => [...selected],
    setValue: (vals) => { selected.clear(); (vals||[]).forEach(v => selected.add(v)); renderOptions(); refresh(); },
    setOptions: (newOpts) => { options = newOpts; renderOptions(); refresh(); },
  };
}

// ── Number formatting ───────────────────────────────────────────────────────
const fmt    = (n) => n == null ? '—' : n.toLocaleString('en-US');

// Relative time for "last updated" displays. Returns short label + ISO tooltip.
function fmtRelTime(iso) {
  if (!iso) return '—';
  const t = new Date(iso).getTime();
  if (Number.isNaN(t)) return '—';
  const diffMs = Date.now() - t;
  const abs = Math.abs(diffMs);
  const m = Math.round(abs / 60000);
  const h = Math.round(abs / 3600000);
  const d = Math.round(abs / 86400000);
  let label;
  if (abs < 60000) label = 'now';
  else if (m < 60) label = `${m} min ago`;
  else if (h < 24) label = `${h}h ago`;
  else if (d < 30) label = `${d}d ago`;
  else label = new Date(iso).toLocaleDateString('en-US');
  return `<span title="${escapeAttr(new Date(iso).toLocaleString('en-US'))}">${label}</span>`;
}

// Percent vs SPT reference. Returns HTML span. Empty string when not computable.
function pctVsSpt(value, sptValue) {
  if (value == null || sptValue == null || sptValue === 0) return '';
  const pct = ((value - sptValue) / sptValue) * 100;
  if (Math.abs(pct) < 0.05) return '<span class="pct is-zero">= 0%</span>';
  const cls = pct > 0 ? 'is-up' : 'is-down';
  const arrow = pct > 0 ? '▲' : '▼';
  const sign  = pct > 0 ? '+' : '';
  return `<span class="pct ${cls}">${arrow} ${sign}${pct.toFixed(1)}%</span>`;
}

// External (dev/market) prices for cheap/niche mods are frequently polluted by
// troll listings (e.g. a Glock rear sight at 2,000,000 on tarkov.dev and 99,656
// on tarkov-market — both real API values, both garbage). These columns are
// reference-only and never drive the SPT flea, so we don't alter the value — we
// just flag one that towers over the SPT flea so it isn't trusted at face value.
// Mirrors SPT's own unreasonableModPrices spirit (×6).
const TROLL_FACTOR = 6;
const TROLL_MIN_ABS = 50000;
function trollFlag(value, sptValue) {
  if (value == null || sptValue == null || sptValue <= 0) return '';
  if (value < TROLL_MIN_ABS || value <= sptValue * TROLL_FACTOR) return '';
  const x = Math.round(value / sptValue);
  return ` <span class="troll-flag" data-tip="Probable troll listing: ${value.toLocaleString('en-US')} ₽ is ~${x}× the SPT flea (${sptValue.toLocaleString('en-US')} ₽). Real value from the external source, but not reliable as a reference.">⚠</span>`;
}

// ── Load ────────────────────────────────────────────────────────────────────
// Render skeleton rows synchronously, before kicking off fetch — first paint
// shows shimmer placeholders instead of blank/text.
function renderSkeleton(count) {
  const skel = document.getElementById('skel');
  if (!skel) return;
  const rows = [];
  for (let i = 0; i < count; i++) {
    rows.push(
      '<div class="skel-row">' +
        '<div class="skel-box skel-box--img"></div>' +
        '<div><div class="skel-box" style="width:70%"></div><div class="skel-box" style="width:35%;height:9px;margin-top:4px"></div></div>' +
        '<div class="skel-box" style="width:60%"></div>' +
        '<div class="skel-box skel-box--tall" style="width:50%"></div>' +
        '<div class="skel-box" style="width:80%"></div>' +
        '<div class="skel-box" style="width:80%"></div>' +
        '<div class="skel-box" style="width:80%"></div>' +
        '<div class="skel-box" style="width:80%"></div>' +
        '<div class="skel-box" style="width:80%"></div>' +
      '</div>');
  }
  skel.innerHTML = rows.join('');
}

async function load() {
  renderSkeleton(14);
  try {
    const [items, cats, meta, traders] = await Promise.all([
      fetch(API_BASE + '/data/items.json').then(r => r.json()),
      fetch(API_BASE + '/data/categories.json').then(r => r.json()),
      fetch(API_BASE + '/data/meta.json').then(r => r.json()),
      fetch(API_BASE + '/data/traders.json').then(r => r.json()).catch(() => ({})),
    ]);
    ITEMS = items;
    CATEGORIES = cats;
    META = meta;
    TRADERS = traders || {};
    // The catalog files (items/categories/traders.json, produced by the Node pipeline) embed
    // /spt-images/... paths root-relative to the OLD standalone dev server. Rewrite every one, ONCE,
    // right here at load — mutating the shared data objects in place — instead of chasing every
    // render call site that reads it.category.icon / a CATEGORIES tree node's .icon / TRADERS[x].avatar.
    const fixSptImagePath = (p) => (typeof p === 'string' && p.startsWith('/spt-images/')) ? API_BASE + p : p;
    for (const it of Object.values(ITEMS)) {
      if (it && it.category) it.category.icon = fixSptImagePath(it.category.icon);
    }
    (function fixCategoryIcons(node) {
      if (!node) return;
      node.icon = fixSptImagePath(node.icon);
      if (node.children) node.children.forEach(fixCategoryIcons);
    })(CATEGORIES);
    for (const meta_ of Object.values(TRADERS)) {
      if (meta_) meta_.avatar = fixSptImagePath(meta_.avatar);
    }
    // Currency conversion rates (rubles per unit) for the in-game native preview.
    // RUB is implicit (=1). Missing currencies fall back to 1 (no conversion shown).
    {
      const rates = (META && META.sources && META.sources.spt && META.sources.spt.currencyRates) || {};
      CURRENCY_RATES = { RUB: 1 };
      for (const k of ['USD', 'EUR', 'GP']) {
        if (rates[k] != null && rates[k] > 0) CURRENCY_RATES[k] = rates[k];
      }
    }
    // Build reverse lookup (id → nickname) so detail rows can resolve a trader's
    // display name / avatar from the traderId carried on each offer.
    TRADER_ID_TO_NAME = {};
    for (const [name, meta_] of Object.entries(TRADERS)) {
      if (meta_ && meta_.id) TRADER_ID_TO_NAME[meta_.id] = name;
    }
    // Trader-price overrides (companion mod TRLTraderPrices). Tolerate failure —
    // the section still renders base prices without override badges.
    try {
      const tr = await fetch(API_BASE + '/trader-overrides').then(r => r.json());
      TRADER_OVERRIDES = (tr && tr.ok && tr.overrides) ? tr.overrides : {};
      TRADER_MOD_INSTALLED = (tr && tr.ok) ? (tr.modInstalled !== false) : true;
    } catch (_) { TRADER_OVERRIDES = {}; TRADER_MOD_INSTALLED = true; }

    // B-3: buy-price (buyback) overrides — same companion mod, separate config file. Tolerate
    // failure the same way (base tarkov.dev reference prices still render without OVR badges).
    try {
      const bo = await fetch(API_BASE + '/trader-buy-overrides').then(r => r.json());
      BUY_OVERRIDES = (bo && bo.ok && bo.overrides) ? bo.overrides : {};
      BUY_MOD_INSTALLED = (bo && bo.ok) ? (bo.modInstalled !== false) : true;
    } catch (_) { BUY_OVERRIDES = {}; BUY_MOD_INSTALLED = true; }

    // Walk category tree once and index icon URLs by both id and name so the
    // table's Group column can find the right icon for any item. (Icons themselves were
    // already rewritten to their API_BASE-prefixed form above, in the fixCategoryIcons pass.)
    (function indexIcons(node) {
      if (!node) return;
      if (node.id && node.icon)   CATEGORY_ICONS[node.id] = node.icon;
      if (node.name && node.icon) CATEGORY_ICONS[node.name] = node.icon;
      if (node.children) node.children.forEach(indexIcons);
    })(CATEGORIES);
    ITEM_LIST = Object.values(items);
    countCategories();
    // URL-shareable category selection — restored before the sidebar renders so the
    // active node is highlighted immediately (see syncUrlFromState() for the write side).
    if (URL_INITIAL.has('cat')) {
      const wantedCat = URL_INITIAL.get('cat');
      if (findCatNode(CATEGORIES, wantedCat)) activeCategoryId = wantedCat;
    }
    renderSidebar();
    if (activeCategoryId != null) expandAncestorsInSidebar(activeCategoryId);
    buildGroupFilter();
    buildConditionFilter();
    buildBanFilter();
    buildModFilter();
    buildEditedFilter();
    buildDeltaFilter();
    bindControls();
    render();
    document.getElementById('q').focus();
  } catch (e) {
    document.getElementById('main').innerHTML =
      '<div class="empty">Failed to load JSONs.<br>Use <code>node viewer/serve.js</code> and open http://localhost:8080/viewer/<br><br>' + e.message + '</div>';
  }
}

const BAN_STORAGE_KEY       = 'trl-items-management.bans';
const EDITED_STORAGE_KEY    = 'trl.editedFilter';
const MOD_STORAGE_KEY       = 'trl-items-management.mods';

let conditionDropdown = null;

function buildDeltaFilter() {
  // Restore persisted state (URL query params win over localStorage).
  if (URL_INITIAL.has('deltaSrc') || URL_INITIAL.has('deltaMin') || URL_INITIAL.has('deltaMax')) {
    const src = URL_INITIAL.get('deltaSrc');
    if (src === 'dev' || src === 'market') deltaSource = src;
    const minRaw = URL_INITIAL.get('deltaMin');
    if (minRaw) { const n = parseFloat(minRaw); if (Number.isFinite(n)) deltaMin = n; }
    const maxRaw = URL_INITIAL.get('deltaMax');
    if (maxRaw) { const n = parseFloat(maxRaw); if (Number.isFinite(n)) deltaMax = n; }
    // Consume — see urlListOverride()'s comment: nothing rebuilds this filter today, but
    // this keeps the same "apply once, then defer to localStorage" contract if one ever does.
    URL_INITIAL.delete('deltaSrc'); URL_INITIAL.delete('deltaMin'); URL_INITIAL.delete('deltaMax');
  } else {
    try {
      const saved = JSON.parse(localStorage.getItem(DELTA_STORAGE_KEY) || 'null');
      if (saved) {
        if (saved.source === 'dev' || saved.source === 'market') deltaSource = saved.source;
        if (typeof saved.min === 'number') deltaMin = saved.min;
        if (typeof saved.max === 'number') deltaMax = saved.max;
      }
    } catch (e) {}
  }

  function saveDelta() {
    try { localStorage.setItem(DELTA_STORAGE_KEY, JSON.stringify({ source: deltaSource, min: deltaMin, max: deltaMax })); } catch (e) {}
  }

  // Compact host: a toggle button + a popover holding the (unchanged) delta UI.
  const host = document.createElement('div');
  host.className = 'delta-pop';

  const trigger = document.createElement('button');
  trigger.type = 'button';
  trigger.className = 'bulk-btn delta-pop__trigger';
  trigger.setAttribute('aria-haspopup', 'true');
  trigger.setAttribute('aria-expanded', 'false');
  trigger.setAttribute('data-tip', 'Filter by % delta of an external price vs the SPT flea');
  trigger.setAttribute('data-tip-pos', 'bottom');
  trigger.innerHTML = 'Δ% <span class="delta-pop__badge" hidden></span><span class="chev"></span>';
  host.appendChild(trigger);

  // The original delta UI, verbatim — only relocated inside the popover.
  const root = document.createElement('div');
  root.className = 'delta-filter delta-pop__panel';

  root.innerHTML =
    '<span class="delta-filter__label">Δ%</span>' +
    '<button type="button" class="delta-filter__src" data-src="dev"  title="Compare vs tarkov.dev avg24h">Dev</button>' +
    '<button type="button" class="delta-filter__src" data-src="market" title="Compare vs tarkov-market avg24h">Market</button>' +
    '<span class="delta-filter__sep">·</span>' +
    '<input class="delta-filter__input" id="delta-min" type="number" placeholder="min%" step="1" title="Min delta (e.g. -50)">' +
    '<span class="delta-filter__range-sep">…</span>' +
    '<input class="delta-filter__input" id="delta-max" type="number" placeholder="max%" step="1" title="Max delta (e.g. +200)">' +
    '<button type="button" class="delta-filter__clear" id="delta-clear" title="Clear delta filter">×</button>';
  host.appendChild(root);

  const btnDev    = root.querySelector('[data-src="dev"]');
  const btnMarket = root.querySelector('[data-src="market"]');
  const inputMin  = root.querySelector('#delta-min');
  const inputMax  = root.querySelector('#delta-max');
  const btnClear  = root.querySelector('#delta-clear');

  function updateSrcButtons() {
    btnDev.classList.toggle('is-active',    deltaSource === 'dev');
    btnMarket.classList.toggle('is-active', deltaSource === 'market');
  }
  function updateClearVisibility() {
    btnClear.style.display = (deltaMin !== null || deltaMax !== null) ? '' : 'none';
  }
  // Active state on the compact trigger when a min/max bound is set.
  function updateTriggerState() {
    const active = (deltaMin !== null || deltaMax !== null);
    trigger.classList.toggle('is-active', active);
    const badge = trigger.querySelector('.delta-pop__badge');
    if (badge) {
      const lo = deltaMin !== null ? deltaMin + '%' : '';
      const hi = deltaMax !== null ? deltaMax + '%' : '';
      const txt = active ? (lo && hi ? `${lo}…${hi}` : (lo ? `≥${lo}` : `≤${hi}`)) : '';
      badge.textContent = txt;
      badge.hidden = !active;
    }
  }

  // Restore inputs
  if (deltaMin !== null) inputMin.value = deltaMin;
  if (deltaMax !== null) inputMax.value = deltaMax;
  updateSrcButtons();
  updateClearVisibility();
  updateTriggerState();

  btnDev.addEventListener('click', () => {
    deltaSource = 'dev'; updateSrcButtons(); saveDelta(); render();
  });
  btnMarket.addEventListener('click', () => {
    deltaSource = 'market'; updateSrcButtons(); saveDelta(); render();
  });

  function onInputChange(inputEl, setter) {
    const raw = inputEl.value.trim();
    setter(raw === '' ? null : parseFloat(raw));
    saveDelta();
    updateClearVisibility();
    updateTriggerState();
    render();
  }

  inputMin.addEventListener('change', () => onInputChange(inputMin, v => { deltaMin = v; }));
  inputMax.addEventListener('change', () => onInputChange(inputMax, v => { deltaMax = v; }));
  inputMin.addEventListener('keydown', (e) => { if (e.key === 'Enter') inputMin.blur(); });
  inputMax.addEventListener('keydown', (e) => { if (e.key === 'Enter') inputMax.blur(); });

  btnClear.addEventListener('click', () => {
    deltaMin = null; deltaMax = null;
    inputMin.value = ''; inputMax.value = '';
    saveDelta(); updateClearVisibility(); updateTriggerState(); render();
  });

  // Popover open/close (outside-click / Esc), matching the .dropdown behavior.
  function open()  { host.classList.add('is-open'); trigger.setAttribute('aria-expanded', 'true'); }
  function close() { host.classList.remove('is-open'); trigger.setAttribute('aria-expanded', 'false'); }
  trigger.addEventListener('click', (e) => {
    e.stopPropagation();
    host.classList.contains('is-open') ? close() : open();
  });
  document.addEventListener('click', (e) => { if (!host.contains(e.target)) close(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });

  document.getElementById('delta-filter').appendChild(host);
}

function buildBanFilter() {
  // Count items by ban state so user sees distribution at-a-glance
  let okCount = 0, bsgCount = 0, customCount = 0;
  for (const it of ITEM_LIST) {
    const banned  = it.spt && it.spt.fleaBanned;
    const reasons = (it.spt && it.spt.fleaBanReasons) || [];
    if (!banned) okCount++;
    if (reasons.includes('bsg')) bsgCount++;
    if (reasons.includes('custom')) customCount++;
  }
  const options = [
    { value: 'ok',     label: 'Allowed',     iconHtml: '<span class="ban-ico ban-ico--ok">'+ICON_OK+'</span>',         count: okCount },
    { value: 'bsg',    label: 'Banned (BSG)',  iconHtml: '<span class="ban-ico ban-ico--banned">'+ICON_BANNED+'</span>', count: bsgCount },
    { value: 'custom', label: 'Banned (custom)', iconHtml: '<span class="ban-ico ban-ico--banned">'+ICON_BANNED+'</span>', count: customCount },
  ];

  urlListOverride('ban', BAN_STORAGE_KEY, selectedBans);

  banDropdown = createDropdown({
    placeholder: 'Banned',
    options,
    multi: true,
    onChange: (vals) => {
      selectedBans.clear();
      vals.forEach(v => selectedBans.add(v));
      try { localStorage.setItem(BAN_STORAGE_KEY, JSON.stringify(vals)); } catch (e) {}
      render();
    },
  });
  banDropdown.setValue([...selectedBans]);
  document.getElementById('ban-filter').appendChild(banDropdown.root);
}

// True if a vanilla/mod item has its flea price pinned via ragfair.json — either
// an additive override (vanilla items) or an offer-multiplier (mod items).
function itemIsFleaEdited(it) {
  const s = it.spt;
  return !!(s && (s.fleaOverride != null || s.fleaOfferMultiplier != null));
}

// True if ANY editable money offer of this item has a trader-price override
// pinned at its (traderId, tpl). Shared by the filter + its counts.
function itemHasTraderOverride(it) {
  const traders = it.spt && it.spt.traders ? it.spt.traders : [];
  for (const t of traders) {
    const traderId = t.traderId || (t.name ? (TRADERS[t.name] && TRADERS[t.name].id) : null);
    if (!traderId || traderId === FENCE_ID) continue;
    const editable = (t.editable === true) || (TRADER_MONEY_CURRENCIES.has(t.currency) && t.currency !== 'BARTER');
    if (!editable) continue;
    if (traderOverrideFor(traderId, it.id) != null) return true;
  }
  return false;
}

// Merged "Edited" filter — one multi-select replacing the old Override +
// Trader-edit chips. Conditions: flea-edited (ragfair override/multiplier),
// trader-edited (TRLTraderPrices override), or not edited at all.
function buildEditedFilter() {
  let fleaCount = 0, traderCount = 0, noneCount = 0;
  for (const it of ITEM_LIST) {
    const flea   = itemIsFleaEdited(it);
    const trader = itemHasTraderOverride(it);
    if (flea)   fleaCount++;
    if (trader) traderCount++;
    if (!flea && !trader) noneCount++;
  }
  const options = [
    { value: 'flea',   label: 'Flea-edited',   iconHtml: '<span class="badge badge--override">OVR</span>', count: fleaCount },
    { value: 'trader', label: 'Trader-edited', iconHtml: '<span class="badge badge--override">OVR</span>', count: traderCount },
    { value: 'none',   label: 'Not edited', count: noneCount },
  ];

  urlListOverride('edited', EDITED_STORAGE_KEY, selectedEdited);

  editedDropdown = createDropdown({
    placeholder: 'Edited',
    options,
    multi: true,
    onChange: (vals) => {
      selectedEdited.clear();
      vals.forEach(v => selectedEdited.add(v));
      try { localStorage.setItem(EDITED_STORAGE_KEY, JSON.stringify(vals)); } catch (e) {}
      render();
    },
  });
  editedDropdown.setValue([...selectedEdited]);
  document.getElementById('edited-filter').appendChild(editedDropdown.root);
}

// Recompute Edited-filter counts in place (after a flea/trader edit/restore/clear).

function buildModFilter() {
  // Custom items added by server mods (modSource set in load-spt from
  // user/mods/*/db/CustomItems/). No mod items → no filter rendered.
  const counts = {};
  for (const it of ITEM_LIST) { if (it.modSource) counts[it.modSource] = (counts[it.modSource] || 0) + 1; }
  const names = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  if (names.length === 0) return;
  const options = names.map(n => ({ value: n, label: n, count: counts[n] }));

  urlListOverride('mod', MOD_STORAGE_KEY, selectedMods);

  modDropdown = createDropdown({
    placeholder: 'Mod',
    options,
    multi: true,
    searchable: names.length > 12,
    onChange: (vals) => {
      selectedMods.clear();
      vals.forEach(v => selectedMods.add(v));
      try { localStorage.setItem(MOD_STORAGE_KEY, JSON.stringify(vals)); } catch (e) {}
      render();
    },
  });
  modDropdown.setValue([...selectedMods]);
  document.getElementById('mod-filter').appendChild(modDropdown.root);
}

function buildConditionFilter() {
  // Count items per condition type so user can see distribution
  const counts = {};
  for (const it of ITEM_LIST) {
    const c = it.consolidated && it.consolidated.conditionType;
    if (!c) continue;
    counts[c] = (counts[c] || 0) + 1;
  }
  // Fixed order matching badge severity / table column visual hierarchy
  const order = ['none', 'durability', 'resource', 'uses', 'unknown'];
  const options = order.filter(c => counts[c] > 0).map(c => ({
    value: c,
    label: c.charAt(0).toUpperCase() + c.slice(1),
    badge: c,
    count: counts[c],
  }));

  // Restore persisted selection (URL query params win over localStorage).
  urlListOverride('cond', CONDITION_STORAGE_KEY, selectedConditions);

  conditionDropdown = createDropdown({
    placeholder: 'Condition',
    options,
    multi: true,
    onChange: (vals) => {
      selectedConditions.clear();
      vals.forEach(v => selectedConditions.add(v));
      try { localStorage.setItem(CONDITION_STORAGE_KEY, JSON.stringify(vals)); } catch (e) {}
      render();
    },

  conditionDropdown.setValue([...selectedConditions]);
  document.getElementById('condition-filter').appendChild(conditionDropdown.root);
}

function buildGroupFilter() {
  // Collect unique group names from items, with counts and icons.
  const counts = {};
  const icons = {};
  for (const it of ITEM_LIST) {
    const g = it.consolidated && it.consolidated.group;
    if (!g) continue;
    if (/^[a-f0-9]{24}$/i.test(g)) continue; // skip handbook entries without a locale name
    counts[g] = (counts[g] || 0) + 1;
    if (!icons[g] && it.category && it.category.icon) icons[g] = it.category.icon;
  }
  const options = Object.keys(counts).sort((a,b) => counts[b] - counts[a]).map(name => ({
    value: name,
    label: name,
    icon: icons[name] || CATEGORY_ICONS[name] || null,
    count: counts[name],
  }));

  // Restore persisted selection (URL query params win over localStorage).
  urlListOverride('group', GROUP_STORAGE_KEY, selectedGroups);

  groupDropdown = createDropdown({
    placeholder: 'Group',
    options,
    multi: true,
    searchable: true,
    onChange: (vals) => {
      selectedGroups.clear();
      vals.forEach(v => selectedGroups.add(v));
      try { localStorage.setItem(GROUP_STORAGE_KEY, JSON.stringify(vals)); } catch (e) {}
      render();
    },
  });
  groupDropdown.setValue([...selectedGroups]);
  document.getElementById('group-filter').appendChild(groupDropdown.root);
}

function countCategories() {
  for (const it of ITEM_LIST) {
    if (!it.category) continue;
    // count this category and all ancestors
    let id = it.category.id;
    while (id) {
      CAT_COUNTS[id] = (CAT_COUNTS[id] || 0) + 1;
      const node = findCatNode(CATEGORIES, id);
      id = node && node.parentId ? node.parentId : null;
      // categories.json doesn't store parentId on node, so walk via tree
      break; // we count only the leaf; ancestors via tree walk in render
    }
  }
  // walk tree to propagate counts upward
  function walk(node) {
    let total = CAT_COUNTS[node.id] || 0;
    if (node.children) for (const c of node.children) total += walk(c);
    CAT_COUNTS[node.id] = total;
    return total;
  }
  walk(CATEGORIES);
}

function findCatNode(node, id) {
  if (!node) return null;
  if (node.id === id) return node;
  if (node.children) for (const c of node.children) {
    const r = findCatNode(c, id);
    if (r) return r;
  }
  return null;
}

// ── Sidebar ─────────────────────────────────────────────────────────────────
function renderSidebar() {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '';
  const all = document.createElement('div');
  all.className = 'tree-node tree-all' + (activeCategoryId === null ? ' is-active' : '');
  all.innerHTML = '<span class="label">All items</span><span class="count">' + ITEM_LIST.length + '</span>';
  all.onclick = () => { activeCategoryId = null; render(); refreshActiveCat(); };
  sb.appendChild(all);

  // Skip the synthetic root "Item" — render its children at depth 0
  const rootChildren = CATEGORIES.children || [];
  for (const c of rootChildren) renderCatNode(sb, c, 0);
}

// Flatten skipped intermediates: returns children with non-zero counts,
// recursively promoting children of SKIP_CATEGORIES nodes.
function effectiveChildren(node) {
  if (!node || !node.children) return [];
  const out = [];
  for (const c of node.children) {
    if (SKIP_CATEGORIES.has(c.name)) {
      out.push(...effectiveChildren(c));
    } else if ((CAT_COUNTS[c.id] || 0) > 0) {
      out.push(c);
    }
  }
  return out;
}

function renderCatNode(parent, node, depth) {
  if (!node) return;
  const count = CAT_COUNTS[node.id] || 0;
  if (count === 0) return;

  // Skip synthetic intermediates — render their (effective) children at this level.
  if (SKIP_CATEGORIES.has(node.name)) {
    for (const c of effectiveChildren(node)) renderCatNode(parent, c, depth);
    return;
  }

  const visibleChildren = effectiveChildren(node);
  const hasChildren = visibleChildren.length > 0;
  const autoOpen = false; // tree starts fully collapsed; user expands on click

  const el = document.createElement('div');
  el.className = 'tree-node' + (hasChildren ? ' has-children' : '') + (autoOpen && hasChildren ? ' is-open' : '') + (activeCategoryId === node.id ? ' is-active' : '');
  el.style.paddingLeft = (6 + depth * 12) + 'px';
  el.dataset.catId = node.id;
  const iconHtml = node.icon
    ? '<img src="' + escapeAttr(node.icon) + '" alt="" loading="lazy">'
    : (CAT_ICONS[node.name] || ICON_DEFAULT);
  el.innerHTML =
    '<span class="chev"></span>' +
    '<span class="icon">' + iconHtml + '</span>' +
    '<span class="label">' + escapeHtml(node.name || node.id) + '</span>' +
    '<span class="count">' + count + '</span>';

  let childrenWrap = null;
  if (hasChildren) {
    childrenWrap = document.createElement('div');
    childrenWrap.className = 'tree-children' + (autoOpen ? '' : ' is-hidden');
    for (const c of visibleChildren) renderCatNode(childrenWrap, c, depth + 1);
  }

  el.onclick = (e) => {
    e.stopPropagation();
    if (hasChildren) {
      el.classList.toggle('is-open');
      childrenWrap.classList.toggle('is-hidden');
    }
    activeCategoryId = node.id;
    render();
    refreshActiveCat();
  };

  parent.appendChild(el);
  if (childrenWrap) parent.appendChild(childrenWrap);
}

// When a category restored from a shared URL is nested deep in the tree, auto-expand
// its ancestor chain so the highlighted node is visible without manually drilling down.
function expandAncestorsInSidebar(catId) {
  if (!ANCESTOR_CACHE[catId]) ANCESTOR_CACHE[catId] = collectAncestors(CATEGORIES, catId);
  for (const ancestorId of ANCESTOR_CACHE[catId]) {
    if (ancestorId === catId) continue;
    const el = document.querySelector('.tree-node[data-cat-id="' + ancestorId + '"]');
    if (!el) continue;
    el.classList.add('is-open');
    const wrap = el.nextElementSibling;
    if (wrap && wrap.classList.contains('tree-children')) wrap.classList.remove('is-hidden');
  }
}

function refreshActiveCat() {
  document.querySelectorAll('.tree-node').forEach(el => el.classList.remove('is-active'));
  if (activeCategoryId === null) {
    const a = document.querySelector('.tree-node.tree-all'); if (a) a.classList.add('is-active');
  } else {
    const a = document.querySelector('.tree-node[data-cat-id="' + activeCategoryId + '"]'); if (a) a.classList.add('is-active');
  }
}

// ── Controls ────────────────────────────────────────────────────────────────
function bindControls() {
  const q       = document.getElementById('q');
  const qWrap   = q.closest('.search');
  const qClear  = document.getElementById('q-clear');

  if (URL_INITIAL.has('q')) q.value = URL_INITIAL.get('q');

  function updateClearVisibility() {
    qWrap.classList.toggle('has-value', q.value.length > 0);
  }
  updateClearVisibility(); // initial (in case browser restored input)

  q.addEventListener('input', () => { updateClearVisibility(); });
  q.addEventListener('input', debounce(render, 300));
  q.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && q.value) {
      q.value = '';
      updateClearVisibility();
      render();
      e.preventDefault();
    }
  });
  qClear.addEventListener('click', () => {
    q.value = '';
    updateClearVisibility();
    q.focus();
    render();
  });

  // Flea level widget in topbar
  const fleaWidget = document.getElementById('flea-level-widget');
  const fleaNumEl  = document.getElementById('flea-level-num');
  if (fleaNumEl && META && META.sources && META.sources.spt) {
    fleaNumEl.textContent = META.sources.spt.fleaMinUserLevel || 15;
  }
  fleaWidget.addEventListener('click', () => openFleaMinLevelEditor(fleaWidget));

  // Flea cap (SPT unreasonableModPrices) on/off toggle in topbar — B-1.
  (function initFleaCapToggle() {
    const btn = document.getElementById('flea-cap-toggle');
    const stateEl = document.getElementById('flea-cap-state');
    if (!btn || !stateEl) return;
    let enabled = null;
    const notify = (m) => { try { if (typeof toast === 'function') toast(m); } catch (_) {} };
    const render = () => {
      stateEl.textContent = enabled == null ? '…' : (enabled ? 'on' : 'OFF');
      btn.classList.toggle('is-cap-off', enabled === false);
    };
    fleaCapSync = (next) => { enabled = next; render(); };
    (async () => {
      try { const j = await (await fetch(API_BASE + '/flea-cap')).json(); enabled = !!j.enabled; }
      catch (_) { enabled = null; stateEl.textContent = '?'; return; }
      render();
    })();
    btn.addEventListener('click', async () => {
      if (enabled == null) return;
      const next = !enabled;
      btn.disabled = true;
      try {
        const r = await fetch(API_BASE + '/flea-cap', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ enabled: next }) });
        const j = await r.json();
        if (r.ok) { enabled = j.enabled; render(); notify(next ? 'Flea cap ON — restart SPT + rebuild catalog to apply' : 'Flea cap OFF — mods/electronics uncapped; restart SPT + rebuild catalog to apply'); }
        else { notify('Flea cap failed: ' + (j.error || r.status)); }
      } catch (e) { notify('Flea cap failed: ' + e.message); }
      finally { btn.disabled = false; }
    });
  })();

  // Bulk "⟳ Update" menu (rescan / update-all-dev / update-all-market).
  bindUpdateMenu();

  // Audit log modal.
  const auditLogTrigger = document.getElementById('audit-log-trigger');
  if (auditLogTrigger) auditLogTrigger.addEventListener('click', openAuditLogModal);

  // Clear ALL trader sell-price overrides (TRLTraderPrices).
  const clearTraderBtn = document.getElementById('clear-trader-overrides');
  if (clearTraderBtn) clearTraderBtn.addEventListener('click', () => clearAllTraderOverrides());
  updateTraderTopbar();

  // CR-05: Clear ALL trader buyback-price overrides (B-3, TRLTraderPrices) — mirrors the sell button above.
  const clearBuyBtn = document.getElementById('clear-buy-overrides');
  if (clearBuyBtn) clearBuyBtn.addEventListener('click', () => clearAllBuyOverrides());
  updateBuyTopbar();

  // Condition / Group / Ban are handled by multi-select dropdowns
  // (buildConditionFilter / buildGroupFilter / buildBanFilter).
}

function debounce(fn, ms) {
  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

// ── Filter / sort ───────────────────────────────────────────────────────────
function isInCategorySubtree(item, rootId) {
  if (!rootId) return true;
  if (!item.category) return false;
  // Walk up category tree from item leaf
  let current = item.category.id;
  if (current === rootId) return true;
  // Find node and check if rootId is an ancestor
  // Build ancestors of item.category.id once per category? Cache.
  if (!ANCESTOR_CACHE[current]) {
    ANCESTOR_CACHE[current] = collectAncestors(CATEGORIES, current);
  }
  return ANCESTOR_CACHE[current].has(rootId);
}
const ANCESTOR_CACHE = {};
function collectAncestors(node, target, path) {
  path = path || [];
  if (!node) return new Set();
  if (node.id === target) return new Set([target, ...path]);
  if (node.children) {
    for (const c of node.children) {
      const r = collectAncestors(c, target, [node.id, ...path]);
      if (r.size) return r;
    }
  }
  return new Set();
}

// Filter-result memoization: a pure sort change (same filters) reuses the last
// filtered set instead of re-scanning all 5907 items. `_dataVersion` is bumped by
// every single-row mutation (edit/ban/restore/refresh) so a data change forces a
// recompute even when the filter inputs are unchanged.
let _filterKey = null, _filterCache = null, _dataVersion = 0;
function filterStateKey() {
  return [
    document.getElementById('q').value.trim().toLowerCase(),
    [...selectedConditions].sort().join(','),
    [...selectedGroups].sort().join(','),
    [...selectedBans].sort().join(','),
    [...selectedEdited].sort().join(','),
    [...selectedMods].sort().join(','),
    deltaMin, deltaMax, deltaSource, activeCategoryId, _dataVersion,
  ].join('|');
}

function filterItems() {
  const cacheKey = filterStateKey();
  if (cacheKey === _filterKey && _filterCache) return _filterCache;
  const q = document.getElementById('q').value.trim().toLowerCase();

  const out = [];
  for (const it of ITEM_LIST) {
    if (q) {
      const hay = ((it.name||'') + ' ' + (it.shortName||'') + ' ' + it.id).toLowerCase();
      if (!hay.includes(q)) continue;
    }
    if (selectedConditions.size > 0) {
      const c = it.consolidated && it.consolidated.conditionType;
      if (!c || !selectedConditions.has(c)) continue;
    }
    if (selectedGroups.size > 0) {
      const g = it.consolidated && it.consolidated.group;
      if (!g || !selectedGroups.has(g)) continue;
    }
    if (selectedBans.size > 0) {
      const banned = it.spt && it.spt.fleaBanned;
      const reasons = (it.spt && it.spt.fleaBanReasons) || [];
      let match = false;
      if (selectedBans.has('ok')     && !banned) match = true;
      if (selectedBans.has('bsg')    && reasons.includes('bsg')) match = true;
      if (selectedBans.has('custom') && reasons.includes('custom')) match = true;
      if (!match) continue;
    }
    if (selectedEdited.size > 0) {
      const fleaEdited   = itemIsFleaEdited(it);
      const traderEdited = itemHasTraderOverride(it);
      let match = false;
      if (selectedEdited.has('flea')   && fleaEdited)                  match = true;
      if (selectedEdited.has('trader') && traderEdited)               match = true;
      if (selectedEdited.has('none')   && !fleaEdited && !traderEdited) match = true;
      if (!match) continue;
    }
    if (selectedMods.size > 0) {
      if (!it.modSource || !selectedMods.has(it.modSource)) continue;
    }
    if (deltaMin !== null || deltaMax !== null) {
      const c  = it.consolidated;
      const spt   = c && c.priceFleaSpt;
      const other = c && (deltaSource === 'dev' ? c.priceFleaDevAvg24h : c.priceFleaMarketAvg24h);
      if (spt == null || spt === 0 || other == null) continue;
      const pct = ((other - spt) / spt) * 100;
      if (deltaMin !== null && pct < deltaMin) continue;
      if (deltaMax !== null && pct > deltaMax) continue;
    }
    if (activeCategoryId && !isInCategorySubtree(it, activeCategoryId)) continue;
    out.push(it);
  }
  _filterKey = cacheKey; _filterCache = out;
  return out;
}

function sortItems(list) {
  const dir = sortDir;
  const key = sortKey;
  // Schwartzian transform: compute each sort value ONCE (decorate), sort on the
  // precomputed value, then write back in place. Avoids 2× getSortValue per
  // comparison (O(n log n) calls → O(n)), incl. repeated toLowerCase/computeDelta.
  // Mutates `list` in place so the filter cache keeps the same array reference.
  const dec = list.map(it => ({ it, v: getSortValue(it, key) }));
  dec.sort((a, b) => {
    const va = a.v, vb = b.v;
    if (va == null && vb == null) return 0;
    if (va == null) return 1;  // nulls last
    if (vb == null) return -1;
    if (typeof va === 'string') return dir * va.localeCompare(vb);
    return dir * (va - vb);
  });
  for (let i = 0; i < dec.length; i++) list[i] = dec[i].it;
  return list;
}

function getSortValue(it, key) {
  switch (key) {
    case 'name':                  return (it.name || '').toLowerCase();
    case 'group':                 return (it.consolidated.group || '').toLowerCase();
    case 'priceTraderSell':       return it.consolidated.priceTraderSell ? it.consolidated.priceTraderSell.value : null;
    case 'priceFleaSpt':          return it.consolidated.priceFleaSpt;
    case 'priceFleaDevAvg24h':    return it.consolidated.priceFleaDevAvg24h;
    case 'priceFleaMarketAvg24h': return it.consolidated.priceFleaMarketAvg24h;
    case 'priceFleaCanonical':    return it.consolidated.priceFleaCanonical;
    case 'deltaFleaDev':          return computeDelta(it, 'priceFleaDevAvg24h');
    case 'deltaFleaMarket':       return computeDelta(it, 'priceFleaMarketAvg24h');
    default:                      return null;
  }
}

// Delta % vs SPT Flea — same formula as the visible ▲▼ indicator (pctVsSpt).
function computeDelta(it, valueKey) {
  const c = it.consolidated;
  if (!c) return null;
  const spt = c.priceFleaSpt;
  const val = c[valueKey];
  if (spt == null || spt === 0 || val == null) return null;
  return ((val - spt) / spt) * 100;
}

// ── Render ──────────────────────────────────────────────────────────────────
// Public render() coalesces bursts (a "Clear"/"All" filter action, or several
// state changes in one tick) into a single rebuild per animation frame. Heavy
// work lives in renderNow(). One-frame defer is imperceptible (skeleton/old rows
// stay until the frame) and no caller reads the table DOM synchronously after render().
let _renderScheduled = false;
function render() {
  if (_renderScheduled) return;
  _renderScheduled = true;
  requestAnimationFrame(() => { _renderScheduled = false; renderNow(); });
}

// Mirrors all active filters + search + sort into the URL query string (replaceState —
// never pushState, so typing/filtering never pollutes browser back-history). Makes the
// current view copy-pasteable/bookmarkable. Read side: URL_INITIAL + urlListOverride(),
// consulted once at load — see buildXFilter()s, buildDeltaFilter(), bindControls() and
// the `cat` hydration in load().
function syncUrlFromState() {
  const p = new URLSearchParams();
  const q = document.getElementById('q').value.trim();
  if (q) p.set('q', q);
  if (activeCategoryId != null) p.set('cat', activeCategoryId);
  if (selectedGroups.size) p.set('group', [...selectedGroups].join(','));
  if (selectedConditions.size) p.set('cond', [...selectedConditions].join(','));
  if (selectedBans.size) p.set('ban', [...selectedBans].join(','));
  if (selectedEdited.size) p.set('edited', [...selectedEdited].join(','));
  if (selectedMods.size) p.set('mod', [...selectedMods].join(','));
  if (deltaMin !== null || deltaMax !== null) {
    p.set('deltaSrc', deltaSource);
    if (deltaMin !== null) p.set('deltaMin', deltaMin);
    if (deltaMax !== null) p.set('deltaMax', deltaMax);
  }
  if (!(sortKey === 'priceTraderSell' && sortDir === -1)) {
    p.set('sort', sortKey);
    p.set('dir', sortDir === 1 ? 'asc' : 'desc');
  }
  const qs = p.toString();
  history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + location.hash);
}

function renderNow() {
  const filtered = sortItems(filterItems());
  const total = ITEM_LIST.length;
  syncUrlFromState();
  document.getElementById('stats').textContent =
    `${filtered.length.toLocaleString('en-US')} / ${total.toLocaleString('en-US')} items` +
    (filtered.length > RENDER_LIMIT ? ` (showing ${RENDER_LIMIT})` : '');

  // Tear down any previous window observer up-front so both the empty and the
  // table path leave no orphan observer on a detached sentinel.
  if (_winObserver) { _winObserver.disconnect(); _winObserver = null; }

  const main = document.getElementById('main');
  if (filtered.length === 0) {
    main.innerHTML = '<div class="empty">No items match the filters.</div>';
    return;
  }

  // Windowed render: build the shell + first batch, then append more batches as a
  // sentinel scrolls near the viewport. Keeps the live DOM to a few hundred rows
  // (was up to 1500) without touching layout/visuals.
  _winRows = filtered.slice(0, RENDER_LIMIT);
  _winCursor = 0;

  const html = ['<table class="tbl"><thead><tr>',
    '<th></th>',
    th('name', 'Item'),
    th('group', 'Group'),
    '<th>Cond.</th>',
    '<th class="col-reward">Reward</th>',
    th('priceTraderSell', 'Trader', 'num'),
    th('priceFleaSpt', 'Flea SPT', 'num col-flea-spt'),
    thWithDelta('priceFleaDevAvg24h',    'deltaFleaDev',    'Flea tarkov.dev',    'num col-flea-dev'),
    thWithDelta('priceFleaMarketAvg24h', 'deltaFleaMarket', 'Flea tarkov-market', 'num col-flea-market'),
    // canonical column hidden — still computed/exposed in row detail
    '</tr></thead><tbody></tbody></table>'];
  main.innerHTML = html.join('');

  const tbl   = main.querySelector('table');
  const tbody = tbl.querySelector('tbody');
  appendWindowBatch(tbody);   // first batch (adds a scroll sentinel if more remain)

  // Click handlers (delegated)
  tbl.addEventListener('click', onTableClick);
  // T10: keyboard activation — Enter/Space on a focused trader cell opens edit.
  tbl.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const cell = e.target.closest('td.trader-edit-cell');
    if (!cell || cell.classList.contains('is-editing')) return;
    e.preventDefault();
    const row = cell.closest('tr.trader-row');
    if (row) openTraderEdit(row);
  });
  bindRewardHover(tbl);
  main.querySelectorAll('th').forEach(th => {
    th.addEventListener('click', (ev) => {
      // For multi-sort headers (thWithDelta), the data-sort lives on inner spans;
      // for simple headers, it's on the <th> itself. closest() handles both.
      const sortEl = ev.target.closest('[data-sort]');
      if (!sortEl) return;
      const k = sortEl.dataset.sort;
      if (sortKey === k) sortDir = -sortDir;
      else { sortKey = k; sortDir = (k === 'name' || k === 'group') ? 1 : -1; }
      saveSortPref();
      render();
    });
  });

  // Incremental loading: append the next batch as the sentinel nears the viewport.
  const sentinel = document.getElementById('win-sentinel');
  if (sentinel) {
    _winObserver = new IntersectionObserver((entries) => {
      if (entries.some(e => e.isIntersecting)) appendWindowBatch(tbody);
    }, { root: main, rootMargin: '800px 0px' });
    _winObserver.observe(sentinel);
  }
}

// Append the next RENDER_BATCH rows into <tbody>, moving the scroll sentinel.
// Keeps the live DOM small; called first by renderNow and then by the observer.
function appendWindowBatch(tbody) {
  const end = Math.min(_winCursor + RENDER_BATCH, _winRows.length);
  let html = '';
  for (let i = _winCursor; i < end; i++) html += renderRow(_winRows[i]);
  _winCursor = end;
  const oldSentinel = document.getElementById('win-sentinel');
  if (oldSentinel) oldSentinel.remove();
  tbody.insertAdjacentHTML('beforeend', html);
  if (_winCursor < _winRows.length) {
    tbody.insertAdjacentHTML('beforeend',
      '<tr id="win-sentinel" class="win-sentinel" aria-hidden="true"><td colspan="9"></td></tr>');
    if (_winObserver) { _winObserver.disconnect(); _winObserver.observe(document.getElementById('win-sentinel')); }
  } else if (_winObserver) {
    _winObserver.disconnect();
  }
}

function openFleaMinLevelEditor(trigger) {
  if (trigger.classList.contains('is-editing')) return;
  const numEl  = document.getElementById('flea-level-num');
  const current = parseInt((numEl && numEl.textContent) || '15', 10);
  trigger.classList.add('is-editing');
  trigger.innerHTML =
    `Flea Lvl <input class="flea-level-widget__input" type="number" min="1" max="99" value="${current}">+` +
    `<button class="flea-level-widget__btn is-save"   type="button" title="Save">${ICON_OK}</button>` +
    `<button class="flea-level-widget__btn is-cancel" type="button" title="Cancel">×</button>`;
  const input = trigger.querySelector('input');
  input.focus(); input.select();

  const cancel = () => {
    trigger.classList.remove('is-editing');
    trigger.innerHTML = `Flea Lvl <span id="flea-level-num">${current}</span>+`;
  };
  const save = async () => {
    const val = parseInt(input.value, 10);
    if (!Number.isInteger(val) || val < 1 || val > 99) {
      toast('Invalid level (1..99)', 'err');
      return;
    }
    if (val === current) { cancel(); return; }
    try {
      const r = await fetch(API_BASE + '/flea-min-level', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ minUserLevel: val }),
      });
      const data = await r.json();
      if (!r.ok || !data.ok) throw new Error(data.error || ('HTTP ' + r.status));
      if (META && META.sources && META.sources.spt) META.sources.spt.fleaMinUserLevel = val;
      trigger.classList.remove('is-editing');
      trigger.innerHTML = `Flea Lvl <span id="flea-level-num">${val}</span>+`;
      toast(`Flea unlock level: ${current} → ${val}`, 'ok');
    } catch (err) {
      toast('Failed: ' + err.message, 'err');
      cancel();
    }
  };
  trigger.querySelector('.is-save').onclick   = (ev) => { ev.stopPropagation(); save(); };
  trigger.querySelector('.is-cancel').onclick = (ev) => { ev.stopPropagation(); cancel(); };
  input.onkeydown = (ev) => {
    if (ev.key === 'Enter') { ev.preventDefault(); save(); }
    else if (ev.key === 'Escape') { ev.preventDefault(); cancel(); }
    ev.stopPropagation();
  };
  input.onclick = (ev) => ev.stopPropagation();
}

// Group cell: icon + name. Resolves icon by category id first, then by name
// (handbook tree feeds both keys). Falls back to no icon if not in tree.
function renderGroupCell(item, groupName) {
  if (!groupName) return '<span class="muted">—</span>';
  const id  = item.category && item.category.id;
  const url = (id && CATEGORY_ICONS[id]) || CATEGORY_ICONS[groupName] || null;
  const icon = url
    ? `<img class="group-icon" src="${escapeAttr(url)}" alt="" loading="lazy">`
    : '<span class="group-icon group-icon--empty"></span>';
  return `<span class="group">${icon}<span class="group__name">${escapeHtml(groupName)}</span></span>`;
}

function th(key, label, klass) {
  const isSorted = sortKey === key;
  const sortMark = isSorted ? (sortDir === 1 ? ' <span class="sort">▲</span>' : ' <span class="sort">▼</span>') : '';
  const classes = [klass, isSorted ? 'is-sorted' : ''].filter(Boolean).join(' ');
  return `<th data-sort="${key}"${classes ? ' class="'+classes+'"' : ''}>${label}${sortMark}</th>`;
}

// Header with two sort options: by value and by Δ% vs SPT Flea.
// Both independently clickable; the arrow follows the active sort key.
function thWithDelta(valueKey, deltaKey, label, klass) {
  const isValueSorted = sortKey === valueKey;
  const isDeltaSorted = sortKey === deltaKey;
  const isSorted = isValueSorted || isDeltaSorted;
  const arrow = sortDir === 1 ? '▲' : '▼';
  const valueMark = isValueSorted ? ` <span class="sort">${arrow}</span>` : '';
  const deltaMark = isDeltaSorted ? ` <span class="sort">${arrow}</span>` : '';
  const classes = [klass, isSorted ? 'is-sorted' : ''].filter(Boolean).join(' ');
  return `<th${classes ? ' class="'+classes+'"' : ''}>` +
    `<span class="th-sort-key${isValueSorted?' is-active':''}" data-sort="${valueKey}" title="Sort by value">${label}${valueMark}</span>` +
    `<span class="th-sort-key th-sort-key--delta${isDeltaSorted?' is-active':''}" data-sort="${deltaKey}" title="Sort by % change vs SPT Flea">Δ%${deltaMark}</span>` +
  `</th>`;
}

function renderRow(it) {
  const c = it.consolidated;
  const img = (it.image && it.image.icon)
    ? `<div class="img-wrap">` +
        `<img src="${escapeAttr(it.image.icon)}" alt="" loading="lazy"${it.imageFromClone ? ' class="is-proxy"' : ''}>` +
        (it.imageFromClone ? `<span class="img-proxy-mark" data-tip="Image of the cloned vanilla item (proxy) — the mod's custom icon only exists rendered in-game">≈</span>` : '') +
      `</div>`
    : '<div class="no-img">—</div>';
  const cond = c.conditionType || 'unknown';
  const condBadge = `<span class="badge badge--${cond}">${cond}</span>`;
  const banned = it.spt && it.spt.fleaBanned;
  const banReasons = (it.spt && it.spt.fleaBanReasons) || [];
  const banIcon = banned
    ? `<span class="banned-icon" data-tip="Banned from flea: ${banReasons.join(', ')}" tabindex="0">${ICON_BANNED}</span> `
    : '';
  // Trader cell — stacked SELL (player→trader, tarkov.dev) and BUY (trader→player, SPT assort)
  const traderSellValue = c.priceTraderSell ? c.priceTraderSell.value : null;
  const traderSellName  = c.priceTraderSell ? c.priceTraderSell.vendor : null;
  // CR-04: reflect a buyback (B-3) override on the "B" line too, same as "S" already does for
  // sell overrides — otherwise an edited buyback price is invisible outside the detail panel.
  const traderSellTraderId = traderSellName && TRADERS[traderSellName] ? TRADERS[traderSellName].id : null;
  const buyOvr = traderSellTraderId ? buyOverrideFor(traderSellTraderId, it.id) : null;
  const buyOvrCount = buyOvr != null ? ((typeof buyOvr === 'object') ? buyOvr.count : buyOvr) : null;
  const buyOvrCurrency = (buyOvr && typeof buyOvr === 'object' && buyOvr.currency) ? buyOvr.currency : 'RUB';
  const buyOverridden = buyOvrCount != null;
  const buyEffRUB = buyOverridden
    ? Math.round(buyOvrCount * (CURRENCY_RATES[buyOvrCurrency] != null ? CURRENCY_RATES[buyOvrCurrency] : 1))
    : traderSellValue;
  // Best buy = cheapest non-BARTER trader offer in spt.traders[], with its loyaltyLevel.
  // Trader OVERRIDES are applied here (effective price = override count × currency rate) so
  // an edited trader price shows in the item row, not only in the detail panel.
  let traderBuy = null;
  if (it.spt && Array.isArray(it.spt.traders) && it.spt.traders.length) {
    const candidates = it.spt.traders
      .filter(t => t.currency !== 'BARTER' && t.priceRUB != null)
      .map(t => {
        const tid = t.traderId || (t.name && TRADERS[t.name] ? TRADERS[t.name].id : null);
        const ov  = tid ? traderOverrideFor(tid, it.id) : null;
        const ovCount = ov != null ? ((typeof ov === 'object') ? ov.count : ov) : null;
        const rate = CURRENCY_RATES[t.currency] != null ? CURRENCY_RATES[t.currency] : 1;
        const effPriceRUB = ovCount != null ? Math.round(ovCount * rate) : t.priceRUB;
        return Object.assign({}, t, { effPriceRUB, overridden: ovCount != null });
      });
    if (candidates.length) {
      candidates.sort((a, b) => a.effPriceRUB - b.effPriceRUB);
      traderBuy = candidates[0];
    }
  }
  function avatarFor(name) {
    const meta = name ? TRADERS[name] : null;
    if (meta && meta.avatar) return `<img class="trader-avatar trader-avatar--xs" src="${escapeAttr(meta.avatar)}" alt="${escapeAttr(name)}" title="${escapeAttr(name)}" loading="lazy">`;
    if (name) return `<span class="trader-avatar trader-avatar--xs trader-avatar--placeholder" title="${escapeAttr(name)}">${escapeHtml(name.charAt(0))}</span>`;
    return '';
  }
  // Reference = the TRADER (consistent with the expanded detail). Colored/labeled by
  // SEMANTIC (not row position), so a sell-only mod item never mislabels:
  //   S (red)  = trader SELLS this to you  → the SPT assort (the editable price you pay)
  //   B (green)= trader BUYS this from you → tarkov.dev buyback (what the trader pays you)
  const trader = (traderSellValue != null || traderBuy)
    ? `<div class="cell-trader cell-trader--stacked">` +
        (traderBuy
          ? `<div class="cell-trader__line cell-trader__line--sell" data-tip="S = trader SELLS this to you — the assort price you pay (SPT)"><span class="cell-trader__tag cell-trader__tag--sell" aria-label="Trader sells to you">S</span>${avatarFor(traderBuy.name)}<span class="cell-trader__num${traderBuy.overridden?' is-overridden':''}">${fmtRub(traderBuy.effPriceRUB)}</span>${traderBuy.overridden?` <span class="badge badge--override cell-trader__ovr" data-tip="Trader sell-price override — restart SPT to apply">OVR</span>`:''}<small class="cell-trader__ll">LL${traderBuy.loyaltyLevel}${traderBuy.questLocked?` <span class="trader-lock" data-tip="Quest-locked — an override applies only after you unlock the quest">🔒</span>`:''}</small></div>`
          : '') +
        (traderSellValue != null
          ? `<div class="cell-trader__line cell-trader__line--buy" data-tip="B = trader BUYS this from you — buyback (tarkov.dev${buyOverridden?' + override':''})"><span class="cell-trader__tag cell-trader__tag--buy" aria-label="Trader buys from you">B</span>${avatarFor(traderSellName)}<span class="cell-trader__num${buyOverridden?' is-overridden':''}">${fmtRub(buyEffRUB)}</span>${buyOverridden?` <span class="badge badge--override cell-trader__ovr" data-tip="Trader buyback-price override — restart SPT to apply">OVR</span>`:''}</div>`
          : '') +
      `</div>`
    : '<span class="price is-null">—</span>';

  // Reward cell — quest rewards that grant this item
  const rewards = (it.spt && it.spt.questRewards) || [];
  let rewardCell = '<span class="muted">—</span>';
  if (rewards.length) {
    const first = rewards[0];
    const extra = rewards.length > 1 ? ` <small class="vendor">+${rewards.length - 1}</small>` : '';
    const tipText = rewards.map(r => `${r.name} (${r.trader || '?'}) ×${r.count}`).join(' · ');
    rewardCell = `<span class="reward-badge" data-tip="${escapeAttr(tipText)}" tabindex="0">🎁 <span class="reward-name">${escapeHtml(first.name)}</span>${first.count > 1 ? ` ×${first.count}` : ''}${extra}</span>`;
  }
  const sourceBadge = c.priceFleaSource
    ? `<small><span class="badge badge--src-${c.priceFleaSource.replace(/\./g,'-')}">${c.priceFleaSource}</span></small>`
    : '';

  // "Edited" badge: vanilla items via additive override (OVR), mod items via
  // offer-multiplier (×N — the override doesn't work for them).
  const sptBlk = it.spt || {};
  const hasOverride = sptBlk.fleaOverride != null;
  const hasMult     = sptBlk.fleaOfferMultiplier != null;
  let editBadge = '';
  if (hasOverride) {
    const overrideTip = `Override active in ragfair.json — flea pinned at ${c.priceFleaSpt != null ? c.priceFleaSpt.toLocaleString('en-US') + ' ₽' : '?'} (override=${sptBlk.fleaOverride.toLocaleString('en-US')}). Click the cell to edit / restore.`;
    editBadge = ` <small><span class="badge badge--override" data-tip="${escapeAttr(overrideTip)}">OVR</span></small>`;
  } else if (hasMult) {
    const multStr = (+sptBlk.fleaOfferMultiplier.toFixed(4)).toString();
    const multTip = `Mod item ${it.modSource || '?'} — price adjusted via ragfair.json:itemPriceMultiplier (×${multStr}). Flea ≈ ${c.priceFleaSpt != null ? c.priceFleaSpt.toLocaleString('en-US') + ' ₽' : '?'}. The override does not work on a mod item; the multiplier does. Click the cell to edit / restore.`;
    editBadge = ` <small><span class="badge badge--mult" data-tip="${escapeAttr(multTip)}">×${escapeHtml(multStr)}</span></small>`;
  }
  const fleaSptCell = (banned
    ? `<span class="price is-banned">${banIcon}${c.priceFleaSpt != null ? fmtRub(c.priceFleaSpt) : '—'}</span>`
    : fmtRub(c.priceFleaSpt)) + editBadge;

  const modBadge = it.modSource
    ? ` <span class="badge badge--mod" data-tip="${escapeAttr('Custom item added by mod: ' + it.modSource)}">MOD</span>`
    : '';

  return `<tr data-id="${it.id}" class="${banned?'is-banned':''}">
    <td class="col-img">${img}</td>
    <td class="col-name"><div class="name-row"><div class="name">${escapeHtml(it.name || it.id)}</div>${modBadge}</div><div class="short">${escapeHtml(it.shortName || '')}</div></td>
    <td class="col-group">${renderGroupCell(it, c.group)}</td>
    <td>${condBadge}</td>
    <td class="col-reward">${rewardCell}</td>
    <td class="num">${trader}</td>
    <td class="num cell-edit ${c.priceFleaSpt==null && !banned?'price is-null':'price'}" data-edit-tpl="${it.id}" data-tip="Click for actions (edit price / ban)" data-tip-pos="bottom"><div class="cell-num"><div class="cell-num__value">${fleaSptCell}</div></div><span class="cell-edit__icon" aria-hidden="true">${ICON_EDIT}</span></td>
    <td class="num cell-refresh ${c.priceFleaDevAvg24h==null?'price is-null':'price'}" data-refresh-tpl="${it.id}" data-tip="Click to update price on tarkov.dev" data-tip-pos="bottom"><div class="cell-num"><div class="cell-num__value">${fmtRub(c.priceFleaDevAvg24h)}${trollFlag(c.priceFleaDevAvg24h, c.priceFleaSpt)}</div>${pctVsSpt(c.priceFleaDevAvg24h, c.priceFleaSpt)}</div><span class="cell-refresh__icon" aria-hidden="true">${ICON_REFRESH}</span><span class="cell-refresh__spinner" aria-hidden="true"></span></td>
    <td class="num cell-refresh cell-refresh-market ${c.priceFleaMarketAvg24h==null?'price is-null':'price'}" data-refresh-tpl="${it.id}" data-tip="Click to update via tarkov-market" data-tip-pos="bottom"><div class="cell-num"><div class="cell-num__value">${fmtRub(c.priceFleaMarketAvg24h)}${trollFlag(c.priceFleaMarketAvg24h, c.priceFleaSpt)}</div>${pctVsSpt(c.priceFleaMarketAvg24h, c.priceFleaSpt)}</div><span class="cell-refresh__icon" aria-hidden="true">${ICON_REFRESH}</span><span class="cell-refresh__spinner" aria-hidden="true"></span></td>
  </tr>`;
}

let _rewardOpenTimer  = null;
let _rewardCloseTimer = null;

function closeRewardPopover() {
  clearTimeout(_rewardCloseTimer);
  clearTimeout(_rewardOpenTimer);
  const existing = document.querySelector('.reward-popover');
  if (existing) existing.remove();
}

function openRewardPopover(badge, rewards) {
  closeRewardPopover();
  const pop = document.createElement('div');
  pop.className = 'reward-popover';
  const rows = rewards.map(r => {
    const meta = r.trader ? TRADERS[r.trader] : null;
    const avatar = meta && meta.avatar
      ? `<img class="trader-avatar trader-avatar--xs" src="${escapeAttr(meta.avatar)}" alt="${escapeAttr(r.trader)}" title="${escapeAttr(r.trader)}" loading="lazy">`
      : r.trader
        ? `<span class="trader-avatar trader-avatar--xs trader-avatar--placeholder" title="${escapeAttr(r.trader)}">${escapeHtml(r.trader.charAt(0))}</span>`
        : `<span class="trader-avatar trader-avatar--xs trader-avatar--placeholder">?</span>`;
    return `<li class="reward-popover__item">
      ${avatar}
      <span class="reward-popover__name">${escapeHtml(r.name)}</span>
      ${r.count > 1 ? `<span class="reward-popover__count">×${r.count}</span>` : ''}
    </li>`;
  }).join('');
  pop.innerHTML =
    `<div class="reward-popover__header">🎁 ${rewards.length} mission${rewards.length > 1 ? 's' : ''}</div>` +
    `<ul class="reward-popover__list">${rows}</ul>`;
  document.body.appendChild(pop);

  // Position below the badge, flip if near viewport edge
  const rect = badge.getBoundingClientRect();
  const scrollY = window.scrollY || document.documentElement.scrollTop;
  const scrollX = window.scrollX || document.documentElement.scrollLeft;
  pop.style.top  = (rect.bottom + scrollY + 6) + 'px';
  pop.style.left = (rect.left  + scrollX) + 'px';
  requestAnimationFrame(() => {
    const pr = pop.getBoundingClientRect();
    if (pr.bottom > window.innerHeight - 8)
      pop.style.top  = (rect.top  + scrollY - pr.height - 6) + 'px';
    if (pr.right  > window.innerWidth  - 8)
      pop.style.left = (window.innerWidth - pr.width - 8 + scrollX) + 'px';
  });

  // Keep popover open while mouse is over it; close on leave
  pop.addEventListener('mouseenter', () => clearTimeout(_rewardCloseTimer));
  pop.addEventListener('mouseleave', () => {
    _rewardCloseTimer = setTimeout(closeRewardPopover, 80);
  });
}

// Called by render() after the table is inserted into the DOM
function bindRewardHover(tableEl) {
  tableEl.addEventListener('mouseover', (e) => {
    const badge = e.target.closest('.reward-badge');
    if (!badge) return;
    clearTimeout(_rewardCloseTimer);
    // Already showing for this exact badge — do nothing
    if (document.querySelector('.reward-popover') && badge._rewardActive) return;
    clearTimeout(_rewardOpenTimer);
    _rewardOpenTimer = setTimeout(() => {
      const row = badge.closest('tr[data-id]');
      const id  = row && row.dataset.id;
      const rewards = id && ITEMS[id] && ITEMS[id].spt && ITEMS[id].spt.questRewards;
      if (rewards && rewards.length) {
        badge._rewardActive = true;
        openRewardPopover(badge, rewards);
      }
    }, 300);
  });
  tableEl.addEventListener('mouseout', (e) => {
    const badge = e.target.closest('.reward-badge');
    if (!badge) return;
    // Only start close timer if cursor left the badge area entirely
    if (badge.contains(e.relatedTarget)) return;
    badge._rewardActive = false;
    clearTimeout(_rewardOpenTimer);
    _rewardCloseTimer = setTimeout(closeRewardPopover, 80);
  });
}

function onTableClick(e) {
  // Inline restore ↺ on an overridden trader row → delete the override directly.
  const traderRestoreBtn = e.target.closest('.trader-restore-btn');
  if (traderRestoreBtn) {
    e.stopPropagation();
    const row = traderRestoreBtn.closest('tr.trader-row');
    if (row) restoreTraderOverride(row);
    return;
  }
  // Clicks inside an open trader-edit form: let the form's own handlers fire
  // (don't let the click bubble up to toggle/close the detail row).
  if (e.target.closest('.trader-edit-form')) { e.stopPropagation(); return; }
  // Click anywhere on an editable trader cell (not just the pencil) → inline edit.
  const traderCell = e.target.closest('td.trader-edit-cell');
  if (traderCell) {
    e.stopPropagation();
    const row = traderCell.closest('tr.trader-row');
    if (row) openTraderEdit(row);
    return;
  }

  // B-3: inline restore ↺ on an overridden BUY (buyback) row → delete the override directly.
  const buyRestoreBtn = e.target.closest('.buy-restore-btn');
  if (buyRestoreBtn) {
    e.stopPropagation();
    const row = buyRestoreBtn.closest('tr.buy-row');
    if (row) restoreBuyOverride(row);
    return;
  }
  // Clicks inside an open buy-edit form: let the form's own handlers fire.
  if (e.target.closest('.buy-edit-form')) { e.stopPropagation(); return; }
  // Click anywhere on an editable BUY cell (not just the pencil) → inline edit.
  const buyCell = e.target.closest('td.buy-edit-cell');
  if (buyCell) {
    e.stopPropagation();
    const row = buyCell.closest('tr.buy-row');
    if (row) openBuyEdit(row);
    return;
  }

  // Click on reward badge → toggle reward popover
  const rewardBadge = e.target.closest('.reward-badge');
  if (rewardBadge) {
    e.stopPropagation();
    const row = rewardBadge.closest('tr[data-id]');
    const id  = row && row.dataset.id;
    const rewards = id && ITEMS[id] && ITEMS[id].spt && ITEMS[id].spt.questRewards;
    if (rewards && rewards.length) {
      if (document.querySelector('.reward-popover')) { closeRewardPopover(); return; }
      openRewardPopover(rewardBadge, rewards);
    }
    return;
  }

  // Click on Flea Dev / Flea Market cell → refresh from the respective API
  const refreshCell = e.target.closest('td.cell-refresh');
  if (refreshCell) {
    e.stopPropagation();
    if (refreshCell.classList.contains('is-loading')) return; // already in-flight
    if (refreshCell.classList.contains('cell-refresh-market')) refreshMarketCell(refreshCell);
    else refreshDevCell(refreshCell);
    return;
  }

  const sptCell = e.target.closest('td.cell-edit');
  if (sptCell) {
    e.stopPropagation();
    if (sptCell.classList.contains('is-editing')) {
      // Click inside the edit form — let its own handlers fire
      if (e.target.closest('.edit-form')) return;
      // Click on the cell outside the form → cancel the edit (same as Esc)
      const cancelBtn = sptCell.querySelector('button.cancel');
      if (cancelBtn) cancelBtn.click();
      return;
    }
    if (sptCell.classList.contains('has-actions')) {
      // Click on the action menu itself — let buttons handle it
      if (e.target.closest('.cell-actions')) return;
      // Click on the cell outside the menu → close menu
      closeCellActions(sptCell);
      return;
    }
    // Otherwise: open the action menu (which can launch edit or ban)
    openCellActions(sptCell);
    return;
  }

  const row = e.target.closest('tr[data-id]');
  if (!row) return;
  const id = row.dataset.id;
  const existing = row.nextElementSibling;
  if (existing && existing.classList.contains('detail')) {
    existing.remove();
    row.classList.remove('is-expanded');
    return;
  }
  // Close any open detail
  document.querySelectorAll('tr.detail').forEach(d => d.remove());
  document.querySelectorAll('tr.is-expanded').forEach(t => t.classList.remove('is-expanded'));
  // Open new
  row.classList.add('is-expanded');
  const detail = document.createElement('tr');
  detail.className = 'detail';
  detail.innerHTML = `<td colspan="9">${renderDetail(ITEMS[id])}</td>`;
  row.parentNode.insertBefore(detail, row.nextSibling);
}

// ── Refresh single item from tarkov.dev (Flea Dev cell click) ───────────────
async function refreshDevCell(cell) {
  const tpl = cell.dataset.refreshTpl;
  const item = ITEMS[tpl];
  if (!item) return;
  cell.classList.add('is-loading');
  try {
    const r = await fetch(API_BASE + '/refresh-dev', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tpl }),
    });
    const data = await r.json();
    if (!r.ok || !data.ok) throw new Error(data.error || ('HTTP ' + r.status));

    // Update in-memory item and re-render the row
    item.tarkovDev = data.tarkovDev;
    item.consolidated = data.consolidated;
    _dataVersion++;  // data changed → invalidate filter-cache
    const row = cell.closest('tr[data-id]');
    if (row) {
      const tmp = document.createElement('tbody');
      tmp.innerHTML = renderRow(item);
      row.replaceWith(tmp.firstElementChild);
    }
    const prev = data.previous && data.previous.avg24h;
    const curr = data.tarkovDev && data.tarkovDev.pve && data.tarkovDev.pve.avg24h;
    const deltaTxt = (prev != null && curr != null && prev !== curr)
      ? ` (was ${prev.toLocaleString('en-US')} ₽ → ${curr.toLocaleString('en-US')} ₽)`
      : '';
    toast(`${item.shortName || tpl}: prices updated via tarkov.dev${deltaTxt}`, 'ok');
  } catch (err) {
    cell.classList.remove('is-loading');
    toast('Failed to update via tarkov.dev: ' + err.message, 'err');
  }
}

// ── Cell action menu (Edit price / Ban / Unban) ─────────────────────────────
// Click cell → 2 actions appear. Ban / Unban require an in-place confirmation
// step. Inline edit launches from "Edit price".
function openCellActions(cell) {
  if (cell.querySelector('.cell-actions')) return;
  const tpl = cell.dataset.editTpl;
  const item = ITEMS[tpl];
  if (!item) return;
  const isBanned = !!(item.spt && item.spt.fleaBanned);
  const banLabel = isBanned ? 'Unban item' : 'Ban item';
  const banIcon  = isBanned ? ICON_OK : ICON_BANNED;
  const banClass = isBanned ? 'is-unban' : 'is-ban';
  const hasEdit = !!(item.spt && (item.spt.fleaOverride != null || item.spt.fleaOfferMultiplier != null));

  // "Copy from" reference sources — the avg24h values the Flea tarkov.dev / tarkov-market columns
  // show. A source with no cached price for this item renders disabled. Applying is a single click,
  // so the success toast offers an Undo (see applyFleaPrice).
  const copySources = [
    { label: 'Tarkov.dev',    price: item.consolidated && item.consolidated.priceFleaDevAvg24h },
    { label: 'Tarkov-Market', price: item.consolidated && item.consolidated.priceFleaMarketAvg24h },
  ];
  const ICON_IMPORT = '<svg width="12" height="12" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M7 1.5v7m0 0L4.3 5.8M7 8.5l2.7-2.7M2.5 12h9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  cell.classList.add('has-actions');
  const menu = document.createElement('div');
  menu.className = 'cell-actions';
  menu.innerHTML =
    `<button class="cell-actions__item" data-action="edit" type="button">` +
      `<span class="ico">${ICON_EDIT}</span><span>Edit price</span>` +
    `</button>` +
    copySources.map((s, i) => s.price != null
      ? `<button class="cell-actions__item is-copy" data-action="copy" data-price="${s.price}" data-label="${escapeAttr(s.label)}" type="button" title="Set the flea to the Tarkov ${escapeAttr(s.label)} price">` +
          `<span class="ico">${ICON_IMPORT}</span><span>Copy from ${escapeHtml(s.label)}</span><span class="cell-actions__val">${fmtRub(Math.round(s.price))}</span>` +
        `</button>`
      : `<button class="cell-actions__item is-copy" disabled type="button" title="No Tarkov ${escapeAttr(s.label)} price cached for this item">` +
          `<span class="ico">${ICON_IMPORT}</span><span>Copy from ${escapeHtml(s.label)}</span><span class="cell-actions__val">—</span>` +
        `</button>`
    ).join('') +
    (hasEdit ? `<button class="cell-actions__item is-restore" data-action="restore" type="button">` +
      `<span class="ico">${ICON_REFRESH}</span><span>Restore default</span>` +
    `</button>` : '') +
    `<button class="cell-actions__item ${banClass}" data-action="ban" type="button">` +
      `<span class="ico">${banIcon}</span><span>${banLabel}</span>` +
    `</button>`;
  cell.appendChild(menu);

  function close() {
    cell.classList.remove('has-actions');
    menu.remove();
    document.removeEventListener('mousedown', onDocClick, true);
    document.removeEventListener('keydown', onKey);
  }
  function onDocClick(ev) { if (!cell.contains(ev.target)) close(); }
  function onKey(ev) { if (ev.key === 'Escape') close(); }
  setTimeout(() => document.addEventListener('mousedown', onDocClick, true), 0);
  document.addEventListener('keydown', onKey);

  menu.querySelector('[data-action="edit"]').onclick = (ev) => {
    ev.stopPropagation();
    close();
    openInlineEdit(cell);
  };
  menu.querySelectorAll('[data-action="copy"]').forEach((btn) => {
    btn.onclick = async (ev) => {
      ev.stopPropagation();
      close();
      await applyFleaPrice(tpl, parseFloat(btn.dataset.price), { source: btn.dataset.label, undoable: true });
    };
  });
  const restoreBtn = menu.querySelector('[data-action="restore"]');
  if (restoreBtn) restoreBtn.onclick = async (ev) => {
    ev.stopPropagation();
    close();   // remove the menu + its capture-phase doc listener before the row is replaced
    try {
      await restoreOverride(cell);   // re-renders the row
    } catch (err) {
      toast('Failed to restore: ' + err.message, 'err');
    }
  };
  menu.querySelector('[data-action="ban"]').onclick = (ev) => {
    ev.stopPropagation();
    confirmBanAction(cell, menu, !isBanned);
  };
}

function closeCellActions(cell) {
  const m = cell.querySelector('.cell-actions');
  if (m) m.remove();
  cell.classList.remove('has-actions');
}

// Remove the override for a tpl (DELETE /api/price) → restore vanilla flea price.
// Shared by the cell action menu and the inline-edit ↺ button. Re-renders the row.
async function restoreOverride(cell) {
  const tpl = cell.dataset.editTpl;
  const item = ITEMS[tpl];
  if (!item) return;
  const r = await fetch(API_BASE + '/price', {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tpl }),
  });
  const data = await r.json();
  if (!r.ok || !data.ok) throw new Error(data.error || ('HTTP ' + r.status));
  if (item.spt) { item.spt.fleaOverride = null; item.spt.fleaOfferMultiplier = null; item.spt.effectiveFleaPrice = data.effectiveFleaPrice; }
  // Sync the cached SPT-flea field so the FLEA SPT cell auto-refreshes to the restored default.
  // DELETE /api/price doesn't return `consolidated` — update the FIELD only, never assign
  // item.consolidated = data.consolidated (undefined; would wipe the object and crash renderRow).
  if (item.consolidated) item.consolidated.priceFleaSpt = data.effectiveFleaPrice;
  _dataVersion++;  // data changed → invalidate filter-cache
  const row = cell.closest('tr[data-id]');
  if (row) {
    const tmp = document.createElement('tbody');
    tmp.innerHTML = renderRow(item);
    row.replaceWith(tmp.firstElementChild);
  }
  refreshEditedFilter();  // flea-edited state changed → refresh Edited filter counts
  const what = data.mode === 'multiplier' ? 'multiplier removed' : 'override removed';
  toast(`${item.shortName || tpl}: ${what} → default ${data.effectiveFleaPrice != null ? data.effectiveFleaPrice.toLocaleString('en-US') : '—'} ₽`, 'ok');
}

function confirmBanAction(cell, menu, banning) {
  const tpl = cell.dataset.editTpl;
  const item = ITEMS[tpl];
  if (!item) return;
  const verb = banning ? 'Ban' : 'Unban';
  menu.classList.add('is-confirming');
  menu.innerHTML =
    `<div class="cell-actions__prompt">${escapeHtml(verb)} <b>${escapeHtml(item.shortName || item.name || tpl)}</b>?</div>` +
    `<div class="cell-actions__confirm">` +
      `<button class="cell-actions__btn cancel" type="button" title="Cancel">×</button>` +
      `<button class="cell-actions__btn confirm ${banning?'is-danger':'is-success'}" type="button">${verb}</button>` +
    `</div>`;
