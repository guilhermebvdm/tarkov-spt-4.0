  menu.querySelector('.cancel').onclick = (ev) => { ev.stopPropagation(); closeCellActions(cell); };
  menu.querySelector('.confirm').onclick = async (ev) => {
    ev.stopPropagation();
    const btn = ev.currentTarget;
    btn.disabled = true; btn.textContent = '…';
    try {
      const r = await fetch(API_BASE + '/ban', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tpl, banned: banning }),
      });
      const data = await r.json();
      if (!r.ok || !data.ok) throw new Error(data.error || ('HTTP ' + r.status));
      // Update in-memory state. The response has `banned`/`modItem` (not `fleaBanned`/
      // `fleaBanReasons` — those are catalog-derived field names from load-spt.js, this
      // endpoint doesn't recompute the full catalog). Derive the reason the same way
      // load-spt.js does: vanilla ban flips CanSellOnRagfair → 'bsg', mod-item ban goes
      // through ModItemBanService's custom-ban list → 'custom'.
      if (!item.spt) item.spt = { basePrice: null, fleaPrice: null, fleaBanned: false, fleaBanReasons: [], traders: [] };
      item.spt.fleaBanned = data.banned;
      item.spt.fleaBanReasons = data.banned ? [data.modItem ? 'custom' : 'bsg'] : [];
      _dataVersion++;  // data changed → invalidate filter-cache
      // Re-render this row
      const row = cell.closest('tr[data-id]');
      if (row) {
        const tmp = document.createElement('tbody');
        tmp.innerHTML = renderRow(item);
        row.replaceWith(tmp.firstElementChild);
      }
      toast(`${item.shortName || tpl}: ${banning ? 'banned' : 'unbanned'}`, 'ok');
    } catch (err) {
      toast('Failed: ' + err.message, 'err');
      closeCellActions(cell);
    }
  };
}

// Apply a flea price to a tpl — used by the cell action menu's "Copy from" items and the editor's
// Save. Clamps to [floor, ceiling] with a note, POSTs, applies the optimistic update, re-renders
// the row, and toasts. When `undoable`, the toast carries an Undo that restores the exact prior
// state (DELETE if there was no prior override, else re-POST the previous price). `beforeRerender`
// runs right before the row is replaced (the editor tears down its form + capture listener there).
// Returns true on success.
async function applyFleaPrice(tpl, rawPrice, { source = null, undoable = false, beforeRerender = null } = {}) {
  const item = ITEMS[tpl];
  if (!item) return false;
  const spt = item.spt || {};
  const floor = spt.fleaFloor || 0;
  const ceiling = spt.fleaCeiling != null ? spt.fleaCeiling : null;
  const hasEdit = spt.fleaOverride != null || spt.fleaOfferMultiplier != null;
  const prevEff = spt.effectiveFleaPrice != null ? spt.effectiveFleaPrice : null;
  let price = Math.round(rawPrice);
  if (!Number.isFinite(price) || price <= 0) { toast('Invalid value', 'err'); return false; }
  let capNote = '';
  if (floor > 0 && price < floor)         { price = floor;   capNote = ` (raised to floor ${floor.toLocaleString('en-US')} ₽)`; }
  if (ceiling != null && price > ceiling) { price = ceiling; capNote = ` (capped at ceiling ${ceiling.toLocaleString('en-US')} ₽)`; }
  try {
    const data = await auditApiCall('POST', '/price', { tpl, price });
    if (!item.spt) item.spt = { basePrice: null, fleaPrice: null, fleaFloor: 0, fleaOverride: null, fleaOfferMultiplier: null, fleaBaseRaw: null, effectiveFleaPrice: null, fleaBanned: false, fleaBanReasons: [], traders: [] };
    if (data.mode === 'multiplier') { item.spt.fleaOfferMultiplier = data.multiplier; if (data.base != null) item.spt.fleaBaseRaw = data.base; }
    else { item.spt.fleaOverride = data.override; }
    item.spt.effectiveFleaPrice = data.effectiveFleaPrice;
    // Keep the row's cached SPT-flea view in sync so the FLEA SPT cell (which renders
    // consolidated.priceFleaSpt) auto-refreshes to the new value immediately, instead of staying
    // stale until the next rescan. Update the FIELD only — never assign item.consolidated =
    // data.consolidated (it's undefined here and would wipe the object, crashing renderRow).
    if (item.consolidated) item.consolidated.priceFleaSpt = data.effectiveFleaPrice;
    _dataVersion++;
    if (beforeRerender) beforeRerender();
    rerenderMainRow(tpl);
    refreshEditedFilter();
    const fromStr = (prevEff != null && prevEff !== data.effectiveFleaPrice) ? `${prevEff.toLocaleString('en-US')} → ` : '';
    const srcStr = source ? ` from ${source}` : '';
    const undo = undoable ? { label: 'Undo', run: async () => {
      const d = (!hasEdit || prevEff == null)
        ? await auditApiCall('DELETE', '/price', { tpl })
        : await auditApiCall('POST', '/price', { tpl, price: Math.round(prevEff) });
      undoApplyFlea(tpl, d);
      toast(`${item.shortName || tpl}: reverted`, 'ok');
    } } : null;
    toast(`${item.shortName || tpl}: flea ${fromStr}${data.effectiveFleaPrice.toLocaleString('en-US')} ₽${srcStr}${capNote}`, 'ok', undo);
    return true;
  } catch (err) {
    toast((source ? `Failed to copy from ${source}: ` : 'Failed to save: ') + err.message, 'err');
    return false;
  }
}

function openInlineEdit(cell) {
  const tpl = cell.dataset.editTpl;
  const item = ITEMS[tpl];
  if (!item) return;
  if (cell.querySelector('.edit-form')) return; // already editing
  const spt = item.spt || {};
  const isMod = !!item.modSource;
  // Show the EFFECTIVE flea price (override/multiplier or default, floored) —
  // that's what the cell displays and what the user is adjusting.
  const current = spt.effectiveFleaPrice != null ? spt.effectiveFleaPrice : '';
  const bonus = spt.fleaPrice;          // additive term (handbook × M); override = X − bonus (vanilla)
  const base  = spt.fleaBaseRaw != null ? spt.fleaBaseRaw : (spt.effectiveFleaPrice != null ? spt.effectiveFleaPrice : null);  // multiplier base (mod) = X / base
  const floor = spt.fleaFloor || 0;     // flea can't go below this
  const ceiling = spt.fleaCeiling != null ? spt.fleaCeiling : null;  // flea can't go above this (mods/electronics)
  const hasEdit = spt.fleaOverride != null || spt.fleaOfferMultiplier != null;

  // Append the form as an absolute overlay so the cell keeps its original
  // dimensions and surrounding rows don't reflow when we enter edit mode.
  cell.classList.add('is-editing');
  const form = document.createElement('form');
  form.className = 'edit-form';
  form.onsubmit = (e) => { e.preventDefault(); return false; };
  const inputTip = isMod
    ? `Desired flea price. Mod item ${item.modSource} — writes itemPriceMultiplier = price / ${base != null ? base.toLocaleString('en-US') : '?'} in ragfair.json (the override does not work on a mod item, the multiplier does). ` +
      (ceiling != null ? `Max ${ceiling.toLocaleString('en-US')} ₽ (unreasonableModPrices ceiling).` : '')
    : `Desired flea price. Writes override = price − ${bonus != null ? bonus.toLocaleString('en-US') : '?'} in ragfair.json:itemPriceOverrideRouble. ` +
      (floor > 0 ? `Min ${floor.toLocaleString('en-US')} ₽ (floor = handbook × trader). ` : '') +
      (ceiling != null ? `Max ${ceiling.toLocaleString('en-US')} ₽ (Electronics/Weapon Mod ceiling = handbook × multiplier).` : '');
  const hintParts = [];
  if (isMod && base != null) hintParts.push(`base ${base.toLocaleString('en-US')}`);
  if (floor > 0)      hintParts.push(`min ${floor.toLocaleString('en-US')}`);
  if (ceiling != null) hintParts.push(`max ${ceiling.toLocaleString('en-US')}`);
  form.innerHTML =
    `<input type="number" min="${floor || 0}"${ceiling != null ? ` max="${ceiling}"` : ''} step="1" value="${current}" autofocus data-tip="${escapeAttr(inputTip)}">` +
    `<div class="edit-form__actions">` +
      `<button class="save" type="button" title="Save (Enter)">Save</button>` +
      (hasEdit ? `<button class="restore" type="button" title="Restore default price (undo edit)">↺</button>` : '') +
      `<button class="cancel" type="button" title="Cancel (Esc)">×</button>` +
    `</div>` +
    (hintParts.length ? `<div class="edit-form__hint">${hintParts.join(' · ')}</div>` : '');
  cell.appendChild(form);

  const input   = form.querySelector('input');
  const save    = form.querySelector('button.save');
  const cancel  = form.querySelector('button.cancel');
  const restore = form.querySelector('button.restore');
  input.focus(); input.select();

  let docClickHandler = null;
  function closeForm() {
    cell.classList.remove('is-editing');
    form.remove();
    if (docClickHandler) document.removeEventListener('mousedown', docClickHandler, true);
  }

  cancel.onclick = closeForm;
  input.onkeydown = (ev) => {
    if (ev.key === 'Escape') { closeForm(); }
    if (ev.key === 'Enter')  { ev.preventDefault(); save.click(); }
  };

  // Click anywhere outside the cell cancels the edit. Capture phase so we
  // get the event before any other handler. Deferred to next tick so the
  // click that opened the form isn't caught.
  docClickHandler = (ev) => {
    if (!cell.contains(ev.target)) closeForm();
  };
  setTimeout(() => document.addEventListener('mousedown', docClickHandler, true), 0);

  save.onclick = async () => {
    const price = parseInt(input.value, 10);
    if (!Number.isFinite(price) || price <= 0) { toast('Invalid value', 'err'); input.focus(); return; }
    save.disabled = true; cancel.disabled = true; if (restore) restore.disabled = true;
    // closeForm runs (via beforeRerender) just before the row is replaced, tearing down the form
    // and its capture-phase doc listener. On failure the form stays open to retry.
    const ok = await applyFleaPrice(tpl, price, { beforeRerender: closeForm });
    if (!ok) { save.disabled = false; cancel.disabled = false; if (restore) restore.disabled = false; }
  };

  if (restore) restore.onclick = async () => {
    closeForm();   // remove the form + its capture-phase doc listener before the row is replaced
    try {
      await restoreOverride(cell);   // re-renders the row
    } catch (err) {
      toast('Failed to restore: ' + err.message, 'err');
    }
  };
}

// action (optional) = { label, run } — renders a button (e.g. Undo) inside the toast; clicking it
// runs `run` (which shows its own follow-up toast) and dismisses this one. A toast with an action
// lingers longer so there's time to reach for it.
function toast(msg, kind, action) {
  const c = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = 'toast' + (kind === 'err' ? ' is-error' : kind === 'warn' ? ' is-warn' : '');
  const sigil = kind === 'err' ? '⚠ ' : kind === 'warn' ? '⚠ ' : '✓ ';
  const span = document.createElement('span');
  span.className = 'toast__msg';
  span.textContent = sigil + msg;
  t.appendChild(span);

  let timer;
  const dismiss = () => {
    clearTimeout(timer);
    t.classList.remove('is-show');
    setTimeout(() => t.remove(), 300);
  };

  let ttl = (kind === 'err' || kind === 'warn') ? 5000 : 3000;
  if (action) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'toast__action';
    btn.textContent = action.label;
    btn.onclick = async () => {
      btn.disabled = true;
      try { await action.run(); } catch (err) { toast('Undo failed: ' + err.message, 'err'); }
      dismiss();
    };
    t.appendChild(btn);
    ttl = 7000; // longer window to click Undo
  }

  c.appendChild(t);
  requestAnimationFrame(() => t.classList.add('is-show'));
  timer = setTimeout(dismiss, ttl);
}

// Promise-based confirmation modal. Resolves true (confirm) / false (cancel/Esc).
function confirmDialog({ title, body, confirmText = 'Confirm', cancelText = 'Cancel' }) {
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML =
      `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-dialog-title">` +
        `<div class="modal__title" id="confirm-dialog-title">${escapeHtml(title)}</div>` +
        `<div class="modal__body">${escapeHtml(body)}</div>` +
        `<div class="modal__actions">` +
          `<button type="button" class="modal__btn modal__btn--cancel">${escapeHtml(cancelText)}</button>` +
          `<button type="button" class="modal__btn modal__btn--confirm">${escapeHtml(confirmText)}</button>` +
        `</div>` +
      `</div>`;
    document.body.appendChild(overlay);
    const done = (val) => { overlay.remove(); document.removeEventListener('keydown', onKey); resolve(val); };
    const onKey = (e) => {
      if (e.key === 'Escape') { done(false); return; }
      if (e.key === 'Enter') { done(true); return; }
      if (e.key !== 'Tab') return;
      // Focus trap — only two buttons, keep Tab / Shift-Tab between them.
      const f = overlay.querySelectorAll('button');
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    overlay.querySelector('.modal__btn--cancel').onclick = () => done(false);
    overlay.querySelector('.modal__btn--confirm').onclick = () => done(true);
    overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) done(false); });
    document.addEventListener('keydown', onKey);
    requestAnimationFrame(() => overlay.classList.add('is-show'));
    setTimeout(() => overlay.querySelector('.modal__btn--confirm').focus(), 0);
  });
}

// ── Audit log modal (GET /api/audit-log) ────────────────────────────────────
// Player-facing activity feed: every entry gets a plain-language description (no raw field
// names/JSON by default — that's tucked behind a "details" disclosure), an icon, relative time,
// and — for live entries whose previous value is known — an Undo button that just re-calls the
// same write endpoint the main table already uses, so the result is optimistically reflected in
// the main list exactly like a normal edit (and the undo itself becomes a new, visible log entry
// — nothing is silently erased from the trail).
const AUDIT_FEATURES = ['flea-price', 'ban', 'trader-sell-price', 'trader-buy-price', 'flea-cap', 'flea-min-level', 'catalog-rebuild', 'item-refresh'];
const AUDIT_FEATURE_META = {
  'flea-price':       { icon: '💰', label: 'Flea price' },
  'ban':              { icon: '🚫', label: 'Ban' },
  'trader-sell-price':{ icon: '🏷️', label: 'Trader sell price' },
  'trader-buy-price': { icon: '💵', label: 'Trader buy price' },
  'flea-cap':         { icon: '📈', label: 'Price ceiling' },
  'flea-min-level':   { icon: '🔓', label: 'Flea min level' },
  'catalog-rebuild':  { icon: '🔄', label: 'Catalog update' },
  'item-refresh':     { icon: '🌐', label: 'Reference update' },
};

function auditPriceSpan(value) {
  return value != null ? fmtRub(value) : '<span class="audit-null">—</span>';
}
function auditPriceDelta(before, after) {
  // Direction carried by a ▲/▼ glyph as well as colour, not colour alone — matches the main
  // table's pctVsSpt() and stays legible for colour-blind users.
  let cls = '', arrow = '→';
  if (before != null && after != null && before !== after) {
    const up = after > before;
    cls = up ? 'is-up' : 'is-down';
    arrow = up ? '▲' : '▼';
  }
  return `<span class="audit-delta">${auditPriceSpan(before)}</span> <span class="audit-arrow ${cls}">${arrow}</span> <span class="audit-delta ${cls}">${auditPriceSpan(after)}</span>`;
}
function auditTraderName(traderId) {
  return (traderId && TRADER_ID_TO_NAME[traderId]) || 'unknown trader';
}
// Relative time reuses the shared fmtRelTime() (English) — the whole UI is English now, so there
// is no longer a reason for a feature-scoped clone.
async function auditApiCall(method, path, body) {
  const r = await fetch(API_BASE + path, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await r.json();
  if (!r.ok || !data.ok) throw new Error(data.error || ('HTTP ' + r.status));
  return data;
}

// Optimistic-update appliers — mirror the exact ITEMS.spt.* assignments openInlineEdit()/
// confirmBanAction()/openTraderEdit() already do for a live edit, so an undo reflects in the main
// table the same way a normal edit does, no full reload needed.
function undoApplyFlea(tpl, data) {
  const item = ITEMS[tpl];
  if (!item) return;
  if (!item.spt) item.spt = {};
  item.spt.fleaOverride = data.mode === 'override' ? data.override : null;
  item.spt.fleaOfferMultiplier = data.mode === 'multiplier' ? data.multiplier : null;
  item.spt.effectiveFleaPrice = data.effectiveFleaPrice;
  if (item.consolidated) item.consolidated.priceFleaSpt = data.effectiveFleaPrice; // auto-refresh the FLEA SPT cell
  _dataVersion++;
  rerenderMainRow(tpl);
  refreshEditedFilter();
}
function undoApplyBan(tpl, data) {
  const item = ITEMS[tpl];
  if (!item) return;
  if (!item.spt) item.spt = { fleaBanned: false, fleaBanReasons: [] };
  item.spt.fleaBanned = data.banned;
  item.spt.fleaBanReasons = data.banned ? [data.modItem ? 'custom' : 'bsg'] : [];
  _dataVersion++;
  rerenderMainRow(tpl);
}
function undoApplyTrader(isBuy, tpl, traderId, count, currency) {
  const store = isBuy ? BUY_OVERRIDES : TRADER_OVERRIDES;
  if (count == null) {
    if (store[traderId]) {
      delete store[traderId][tpl];
      if (Object.keys(store[traderId]).length === 0) delete store[traderId];
    }
  } else {
    if (!store[traderId]) store[traderId] = {};
    store[traderId][tpl] = { count, currency };
  }
  rerenderMainRow(tpl);
  if (isBuy) updateBuyTopbar(); else { updateTraderTopbar(); refreshTraderOverrideFilter(); }
}

// One entry → { desc: htmlString (player-facing, no raw field names), undo: null | { label, run } }.
// `run` throws on failure (caught by the caller) and applies the matching optimistic update above
// on success. Undo is never offered for a `baseline-unknown-date` entry (see the call site) — you
// can't undo a change whose starting state is genuinely unknown.
function describeAuditEntry(e) {
  const b = e.before || {}, a = e.after || {}, x = e.extra || {};
  const key = e.feature + '/' + e.action;

  switch (key) {
    case 'flea-price/set': {
      const desc = `Flea price changed: ${auditPriceDelta(b.effectiveFleaPrice, a.effectiveFleaPrice)}`;
      // b.value == null → there was no override before, undo = restore to default (DELETE, doesn't
      // need b.effectiveFleaPrice at all). Otherwise undo = re-set the exact previous price — but
      // that DOES need b.effectiveFleaPrice; if it's missing (item never had a cached price before
      // this edit), disable undo rather than sending Math.round(undefined) = NaN as the price.
      let undo = null;
      if (b.value == null) {
        undo = { label: 'Undo', run: async () => { const data = await auditApiCall('DELETE', '/price', { tpl: e.tpl }); undoApplyFlea(e.tpl, data); } };
      } else if (b.effectiveFleaPrice != null) {
        undo = { label: 'Undo', run: async () => { const data = await auditApiCall('POST', '/price', { tpl: e.tpl, price: Math.round(b.effectiveFleaPrice) }); undoApplyFlea(e.tpl, data); } };
      }
      return { desc, undo };
    }
    case 'flea-price/delete':
      if (b.effectiveFleaPrice == null) return { desc: `Flea price reset to default: ${auditPriceDelta(null, a.effectiveFleaPrice)}`, undo: null };
      return {
        desc: `Flea price reset to default: ${auditPriceDelta(b.effectiveFleaPrice, a.effectiveFleaPrice)}`,
        undo: {
          label: 'Undo', run: async () => {
            const data = await auditApiCall('POST', '/price', { tpl: e.tpl, price: Math.round(b.effectiveFleaPrice) });
            undoApplyFlea(e.tpl, data);
          },
        },
      };
    case 'ban/set': {
      const reasonLabel = x.modItem ? 'manual, mod item' : 'game default list';
      const desc = a.banned ? `Item banned from the flea <span class="audit-meta">(${escapeHtml(reasonLabel)})</span>` : 'Ban removed — item allowed on the flea again';
      return {
        desc,
        undo: b.banned == null ? null : {
          label: 'Undo', run: async () => {
            const data = await auditApiCall('POST', '/ban', { tpl: e.tpl, banned: b.banned });
            undoApplyBan(e.tpl, data);
          },
        },
      };
    }
    case 'trader-sell-price/set':
    case 'trader-buy-price/set': {
      const isBuy = e.feature === 'trader-buy-price';
      const path = isBuy ? '/trader-buy-price' : '/trader-price';
      const label = isBuy ? 'Buy price' : 'Sell price';
      const traderName = escapeHtml(auditTraderName(x.traderId));
      const beforeTxt = b.count != null ? `${b.count.toLocaleString('en-US')} ${escapeHtml(b.currency || '')}` : '—';
      const afterTxt = `${a.count.toLocaleString('en-US')} ${escapeHtml(a.currency || '')}`;
      return {
        desc: `${label} for <b>${traderName}</b> changed: ${beforeTxt} → ${afterTxt}`,
        undo: {
          label: 'Undo', run: async () => {
            const data = b.count == null
              ? await auditApiCall('DELETE', path, { tpl: e.tpl, traderId: x.traderId })
              : await auditApiCall('PATCH', path, { tpl: e.tpl, traderId: x.traderId, count: b.count, currency: b.currency });
            undoApplyTrader(isBuy, e.tpl, x.traderId, b.count ?? null, b.currency ?? null);
            return data;
          },
        },
      };
    }
    case 'trader-sell-price/delete':
    case 'trader-buy-price/delete': {
      const isBuy = e.feature === 'trader-buy-price';
      const path = isBuy ? '/trader-buy-price' : '/trader-price';
      const label = isBuy ? 'Buy price' : 'Sell price';
      const traderName = escapeHtml(auditTraderName(x.traderId));
      return {
        desc: `${label} for <b>${traderName}</b> reset to reference`,
        undo: b.count == null ? null : {
          label: 'Undo', run: async () => {
            const data = await auditApiCall('PATCH', path, { tpl: e.tpl, traderId: x.traderId, count: b.count, currency: b.currency });
            undoApplyTrader(isBuy, e.tpl, x.traderId, b.count, b.currency);
            return data;
          },
        },
      };
    }
    case 'trader-sell-price/delete-all':
    case 'trader-buy-price/delete-all': {
      const isBuy = e.feature === 'trader-buy-price';
      const label = isBuy ? 'buy' : 'sell';
      let count = 0;
      if (b && typeof b === 'object') for (const tplMap of Object.values(b)) count += Object.keys(tplMap || {}).length;
      return { desc: `All ${label}-price overrides removed (${count} item${count === 1 ? '' : 's'})`, undo: null };
    }
    case 'flea-cap/set':
      return {
        desc: `Price ceiling (mods/electronics) ${a.enabled ? 'enabled' : 'disabled'} <span class="audit-meta">(${x.changed || 0} categories)</span>`,
        undo: b.enabled == null ? null : {
          label: 'Undo', run: async () => {
            const data = await auditApiCall('POST', '/flea-cap', { enabled: b.enabled });
            if (fleaCapSync) fleaCapSync(data.enabled);
          },
        },
      };
    case 'flea-min-level/set':
      return {
        desc: `Flea min level changed: ${b.minUserLevel ?? '—'} → ${a.minUserLevel}`,
        undo: b.minUserLevel == null ? null : {
          label: 'Undo', run: async () => {
            const data = await auditApiCall('POST', '/flea-min-level', { minUserLevel: b.minUserLevel });
            const el = document.getElementById('flea-level-num');
            if (el) el.textContent = data.minUserLevel;
          },
        },
      };
    case 'catalog-rebuild/refresh-all':
      return { desc: `Whole catalog updated via ${escapeHtml(x.source || '?')} — ${(a.itemCount || 0).toLocaleString('en-US')} items`, undo: null };
    case 'catalog-rebuild/rescan':
      return { desc: `Catalog rescanned — ${(a.itemCount || 0).toLocaleString('en-US')} items (${a.modCount || 0} from mods)`, undo: null };
    case 'item-refresh/refresh-dev':
    case 'item-refresh/refresh-market':
      return { desc: `Reference price updated (${e.action === 'refresh-dev' ? 'tarkov.dev' : 'tarkov-market'})`, undo: null };
    default:
      return { desc: `${escapeHtml(e.feature)} / ${escapeHtml(e.action)}`, undo: null };
  }
}

function openAuditLogModal() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML =
    `<div class="modal modal--wide" role="dialog" aria-modal="true" aria-labelledby="audit-log-title">` +
      `<div class="modal__title" id="audit-log-title">Change history</div>` +
      `<div class="audit-log__filters">` +
        `<select id="audit-log-feature" aria-label="Filter by category"><option value="">All categories</option>` +
          AUDIT_FEATURES.map(f => `<option value="${escapeAttr(f)}">${escapeHtml((AUDIT_FEATURE_META[f]||{}).label || f)}</option>`).join('') +
        `</select>` +
        `<input type="text" id="audit-log-tpl" aria-label="Search by item name" placeholder="Search by item name…">` +
        `<button type="button" class="modal__btn modal__btn--cancel" id="audit-log-close">Close</button>` +
      `</div>` +
      `<div class="audit-log__feed-wrap">` +
        `<div id="audit-log-baseline-summary" class="audit-baseline-summary" hidden></div>` +
        `<div id="audit-log-feed" class="audit-feed"></div>` +
      `</div>` +
      `<div class="modal__actions">` +
        `<button type="button" class="modal__btn" id="audit-log-more">Load more</button>` +
      `</div>` +
    `</div>`;
  document.body.appendChild(overlay);

  let offset = 0;
  let total = 0;
  const LIMIT = 50;
  const baselineEntries = []; // accumulated across pages, rendered as one collapsible summary

  const feed          = overlay.querySelector('#audit-log-feed');
  const baselineBox   = overlay.querySelector('#audit-log-baseline-summary');
  const featureSel    = overlay.querySelector('#audit-log-feature');
  const tplInput      = overlay.querySelector('#audit-log-tpl');
  const moreBtn       = overlay.querySelector('#audit-log-more');

  function close() {
    overlay.remove();
    document.removeEventListener('keydown', onKey);
  }
  function onKey(e) {
    if (e.key === 'Escape') { close(); return; }
    if (e.key !== 'Tab') return;
    // Focus trap — keep Tab / Shift-Tab inside the dialog. Filter to visible nodes so a hidden
    // "Load more" (once pagination is exhausted) isn't picked as the wrap target (.focus() no-ops
    // on it, stranding Shift-Tab).
    const f = [...overlay.querySelectorAll('button, select, input, [tabindex]:not([tabindex="-1"])')].filter(el => el.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
  overlay.querySelector('#audit-log-close').onclick = close;
  overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) close(); });
  document.addEventListener('keydown', onKey);

  // Item chip: thumbnail + short name, hover/focus popover with the item's key info, click
  // copies the tpl (toast confirms). Degrades gracefully when the tpl isn't in the currently-
  // loaded catalog: still copyable, just no image/name to show.
  function renderItemChip(tpl) {
    if (!tpl) return '<span class="audit-feed-item__target-label">System</span>';
    const item = ITEMS[tpl];
    const thumb = item && item.image && item.image.icon
      ? `<img class="audit-log__item-thumb" src="${escapeAttr(item.image.icon)}" alt="" loading="lazy">`
      : '<span class="audit-log__item-thumb--empty">—</span>';
    const label = escapeHtml((item && (item.shortName || item.name)) || tpl);
    const popoverImg = item && item.image && item.image.icon ? `<img src="${escapeAttr(item.image.icon)}" alt="">` : '';
    const popoverName = item ? `<div class="name">${escapeHtml(item.name || item.shortName || tpl)}</div>` : '';
    const popoverShort = item && item.shortName ? `<div class="short">${escapeHtml(item.shortName)}${item.modSource ? ' · ' + escapeHtml(item.modSource) : ''}</div>` : '';
    return (
      `<span class="audit-log__item" data-tpl="${escapeAttr(tpl)}" tabindex="0" role="button" aria-label="Copy tpl ${escapeAttr(tpl)}">` +
        thumb +
        `<span class="audit-log__item-label">${label}</span>` +
        `<span class="audit-log__item-popover">${popoverImg}${popoverName}${popoverShort}` +
          `<div class="tpl">${escapeHtml(tpl)}</div>` +
          `<div class="hint">Click to copy</div>` +
        `</span>` +
      `</span>`
    );
  }

  function wireItemChipCopy(root) {
    const itemEl = root.querySelector('.audit-log__item');
    if (!itemEl) return;
    const copy = async () => {
      try {
        await navigator.clipboard.writeText(itemEl.dataset.tpl);
        toast(`tpl copied: ${itemEl.dataset.tpl}`, 'ok');
      } catch (err) {
        toast('Failed to copy tpl: ' + err.message, 'err');
      }
    };
    itemEl.addEventListener('click', copy);
    // The chip advertises tabindex/role=button — make Enter/Space actually operate it.
    itemEl.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); copy(); }
    });
  }

  function renderEntryCard(e) {
    const meta = AUDIT_FEATURE_META[e.feature] || { icon: '•', label: e.feature };
    const { desc, undo } = describeAuditEntry(e);
    const isBaseline = e.origin === 'baseline-unknown-date';
    const originBadge = isBaseline
      ? `<span class="badge badge--baseline" data-tip="Exact date unknown — already existed before this log started">before log</span>`
      : '';

    const card = document.createElement('div');
    card.className = 'audit-feed-item';
    card.dataset.ts = e.ts || ''; // lets prependLatestEntry() detect a duplicate top card
    card.innerHTML =
      `<div class="audit-feed-item__icon">${meta.icon}</div>` +
      `<div class="audit-feed-item__body">` +
        `<div class="audit-feed-item__top">` +
          `<span class="audit-feed-item__target">${renderItemChip(e.tpl)}</span>` +
          `<span class="audit-feed-item__time">${fmtRelTime(e.ts)}</span>` +
        `</div>` +
        `<div class="audit-feed-item__desc">${desc}</div>` +
      `</div>` +
      `<div class="audit-feed-item__actions">` +
        (!isBaseline && undo ? `<button type="button" class="audit-feed-item__undo">${escapeHtml(undo.label)}</button>` : '') +
        `<button type="button" class="audit-feed-item__details-toggle" data-tip="Technical details" aria-label="Technical details">⋯</button>` +
      `</div>` +
      `${originBadge ? `<div class="audit-feed-item__origin">${originBadge}</div>` : ''}` +
      `<pre class="audit-feed-item__raw" hidden>${escapeHtml(JSON.stringify({ before: e.before, after: e.after, extra: e.extra }, null, 2))}</pre>`;

    wireItemChipCopy(card);

    const detailsBtn = card.querySelector('.audit-feed-item__details-toggle');
    const raw = card.querySelector('.audit-feed-item__raw');
    detailsBtn.onclick = () => { raw.hidden = !raw.hidden; };

    const undoBtn = card.querySelector('.audit-feed-item__undo');
    if (undoBtn && undo) {
      undoBtn.onclick = async () => {
        undoBtn.disabled = true;
        undoBtn.textContent = '…';
        try {
          await undo.run();
          toast('Undone', 'ok');
          // Fade this card in place and prepend the NEW entry the undo just created, instead of
          // rebuilding the whole feed (which reset scroll, collapsed pagination, and wiped this
          // very .is-undone fade). The entry is in the log regardless — prepend is best-effort.
          card.classList.add('is-undone');
          undoBtn.remove();
          await prependLatestEntry();
        } catch (err) {
          toast('Undo failed: ' + err.message, 'err');
          undoBtn.disabled = false;
          undoBtn.textContent = undo.label;
        }
      };
    }

    return card;
  }

  // After an undo, fetch just the single newest entry (respecting the active filters) and insert
  // it at the top — no full reload, so scroll and pagination stay put. Best-effort: if it fails,
  // the entry is still in the log and shows on the next open/refresh.
  async function prependLatestEntry() {
    const { filter: tplFilter, noMatch } = resolveTplFilter();
    if (noMatch) return;
    const params = new URLSearchParams({ limit: 1, offset: 0 });
    if (featureSel.value) params.set('feature', featureSel.value);
    if (tplFilter) params.set('tpl', tplFilter);
    try {
      const r = await fetch(API_BASE + '/audit-log?' + params.toString());
      const data = await r.json();
      const e = (data.entries || [])[0];
      total = data.total || total;
      if (!e) return;
      if (e.origin === 'baseline-unknown-date') { baselineEntries.unshift(e); renderBaselineSummary(); }
      else {
        // A no-op undo (CR-02 guards write no new line when restoring an already-current value)
        // leaves the newest matching entry as the one already at the top — don't insert a
        // duplicate card or bump offset.
        if (feed.firstElementChild && feed.firstElementChild.dataset.ts === e.ts) return;
        feed.insertBefore(renderEntryCard(e), feed.firstChild);
        offset++;
      }
      moreBtn.hidden = offset >= total;
    } catch { /* non-fatal — see comment above */ }
  }

  function renderBaselineSummary() {
    if (baselineEntries.length === 0) { baselineBox.hidden = true; baselineBox.dataset.renderedCount = '0'; return; }
    // Rebuild only when the baseline set actually grew (via "load more"/undo). Re-running the full
    // innerHTML rebuild on every page load that brought only live entries is wasted work — and it
    // would blank out an already-expanded list. When it does grow and was open, immediately re-fill
    // the fresh list so an expanded summary never renders empty.
    if (String(baselineEntries.length) === baselineBox.dataset.renderedCount) return;
    baselineBox.dataset.renderedCount = String(baselineEntries.length);
    baselineBox.hidden = false;
    const expanded = baselineBox.classList.contains('is-open');
    baselineBox.innerHTML =
      `<button type="button" class="audit-baseline-summary__toggle">` +
        `📦 ${baselineEntries.length} ${baselineEntries.length === 1 ? 'action' : 'actions'} before the log started` +
        `<span class="chev"></span>` +
      `</button>` +
      `<div class="audit-baseline-summary__list"${expanded ? '' : ' hidden'}></div>`;
    const list = baselineBox.querySelector('.audit-baseline-summary__list');
    if (expanded) {
      for (const e of baselineEntries) list.appendChild(renderEntryCard(e));
      list.dataset.filled = '1';
    }
    baselineBox.querySelector('.audit-baseline-summary__toggle').onclick = () => {
      const nowOpen = list.hidden;
      list.hidden = !nowOpen;
      baselineBox.classList.toggle('is-open', nowOpen);
      if (nowOpen && !list.dataset.filled) {
        list.dataset.filled = '1';
        for (const e of baselineEntries) list.appendChild(renderEntryCard(e));
      }
    };
  }

  const SKELETON_HTML = '<div class="audit-skel"></div>'.repeat(4);

  async function loadPage(reset) {
    if (reset) { offset = 0; feed.innerHTML = ''; baselineEntries.length = 0; baselineBox.dataset.renderedCount = ''; }
    const { filter: tplFilter, noMatch } = resolveTplFilter();
    if (noMatch) {
      // A non-empty search that resolved to zero tpls — bail out before hitting the
      // backend. An empty tpl param is indistinguishable from "no filter" there
      // (AuditLogController's split+RemoveEmptyEntries yields an empty set either way),
      // so without this the feed would silently show the FULL unfiltered history instead
      // of "nothing found" for the exact query the user typed.
      total = 0;
      moreBtn.hidden = true;
      baselineBox.hidden = true; // no match → don't leave a stale baseline summary above the empty state
      feed.innerHTML = '<div class="audit-log__empty">No actions match these filters.</div>';
      return;
    }
    const params = new URLSearchParams({ limit: LIMIT, offset });
    if (featureSel.value) params.set('feature', featureSel.value);
    if (tplFilter) params.set('tpl', tplFilter);
    if (reset) feed.innerHTML = SKELETON_HTML; // loading state — avoids an empty flash misread as "no history"
    moreBtn.disabled = true;
    try {
      const r = await fetch(API_BASE + '/audit-log?' + params.toString());
      const data = await r.json();
      total = data.total || 0;
      const entries = data.entries || [];
      if (reset) feed.innerHTML = '';
      if (reset && entries.length === 0) {
        baselineBox.hidden = true; // no results → hide any stale baseline summary
        feed.innerHTML = '<div class="audit-log__empty">No actions match these filters.</div>';
      } else {
        // Build all cards into a fragment and append once — one layout pass instead of up to
        // LIMIT separate insertions per page.
        const frag = document.createDocumentFragment();
        for (const e of entries) {
          if (e.origin === 'baseline-unknown-date') baselineEntries.push(e);
          else frag.appendChild(renderEntryCard(e));
        }
        feed.appendChild(frag);
        renderBaselineSummary();
      }
      offset += entries.length;
      moreBtn.hidden = offset >= total;
    } catch (err) {
      feed.innerHTML = `<div class="audit-log__empty">Failed to load: ${escapeHtml(err.message)}</div>`;
    } finally {
      moreBtn.disabled = false;
    }
  }

  // Name-based search: an exact 24-char hex tpl is used directly; anything else resolves
  // (client-side) to every currently-loaded item whose name/shortName contains the query, sent
  // as a comma-separated list (same convention as the main table's URL filters) — nobody
  // browsing this feed thinks in raw tpls. Capped so a very generic query can't build an
  // unreasonably long query string.
  function resolveTplFilter() {
    const raw = tplInput.value.trim();
    if (!raw) return { filter: '', noMatch: false };
    if (/^[a-f0-9]{24}$/i.test(raw)) return { filter: raw, noMatch: false };
    const q = raw.toLowerCase();
    const matches = [];
    for (const [t, it] of Object.entries(ITEMS)) {
      if ((it.name || '').toLowerCase().includes(q) || (it.shortName || '').toLowerCase().includes(q)) {
        matches.push(t);
        if (matches.length >= 200) break;
      }
    }
    return { filter: matches.join(','), noMatch: matches.length === 0 };
  }

  featureSel.onchange = () => loadPage(true);
  let tplDebounceTimer;
  tplInput.oninput = () => { clearTimeout(tplDebounceTimer); tplDebounceTimer = setTimeout(() => loadPage(true), 300); };
  moreBtn.onclick = () => loadPage(false);

  requestAnimationFrame(() => overlay.classList.add('is-show'));
  setTimeout(() => tplInput.focus(), 0); // land focus inside the dialog (search is the likely first action)
  loadPage(true);
}

function setBulkBusy(busy) {
  const trigger = document.getElementById('update-menu-trigger');
  if (trigger) { trigger.disabled = busy; trigger.classList.toggle('is-busy', busy); }
  document.body.classList.toggle('is-bulk-busy', busy);
}

// ── "⟳ Update" menu (rescan / update-all dev / update-all market) ────────────
// Popdown matching the .dropdown visual style. Reuses the existing handlers
// (rescanMods / refreshAll) — no logic duplicated. Closes on outside-click/Esc/
// item click.
let _updateMenuCleanup = null;
function bindUpdateMenu() {
  const trigger = document.getElementById('update-menu-trigger');
  if (trigger) trigger.addEventListener('click', (e) => { e.stopPropagation(); toggleUpdateMenu(); });
}

function toggleUpdateMenu() {
  const host = document.getElementById('update-menu');
  if (!host) return;
  if (host.querySelector('.update-menu__panel')) closeUpdateMenu();
  else openUpdateMenu();
}

function openUpdateMenu() {
  const host = document.getElementById('update-menu');
  const trigger = document.getElementById('update-menu-trigger');
  if (!host || host.querySelector('.update-menu__panel')) return;

  const items = [
    { label: 'Rescan mods',                tip: 'Re-read the local SPT database (picks up items from newly-added mods). Does not fetch tarkov.dev/market.', run: () => rescanMods() },
    { label: 'Update all · tarkov.dev',    tip: 'Update ALL prices via tarkov.dev',    run: () => refreshAll('dev') },
    { label: 'Update all · tarkov-market', tip: 'Update ALL prices via tarkov-market', run: () => refreshAll('market') },
  ];

  const panel = document.createElement('div');
  panel.className = 'update-menu__panel';
  panel.setAttribute('role', 'menu');
  for (const it of items) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'update-menu__item';
    btn.setAttribute('role', 'menuitem');
    btn.innerHTML = `<span class="update-menu__label">${escapeHtml(it.label)}</span>` +
                    `<span class="update-menu__sub">${escapeHtml(it.tip)}</span>`;
    btn.onclick = (e) => { e.stopPropagation(); closeUpdateMenu(); it.run(); };
    panel.appendChild(btn);
  }
  host.appendChild(panel);
  host.classList.add('is-open');
  if (trigger) trigger.setAttribute('aria-expanded', 'true');

  const onDocClick = (e) => { if (!host.contains(e.target)) closeUpdateMenu(); };
  const onKey = (e) => { if (e.key === 'Escape') closeUpdateMenu(); };
  setTimeout(() => document.addEventListener('click', onDocClick), 0);
  document.addEventListener('keydown', onKey);
  _updateMenuCleanup = () => {
    document.removeEventListener('click', onDocClick);
    document.removeEventListener('keydown', onKey);
  };
}

function closeUpdateMenu() {
  const host = document.getElementById('update-menu');
  const trigger = document.getElementById('update-menu-trigger');
  if (host) {
    const panel = host.querySelector('.update-menu__panel');
    if (panel) panel.remove();
    host.classList.remove('is-open');
  }
  if (trigger) trigger.setAttribute('aria-expanded', 'false');
  if (_updateMenuCleanup) { _updateMenuCleanup(); _updateMenuCleanup = null; }
}

// Rescan the local SPT DB (load-spt + normalize, no external fetch) → reload.
// Picks up mod items added/removed since the last run. Fast; no confirm needed.
async function rescanMods() {
  setBulkBusy(true);
  toast('Re-reading the SPT database (mods + prices)…', 'ok');
  try {
    const r = await fetch(API_BASE + '/rescan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    const data = await r.json();
    if (!r.ok || !data.ok) throw new Error(data.error || ('HTTP ' + r.status));
    const secs = data.durationMs != null ? ` in ${(data.durationMs / 1000).toFixed(1)}s` : '';
    const mods = data.modCount != null ? ` (${data.modCount} from mods)` : '';
    toast(`${(data.itemCount || 0).toLocaleString('en-US')} items${mods}${secs} — reloading…`, 'ok');
    setTimeout(() => location.reload(), 800);
  } catch (err) {
    setBulkBusy(false);
    toast(`Rescan failed: ${err.message}`, 'err');
  }
}

// Bulk update all items from one source (dev | market): confirm → busy → POST
// /api/refresh-all (server re-fetches the full dump + re-merges) → reload.
async function refreshAll(source) {
  const label = source === 'market' ? 'tarkov-market' : 'tarkov.dev';
  const count = (typeof ITEM_LIST !== 'undefined' && ITEM_LIST) ? ITEM_LIST.length : 0;
  const ok = await confirmDialog({
    title: `Update ALL prices via ${label}?`,
    body: `Re-downloads ~${count.toLocaleString('en-US')} items at once (usually a few seconds, ~5–15s). Price editing is locked while it runs; the page reloads when done.`,
    confirmText: 'Update all',
  });
  if (!ok) return;
  setBulkBusy(true);
  toast(`Updating all via ${label}… (a few seconds)`, 'ok');
  try {
    const r = await fetch(API_BASE + '/refresh-all', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ source }),
    });
    const data = await r.json();
    if (!r.ok || !data.ok) throw new Error(data.error || ('HTTP ' + r.status));
    const secs = data.durationMs != null ? ` in ${(data.durationMs / 1000).toFixed(1)}s` : '';
    toast(`${(data.itemCount || count).toLocaleString('en-US')} items updated via ${label}${secs} — reloading…`, 'ok');
    setTimeout(() => location.reload(), 1000);
  } catch (err) {
    setBulkBusy(false);
    toast(`Failed to update all via ${label}: ${err.message}`, 'err');
  }
}

// ── Per-trader price editing (companion mod TRLTraderPrices) ─────────────────
const TRADER_MONEY_CURRENCIES = new Set(['RUB', 'USD', 'EUR', 'GP']);
const CURRENCY_SYMBOL = { RUB: '₽', USD: '$', EUR: '€', GP: 'GP' };
const CURRENCY_PILL_CLASS = { USD: 'currency--usd', EUR: 'currency--eur', GP: 'currency--gp' };
// Currencies that get a faint rouble-equivalent hint next to their native value.
// GP is intentionally excluded (no meaningful ₽ conversion shown to the player).
const CURRENCY_RUB_HINT = new Set(['USD', 'EUR']);

// Native amount (integer) → rouble-equivalent via CURRENCY_RATES. RUB is identity.
function rubFromNative(native, cur) {
  if (native == null) return null;
  const rate = CURRENCY_RATES[cur];
  if (!rate || rate <= 0) return null;
  return Math.round(native * rate);
}

// Total override count + how many traders carry at least one.
function traderOverrideTotals() {
  let total = 0; let traders = 0;
  for (const tpls of Object.values(TRADER_OVERRIDES)) {
    const n = tpls ? Object.keys(tpls).length : 0;
    if (n > 0) { total += n; traders++; }
  }
  return { total, traders };
}

// Show/hide the topbar "clear trader overrides" button + pending pill.
function updateTraderTopbar() {
  const { total, traders } = traderOverrideTotals();
  const btn  = document.getElementById('clear-trader-overrides');
  const pill = document.getElementById('trader-pending-pill');
  if (btn)  btn.hidden  = total === 0;
  if (pill) {
    pill.hidden = total === 0;
    pill.textContent = total > 0 ? `${total} trader edit${total === 1 ? '' : 's'} pending` : '';
  }
}

// Reset ALL trader sell-price overrides (DELETE /api/trader-price/all).
async function clearAllTraderOverrides() {
  const { total, traders } = traderOverrideTotals();
  if (total === 0) return;
  const ok = await confirmDialog({
    title: 'Reset ALL trader sell-price overrides?',
    body: `Removes ${total} override${total === 1 ? '' : 's'} across ${traders} trader${traders === 1 ? '' : 's'}. Cannot be undone.`,
    confirmText: 'Reset all',
  });
  if (!ok) return;
  const btn = document.getElementById('clear-trader-overrides');
  if (btn) { btn.disabled = true; btn.classList.add('is-busy'); }
  try {
    const r = await fetch(API_BASE + '/trader-price/all', { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    const data = await r.json();
    if (!r.ok || !data.ok) throw new Error(data.error || ('HTTP ' + r.status));
    TRADER_OVERRIDES = {};
    // Re-render any open trader rows so OVR badges / struck-through bases clear.
    document.querySelectorAll('tr.detail .trader-edit-table').forEach(rerenderTraderTable);
    // Clear OVR markers from visible item rows in the main table too.
    document.querySelectorAll('tr[data-id]').forEach(r => {
      if (r.querySelector('.cell-trader__ovr')) rerenderMainRow(r.getAttribute('data-id'));
    });
    refreshTraderOverrideFilter();
    updateTraderTopbar();
    const n = data.removedCount != null ? data.removedCount : total;
    toast(`${n} trader override${n === 1 ? '' : 's'} removed · restart SPT to apply${data.warning ? ` (${data.warning})` : ''}`, data.warning ? 'warn' : 'ok');
  } catch (err) {
    toast('Failed to reset trader overrides: ' + err.message, 'err');
  } finally {
    if (btn) { btn.disabled = false; btn.classList.remove('is-busy'); }
  }
}

// Re-render every trader row in a given <table.trader-edit-table> from ITEMS.
function rerenderTraderTable(table) {
  const tpl = table.dataset.traderTpl;
  const item = ITEMS[tpl];
  if (!item) return;
  const traders = item.spt && item.spt.traders ? item.spt.traders : [];
  if (traders.length === 0) return;
  table.innerHTML = traders.map(t => renderTraderRow(item, t)).join('');
}

// CR-05: buyback-override equivalents of traderOverrideTotals/updateTraderTopbar/
// clearAllTraderOverrides/rerenderTraderTable above — same pattern, over BUY_OVERRIDES /
// /api/trader-buy-price/all / .buy-edit-table (the endpoint already existed server-side but had
// no UI wired to it).
function buyOverrideTotals() {
  let total = 0; let traders = 0;
  for (const tpls of Object.values(BUY_OVERRIDES)) {
    const n = tpls ? Object.keys(tpls).length : 0;
    if (n > 0) { total += n; traders++; }
  }
  return { total, traders };
}

function updateBuyTopbar() {
  const { total } = buyOverrideTotals();
  const btn  = document.getElementById('clear-buy-overrides');
  const pill = document.getElementById('buy-pending-pill');
  if (btn)  btn.hidden  = total === 0;
  if (pill) {
    pill.hidden = total === 0;
    pill.textContent = total > 0 ? `${total} buyback edit${total === 1 ? '' : 's'} pending` : '';
  }
}

async function clearAllBuyOverrides() {
  const { total, traders } = buyOverrideTotals();
  if (total === 0) return;
  const ok = await confirmDialog({
    title: 'Reset ALL trader buyback-price overrides?',
    body: `Removes ${total} override${total === 1 ? '' : 's'} across ${traders} trader${traders === 1 ? '' : 's'}. Cannot be undone.`,
    confirmText: 'Reset all',
  });
  if (!ok) return;
  const btn = document.getElementById('clear-buy-overrides');
  if (btn) { btn.disabled = true; btn.classList.add('is-busy'); }
  try {
    const r = await fetch(API_BASE + '/trader-buy-price/all', { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    const data = await r.json();
    if (!r.ok || !data.ok) throw new Error(data.error || ('HTTP ' + r.status));
    BUY_OVERRIDES = {};
    document.querySelectorAll('tr.detail .buy-edit-table').forEach(rerenderBuyTable);
    document.querySelectorAll('tr[data-id]').forEach(r => {
      if (r.querySelector('.cell-trader__ovr')) rerenderMainRow(r.getAttribute('data-id'));
    });
    updateBuyTopbar();
    const n = data.removedCount != null ? data.removedCount : total;
    toast(`${n} buyback override${n === 1 ? '' : 's'} removed · restart SPT to apply${data.warning ? ` (${data.warning})` : ''}`, data.warning ? 'warn' : 'ok');
  } catch (err) {
    toast('Failed to reset buyback overrides: ' + err.message, 'err');
  } finally {
    if (btn) { btn.disabled = false; btn.classList.remove('is-busy'); }
  }
}

// Buy/buyback source rows: one per REGISTERED trader (vanilla + mod, e.g. Artem) — never sourced
// from dev.sellFor alone (tarkov.dev only knows vanilla traders/items; a mod trader or a mod item
// would otherwise never get a row at all, even though the backend is fully trader-agnostic). A
// tarkov.dev reference price is merged in for display when one exists; renderBuyRow already shows
// "—" and stays editable when it doesn't. Single source of truth for renderDetail's initial build,
// rerenderBuyRowEl (single-row refresh) and rerenderBuyTable (bulk refresh) — all three used to
// independently re-derive this from dev.sellFor, which is what dropped Artem's row on refresh.
function buildBuySourceRows(item) {
  const dev = item.tarkovDev && item.tarkovDev.pve;
  const devSellByVendor = {};
  if (dev && dev.sellFor) {
    for (const s of dev.sellFor) {
      if (s.vendor && s.vendor.normalizedName !== 'flea-market') devSellByVendor[s.vendor.name] = s;
    }
  }
  return Object.keys(TRADERS)
    .map(name => devSellByVendor[name] || { vendor: { name, normalizedName: name.toLowerCase() }, price: null, priceRUB: null, currency: null })
    .sort((a,b) => (b.priceRUB||0) - (a.priceRUB||0));
}

// Re-render every buyback row in a given <table.buy-edit-table> from the trader registry.
function rerenderBuyTable(table) {
  const tpl = table.dataset.buyTpl;
  const item = ITEMS[tpl];
  if (!item) return;
  const rows = buildBuySourceRows(item);
  if (rows.length === 0) return;
  table.innerHTML = rows.map(s => renderBuyRow(item, s)).join('');
}

// Resolve the current override for a (trader, tpl) as { count, currency }, or null.
// `count` is the NATIVE amount the game charges (not rouble-equivalent).
function traderOverrideFor(traderId, tpl) {
  if (!traderId) return null;
  const byTrader = TRADER_OVERRIDES[traderId];
  if (!byTrader || byTrader[tpl] == null) return null;
  return byTrader[tpl];
}

// Override's native count, or null. Tolerates a legacy plain-number override.
function traderOverrideCount(traderId, tpl) {
  const ovr = traderOverrideFor(traderId, tpl);
  if (ovr == null) return null;
  return (typeof ovr === 'object') ? ovr.count : ovr;
}

// B-3: same lookups as traderOverrideFor/traderOverrideCount, over BUY_OVERRIDES (buyback).
function buyOverrideFor(traderId, tpl) {
  if (!traderId) return null;
  const byTrader = BUY_OVERRIDES[traderId];
  if (!byTrader || byTrader[tpl] == null) return null;
  return byTrader[tpl];
}
function buyOverrideCount(traderId, tpl) {
  const ovr = buyOverrideFor(traderId, tpl);
  if (ovr == null) return null;
  return (typeof ovr === 'object') ? ovr.count : ovr;
}

// PRIMARY native value markup — same pattern as RUB (fmtRub): plain number OUTSIDE the
// badge, only the currency UNIT inside the tag. RUB → "18.397 ₽"; USD/EUR/GP → "417 $".
function nativeValueMarkup(native, cur) {
  if (native == null) return `<span class="trader-price-val is-null">—</span>`;
  if (cur === 'RUB') return `<span class="trader-price-val">${fmtRub(native)}</span>`;
  const cls = CURRENCY_PILL_CLASS[cur] || 'currency--usd';
  const sym = CURRENCY_SYMBOL[cur] || cur;
  const rate = CURRENCY_RATES[cur];
  const tip = (rate && rate > 0)
    ? escapeAttr('In-game native currency (@ ' + rate.toLocaleString('en-US') + ' ₽/' + sym + ')')
    : 'In-game native currency';
  return `<span class="trader-price-val">${native.toLocaleString('en-US')} <span class="currency ${cls}" data-tip="${tip}">${escapeHtml(sym)}</span></span>`;
}

// Faint rouble-equivalent hint "≈ X ₽" for USD/EUR only. '' otherwise (incl. GP/RUB).
function rubHintMarkup(native, cur) {
  if (!CURRENCY_RUB_HINT.has(cur)) return '';
  const rub = rubFromNative(native, cur);
  if (rub == null) return '';
  return ` <span class="trader-rub-hint" data-tip="${escapeAttr('rouble-equivalent (@ ' + CURRENCY_RATES[cur].toLocaleString('en-US') + ' ₽/' + (CURRENCY_SYMBOL[cur] || cur) + ')')}">≈ ${rub.toLocaleString('en-US')} ₽</span>`;
}

// Render one offer row. Editable rows (money & not Fence) get an inline edit
// affordance + OVR badge when overridden; barter / Fence rows are read-only.
function renderTraderRow(it, t) {
  const tpl = it.id;
  const traderId = t.traderId || (t.name ? (TRADERS[t.name] && TRADERS[t.name].id) : null);
  const isFence = traderId === FENCE_ID;
  const isBarter = t.currency === 'BARTER';
  const isMoney = TRADER_MONEY_CURRENCIES.has(t.currency);
  // `editable` is precomputed upstream (money && not Fence); fall back defensively.
  const editable = (t.editable === true) || (isMoney && !isFence && !isBarter && !!traderId);
  const sym = CURRENCY_SYMBOL[t.currency] || t.currency || '';
  const ovr = editable ? traderOverrideFor(traderId, tpl) : null;
  const hasOvr = ovr != null;

  // Quest-lock 🔒 gets its own tooltip so it isn't confused with Fence's marker.
  const lockGlyph = t.questLocked ? ` · <span class="trader-lock" data-tip="Quest-locked — an override here applies only after you unlock the quest (until then the item sits in the trader's quest assort, not the live one)">🔒</span>` : '';
  const meta = `<small class="vendor">${escapeHtml(t.currency || '?')} · L${t.loyaltyLevel}${lockGlyph}${t.unlimited?' · ∞':''}</small>`;
  const nameCell = `<td class="k">${escapeHtml(t.name)} ${meta}</td>`;

  // Muted em-dash for a missing effective price.
  const nullCell = `<span class="trader-price-val is-null">—</span>`;

  if (isBarter) {
    return `<tr>${nameCell}<td class="v"><span class="vendor" data-tip="barter — not editable">barter</span></td></tr>`;
  }
  if (isFence) {
    // Distinct Fence marker/label — not the quest-lock 🔒. Shows native value + ₽ hint.
    const fencePrice = t.price != null
      ? nativeValueMarkup(t.price, t.currency) + rubHintMarkup(t.price, t.currency)
      : nullCell;
    return `<tr>${nameCell}<td class="v">${fencePrice} <span class="vendor trader-fence-tag" data-tip="Fence — dynamic assort, not editable">Fence — not editable</span></td></tr>`;
  }
  if (!editable) {
    const ro = t.price != null
      ? nativeValueMarkup(t.price, t.currency) + rubHintMarkup(t.price, t.currency)
      : nullCell;
    return `<tr>${nameCell}<td class="v">${ro}</td></tr>`;
  }

  // Editable: NATIVE model. base = game's native amount; override.count overrides it.
  const base = t.price;
  const ovrCount = hasOvr ? ((typeof ovr === 'object') ? ovr.count : ovr) : null;
  const eff = hasOvr && ovrCount != null ? ovrCount : base;
  const rubHint = eff != null ? rubHintMarkup(eff, t.currency) : '';
  // OVR tooltip in NATIVE units; ₽ equivalent only appended for USD/EUR.
  const effRub = CURRENCY_RUB_HINT.has(t.currency) ? rubFromNative(eff, t.currency) : null;
  const effRubTxt = effRub != null ? ` ≈ ${effRub.toLocaleString('en-US')} ₽` : '';
  const badge = hasOvr
    ? ` <span class="badge badge--override" data-tip="${escapeAttr('Override active — trader sell price pinned at ' + (eff!=null?eff.toLocaleString('en-US'):'?') + ' ' + sym + ' (base ' + (base!=null?base.toLocaleString('en-US'):'?') + ' ' + sym + ')' + effRubTxt + '. Edit / restore here.')}">OVR</span>`
    : '';

  // T6: when overridden, show the base struck-through then the override value (native).
  let priceMarkup;
  if (eff == null) {
    priceMarkup = nullCell;
  } else if (hasOvr) {
    priceMarkup = (base != null ? `<s class="trader-price-base">${nativeValueMarkup(base, t.currency)}</s> → ` : '') +
      `<span class="is-overridden">${nativeValueMarkup(eff, t.currency)}</span>${rubHint}`;
  } else {
    priceMarkup = `${nativeValueMarkup(eff, t.currency)}${rubHint}`;
  }
  // T7: inline restore ↺ for overridden rows (deletes without opening the editor).
  const restoreBtn = hasOvr
    ? `<button class="trader-restore-btn" type="button" data-tip="Restore default sell price" aria-label="Restore default sell price">↺</button>`
    : '';
  return `<tr class="trader-row is-editable${hasOvr?' is-overridden':''}" data-trader-id="${escapeAttr(traderId||'')}" data-trader-tpl="${escapeAttr(tpl)}" data-trader-base="${base!=null?base:''}" data-trader-cur="${escapeAttr(t.currency||'')}">` +
    nameCell +
    `<td class="v trader-edit-cell" data-tip="Click to edit the trader's sell price" tabindex="0" role="button" aria-label="Edit trader sell price">` +
      priceMarkup + badge + restoreBtn +
      `<button class="trader-edit-btn" type="button" title="Edit trader sell price" tabindex="-1">${ICON_EDIT}</button>` +
    `</td>` +
  `</tr>`;
}

// Re-render a single trader row from ITEMS, returning a fresh <tr>. Optionally
// moves focus back to the row's edit cell (keyboard return after an action).
function rerenderTraderRowEl(row, focusBack) {
  const tpl = row.dataset.traderTpl;
  const traderId = row.dataset.traderId;
  const item = ITEMS[tpl];
  if (!item) return null;
  const t = (item.spt && item.spt.traders ? item.spt.traders : []).find(x =>
    (x.traderId || (x.name && TRADERS[x.name] && TRADERS[x.name].id)) === traderId);
  if (!t) return null;
  const tmp = document.createElement('tbody');
  tmp.innerHTML = renderTraderRow(item, t);
  const fresh = tmp.firstElementChild;
  row.replaceWith(fresh);
  if (focusBack) {
    const cell = fresh.querySelector('.trader-edit-cell');
    if (cell) cell.focus();
  }
  return fresh;
}

// Re-render the MAIN table row for a tpl (preserving its expanded state + open detail
// sibling) so a trader-override edit reflects in the item row's TRADER column, not just
// the detail panel. No-op if the row is currently windowed out (correct on next render).
function rerenderMainRow(tpl) {
  const item = ITEMS[tpl];
  if (!item) return;
  const sel = (window.CSS && CSS.escape) ? CSS.escape(tpl) : tpl;
  const mainRow = document.querySelector('tr[data-id="' + sel + '"]');
  if (!mainRow) return;
  const wasExpanded = mainRow.classList.contains('is-expanded');
  const tmp = document.createElement('tbody');
  tmp.innerHTML = renderRow(item);
  const fresh = tmp.firstElementChild;
  if (wasExpanded && fresh) fresh.classList.add('is-expanded');
  mainRow.replaceWith(fresh);
}

// T7: inline restore (↺ on the row, no editor). DELETEs the override directly.
async function restoreTraderOverride(row) {
  const tpl = row.dataset.traderTpl;
  const traderId = row.dataset.traderId;
  const btn = row.querySelector('.trader-restore-btn');
  if (btn) btn.disabled = true;
  try {
    const r = await fetch(API_BASE + '/trader-price', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tpl, traderId }),
    });
    const data = await r.json();
    if (!r.ok || !data.ok) throw new Error(data.error || ('HTTP ' + r.status));
    if (TRADER_OVERRIDES[traderId]) {
      delete TRADER_OVERRIDES[traderId][tpl];
      if (Object.keys(TRADER_OVERRIDES[traderId]).length === 0) delete TRADER_OVERRIDES[traderId];
    }
    rerenderTraderRowEl(row, true);
    rerenderMainRow(tpl);
    refreshTraderOverrideFilter();
    updateTraderTopbar();
    const item = ITEMS[tpl];
    toast(`${(item && (item.shortName || item.name)) || tpl}: trader override removed → default · restart SPT to apply${data.warning ? ` (${data.warning})` : ''}`, data.warning ? 'warn' : 'ok');
  } catch (err) {
    if (btn) btn.disabled = false;
    toast('Failed to restore: ' + err.message, 'err');
  }
}

// Open the inline editor on a trader row. Mirrors the flea inline edit.
function openTraderEdit(row) {
  if (row.querySelector('.trader-edit-form')) return; // already editing
  const tpl = row.dataset.traderTpl;
  const traderId = row.dataset.traderId;
  const cur = row.dataset.traderCur;
  const sym = CURRENCY_SYMBOL[cur] || cur || '';
  const base = row.dataset.traderBase !== '' ? Number(row.dataset.traderBase) : null;
  const ovrCount = traderOverrideCount(traderId, tpl);
  // Input is the NATIVE amount; default to the current effective native value.
  const current = ovrCount != null ? ovrCount : (base != null ? base : '');
  const hasOvr = ovrCount != null;

  const isRub = cur === 'RUB';
  const rate = CURRENCY_RATES[cur];
  const showRubPreview = CURRENCY_RUB_HINT.has(cur) && rate && rate > 0;

  const cell = row.querySelector('.trader-edit-cell');
  cell.classList.add('is-editing');
  const form = document.createElement('form');
  form.className = 'trader-edit-form';
  form.onsubmit = (e) => { e.preventDefault(); return false; };
  form.innerHTML =
    // NATIVE integer input — step 1, no rate snapping. No data-tip here: it would pop on
    // autofocus and collide with the preview/hint below (which already explain the field).
    `<input type="number" min="1" step="1" value="${current}" autofocus aria-label="Trader sell price in ${escapeAttr(cur)}">` +
    `<div class="trader-edit-form__preview" aria-live="polite"></div>` +
    `<div class="trader-edit-form__actions">` +
      `<button class="save" type="button" title="Save (Enter)">Save</button>` +
      (hasOvr ? `<button class="restore" type="button" title="Restore default price (undo edit)">↺</button>` : '') +
      `<button class="cancel" type="button" title="Cancel (Esc)">×</button>` +
    `</div>` +
    `<div class="trader-edit-form__hint">edit in ${escapeHtml(cur)} · applies to all loyalty levels · restart SPT to apply</div>`;
  cell.appendChild(form);

  const input   = form.querySelector('input');
  const preview = form.querySelector('.trader-edit-form__preview');
  const save    = form.querySelector('button.save');
  const cancel  = form.querySelector('button.cancel');
  const restore = form.querySelector('button.restore');
  input.focus(); input.select();

  // Live preview. USD/EUR → rouble-equivalent; GP → "= N GP"; RUB → "= N ₽".
  function updatePreview() {
    const v = parseInt(input.value, 10);
    if (!Number.isFinite(v) || v <= 0) { preview.textContent = ''; return; }
    if (showRubPreview) {
      const rub = Math.round(v * rate);
      preview.textContent = `≈ ${rub.toLocaleString('en-US')} ₽ (@ ${rate.toLocaleString('en-US')} ₽/${sym})`;
    } else if (isRub) {
      preview.textContent = `= ${v.toLocaleString('en-US')} ₽`;
    } else {
      preview.textContent = `= ${v.toLocaleString('en-US')} ${sym}`;
    }
  }
  input.addEventListener('input', updatePreview);
  updatePreview();

  let docClickHandler = null;
  function closeForm() {
    cell.classList.remove('is-editing');
    form.remove();
    if (docClickHandler) document.removeEventListener('mousedown', docClickHandler, true);
  }
  function rerenderRow() { return rerenderTraderRowEl(row, true); }

  cancel.onclick = () => { closeForm(); const cell2 = row.querySelector('.trader-edit-cell'); if (cell2) cell2.focus(); };
  input.onkeydown = (ev) => {
    if (ev.key === 'Escape') closeForm();
    if (ev.key === 'Enter')  { ev.preventDefault(); save.click(); }
  };
  docClickHandler = (ev) => { if (!row.contains(ev.target)) closeForm(); };
  setTimeout(() => document.addEventListener('mousedown', docClickHandler, true), 0);

  save.onclick = async () => {
    const count = parseInt(input.value, 10);
    if (!Number.isFinite(count) || count <= 0) { toast('Invalid value', 'err'); input.focus(); return; }
    save.disabled = true; cancel.disabled = true; if (restore) restore.disabled = true;
    try {
      const r = await fetch(API_BASE + '/trader-price', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tpl, traderId, count, currency: cur }),
      });
      const data = await r.json();
      if (!r.ok || !data.ok) throw new Error(data.error || ('HTTP ' + r.status));
      // Optimistically reflect the new override (NATIVE { count, currency }).
      if (!TRADER_OVERRIDES[traderId]) TRADER_OVERRIDES[traderId] = {};
      TRADER_OVERRIDES[traderId][tpl] = { count, currency: cur };
      closeForm();
      rerenderRow();
      rerenderMainRow(tpl);
      refreshTraderOverrideFilter();
      updateTraderTopbar();
      const item = ITEMS[tpl];
      const prevCount = data.previousCount != null ? data.previousCount : data.previousPrice;
      const prev = prevCount != null ? `${prevCount.toLocaleString('en-US')} → ` : '';
      let msg = `${(item && (item.shortName || item.name)) || tpl}: trader sell ${prev}${count.toLocaleString('en-US')} ${sym} · restart SPT to apply`;
      // B2: a successful save with a warning (e.g. mod not installed) is amber, not red.
      if (data.warning) msg += ` (${data.warning})`;
      toast(msg, data.warning ? 'warn' : 'ok');
    } catch (err) {
      toast('Failed to save: ' + err.message, 'err');
      save.disabled = false; cancel.disabled = false; if (restore) restore.disabled = false;
    }
  };

  if (restore) restore.onclick = async () => {
    restore.disabled = true; save.disabled = true; cancel.disabled = true;
    try {
      const r = await fetch(API_BASE + '/trader-price', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tpl, traderId }),
      });
      const data = await r.json();
      if (!r.ok || !data.ok) throw new Error(data.error || ('HTTP ' + r.status));
      if (TRADER_OVERRIDES[traderId]) {
        delete TRADER_OVERRIDES[traderId][tpl];
        if (Object.keys(TRADER_OVERRIDES[traderId]).length === 0) delete TRADER_OVERRIDES[traderId];
      }
      closeForm();
      rerenderRow();
      rerenderMainRow(tpl);
      refreshTraderOverrideFilter();
      updateTraderTopbar();
      const item = ITEMS[tpl];
      toast(`${(item && (item.shortName || item.name)) || tpl}: trader override removed → default · restart SPT to apply${data.warning ? ` (${data.warning})` : ''}`, data.warning ? 'warn' : 'ok');
    } catch (err) {
      toast('Failed to restore: ' + err.message, 'err');
      restore.disabled = false; save.disabled = false; cancel.disabled = false;
    }
  };
}

// ── B-3: trader BUY price (buyback, tarkov.dev reference — now editable) ────────────────────
// Mirrors renderTraderRow/openTraderEdit/restoreTraderOverride (sell side) exactly, over
// BUY_OVERRIDES + /api/trader-buy-price instead of TRADER_OVERRIDES + /api/trader-price. The
// reference "base" price here is tarkov.dev's sellFor (not SPT's live assort — there is no
// buyback assort to read from; see BACKLOG.md B-3).

// Render one tarkov.dev sellFor row. Editable when the vendor resolves to a known traderId
// (not Fence, money currency) — same editability rule as the sell table.
function renderBuyRow(it, s) {
  const tpl = it.id;
  const vendorName = s.vendor && s.vendor.name;
  const traderId = vendorName && TRADERS[vendorName] ? TRADERS[vendorName].id : null;
  const isFence = traderId === FENCE_ID;
  const cur = s.currency || 'RUB';
  const isMoney = TRADER_MONEY_CURRENCIES.has(cur);
  const editable = !!traderId && !isFence && isMoney;
  const nameCell = `<td class="k">${escapeHtml(vendorName || '?')}</td>`;
  const readOnlyMarkup = `${fmt(s.priceRUB)} ₽${cur !== 'RUB' ? ` <small class="vendor">(${s.price} ${cur})</small>` : ''}`;

  if (isFence) {
    return `<tr>${nameCell}<td class="v">${readOnlyMarkup} <span class="vendor trader-fence-tag" data-tip="Fence — dynamic assort, not editable">Fence — not editable</span></td></tr>`;
  }
  if (!editable) {
    return `<tr>${nameCell}<td class="v">${readOnlyMarkup}</td></tr>`;
  }

  const ovr = buyOverrideFor(traderId, tpl);
  const hasOvr = ovr != null;
  const ovrCount = hasOvr ? ((typeof ovr === 'object') ? ovr.count : ovr) : null;
  const base = s.price; // native amount (tarkov.dev reference)
  const eff = hasOvr && ovrCount != null ? ovrCount : base;
  const rubHint = eff != null ? rubHintMarkup(eff, cur) : '';
  const sym = CURRENCY_SYMBOL[cur] || cur;
  const badge = hasOvr
    ? ` <span class="badge badge--override" data-tip="${escapeAttr('Buyback override active — trader pays you ' + (eff != null ? eff.toLocaleString('en-US') : '?') + ' ' + sym + ' (tarkov.dev ref ' + (base != null ? base.toLocaleString('en-US') : '?') + ' ' + sym + '). Edit / restore here.')}">OVR</span>`
    : '';

  const nullCell = `<span class="trader-price-val is-null">—</span>`;
  let priceMarkup;
  if (eff == null) {
    priceMarkup = nullCell;
  } else if (hasOvr) {
    priceMarkup = (base != null ? `<s class="trader-price-base">${nativeValueMarkup(base, cur)}</s> → ` : '') +
      `<span class="is-overridden">${nativeValueMarkup(eff, cur)}</span>${rubHint}`;
  } else {
    priceMarkup = `${nativeValueMarkup(eff, cur)}${rubHint}`;
  }

  const restoreBtn = hasOvr
    ? `<button class="buy-restore-btn" type="button" data-tip="Restore reference buyback price" aria-label="Restore reference buyback price">↺</button>`
    : '';

  return `<tr class="buy-row is-editable${hasOvr ? ' is-overridden' : ''}" data-buy-trader-id="${escapeAttr(traderId)}" data-buy-tpl="${escapeAttr(tpl)}" data-buy-base="${base != null ? base : ''}" data-buy-cur="${escapeAttr(cur)}">` +
    nameCell +
    `<td class="v buy-edit-cell" data-tip="Click to edit what this trader pays you (buyback)" tabindex="0" role="button" aria-label="Edit trader buy price">` +
      priceMarkup + badge + restoreBtn +
      `<button class="buy-edit-btn" type="button" title="Edit trader buy price" tabindex="-1">${ICON_EDIT}</button>` +
    `</td>` +
  `</tr>`;
}

// Re-render a single BUY row from ITEMS/dev.sellFor, returning a fresh <tr>.
function rerenderBuyRowEl(row, focusBack) {
  const tpl = row.dataset.buyTpl;
  const traderId = row.dataset.buyTraderId;
  const item = ITEMS[tpl];
  if (!item) return null;
  const s = buildBuySourceRows(item).find(x => x.vendor && TRADERS[x.vendor.name] && TRADERS[x.vendor.name].id === traderId);
  if (!s) return null;
  const tmp = document.createElement('tbody');
  tmp.innerHTML = renderBuyRow(item, s);
  const fresh = tmp.firstElementChild;
  row.replaceWith(fresh);
  if (focusBack) {
    const cell = fresh.querySelector('.buy-edit-cell');
    if (cell) cell.focus();
  }
  return fresh;
}

// Inline restore (↺ on the row, no editor). DELETEs the buyback override directly.
async function restoreBuyOverride(row) {
  const tpl = row.dataset.buyTpl;
  const traderId = row.dataset.buyTraderId;
  const btn = row.querySelector('.buy-restore-btn');
  if (btn) btn.disabled = true;
  try {
    const r = await fetch(API_BASE + '/trader-buy-price', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tpl, traderId }),
    });
    const data = await r.json();
    if (!r.ok || !data.ok) throw new Error(data.error || ('HTTP ' + r.status));
    if (BUY_OVERRIDES[traderId]) {
      delete BUY_OVERRIDES[traderId][tpl];
      if (Object.keys(BUY_OVERRIDES[traderId]).length === 0) delete BUY_OVERRIDES[traderId];
    }
    rerenderBuyRowEl(row, true);
    rerenderMainRow(tpl); // CR-04: keep the main-list "B" cell in sync
    updateBuyTopbar(); // CR-05: keep the "N buyback edits pending" pill in sync
    const item = ITEMS[tpl];
    toast(`${(item && (item.shortName || item.name)) || tpl}: buyback override removed → reference · restart SPT to apply${data.warning ? ` (${data.warning})` : ''}`, data.warning ? 'warn' : 'ok');
  } catch (err) {
    if (btn) btn.disabled = false;
    toast('Failed to restore: ' + err.message, 'err');
  }
}

// Open the inline editor on a BUY row. Mirrors openTraderEdit (sell side).
function openBuyEdit(row) {
  if (row.querySelector('.buy-edit-form')) return; // already editing
  const tpl = row.dataset.buyTpl;
  const traderId = row.dataset.buyTraderId;
  const cur = row.dataset.buyCur;
  const sym = CURRENCY_SYMBOL[cur] || cur || '';
  const base = row.dataset.buyBase !== '' ? Number(row.dataset.buyBase) : null;
  const ovrCount = buyOverrideCount(traderId, tpl);
  const current = ovrCount != null ? ovrCount : (base != null ? base : '');
  const hasOvr = ovrCount != null;

  const isRub = cur === 'RUB';
  const rate = CURRENCY_RATES[cur];
  const showRubPreview = CURRENCY_RUB_HINT.has(cur) && rate && rate > 0;

  const cell = row.querySelector('.buy-edit-cell');
  cell.classList.add('is-editing');
  const form = document.createElement('form');
  form.className = 'buy-edit-form trader-edit-form'; // reuses the sell editor's CSS
  form.onsubmit = (e) => { e.preventDefault(); return false; };
  form.innerHTML =
    `<input type="number" min="1" step="1" value="${current}" autofocus aria-label="Trader buy price in ${escapeAttr(cur)}">` +
    `<div class="trader-edit-form__preview" aria-live="polite"></div>` +
    `<div class="trader-edit-form__actions">` +
      `<button class="save" type="button" title="Save (Enter)">Save</button>` +
      (hasOvr ? `<button class="restore" type="button" title="Restore reference buy price (undo edit)">↺</button>` : '') +
      `<button class="cancel" type="button" title="Cancel (Esc)">×</button>` +
    `</div>` +
    `<div class="trader-edit-form__hint">edit in ${escapeHtml(cur)} · what this trader pays you · restart SPT to apply</div>`;
  cell.appendChild(form);

  const input   = form.querySelector('input');
  const preview = form.querySelector('.trader-edit-form__preview');
  const save    = form.querySelector('button.save');
  const cancel  = form.querySelector('button.cancel');
  const restore = form.querySelector('button.restore');
  input.focus(); input.select();

  function updatePreview() {
    const v = parseInt(input.value, 10);
    if (!Number.isFinite(v) || v <= 0) { preview.textContent = ''; return; }
    if (showRubPreview) {
      const rub = Math.round(v * rate);
      preview.textContent = `≈ ${rub.toLocaleString('en-US')} ₽ (@ ${rate.toLocaleString('en-US')} ₽/${sym})`;
    } else if (isRub) {
      preview.textContent = `= ${v.toLocaleString('en-US')} ₽`;
    } else {
      preview.textContent = `= ${v.toLocaleString('en-US')} ${sym}`;
    }
  }
  input.addEventListener('input', updatePreview);
  updatePreview();

  let docClickHandler = null;
  function closeForm() {
    cell.classList.remove('is-editing');
    form.remove();
    if (docClickHandler) document.removeEventListener('mousedown', docClickHandler, true);
  }
  function rerenderRow() { return rerenderBuyRowEl(row, true); }

  cancel.onclick = () => { closeForm(); const cell2 = row.querySelector('.buy-edit-cell'); if (cell2) cell2.focus(); };
  input.onkeydown = (ev) => {
    if (ev.key === 'Escape') closeForm();
    if (ev.key === 'Enter')  { ev.preventDefault(); save.click(); }
  };
  docClickHandler = (ev) => { if (!row.contains(ev.target)) closeForm(); };
  setTimeout(() => document.addEventListener('mousedown', docClickHandler, true), 0);

  save.onclick = async () => {
    const count = parseInt(input.value, 10);
    if (!Number.isFinite(count) || count <= 0) { toast('Invalid value', 'err'); input.focus(); return; }
    save.disabled = true; cancel.disabled = true; if (restore) restore.disabled = true;
    try {
      const r = await fetch(API_BASE + '/trader-buy-price', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tpl, traderId, count, currency: cur }),
      });
      const data = await r.json();
      if (!r.ok || !data.ok) throw new Error(data.error || ('HTTP ' + r.status));
      if (!BUY_OVERRIDES[traderId]) BUY_OVERRIDES[traderId] = {};
      BUY_OVERRIDES[traderId][tpl] = { count, currency: cur };
      closeForm();
      rerenderRow();
      rerenderMainRow(tpl); // CR-04: keep the main-list "B" cell in sync
      updateBuyTopbar(); // CR-05: keep the "N buyback edits pending" pill in sync
      const item = ITEMS[tpl];
      const prevCount = data.previousCount != null ? data.previousCount : data.previousPrice;
      const prev = prevCount != null ? `${prevCount.toLocaleString('en-US')} → ` : '';
      let msg = `${(item && (item.shortName || item.name)) || tpl}: trader buy ${prev}${count.toLocaleString('en-US')} ${sym} · restart SPT to apply`;
      if (data.warning) msg += ` (${data.warning})`;
      toast(msg, data.warning ? 'warn' : 'ok');
    } catch (err) {
      toast('Failed to save: ' + err.message, 'err');
      save.disabled = false; cancel.disabled = false; if (restore) restore.disabled = false;
    }
  };

  if (restore) restore.onclick = async () => {
    restore.disabled = true; save.disabled = true; cancel.disabled = true;
    try {
      const r = await fetch(API_BASE + '/trader-buy-price', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tpl, traderId }),
      });
      const data = await r.json();
      if (!r.ok || !data.ok) throw new Error(data.error || ('HTTP ' + r.status));
      if (BUY_OVERRIDES[traderId]) {
        delete BUY_OVERRIDES[traderId][tpl];
        if (Object.keys(BUY_OVERRIDES[traderId]).length === 0) delete BUY_OVERRIDES[traderId];
      }
      closeForm();
      rerenderRow();
      rerenderMainRow(tpl); // CR-04: keep the main-list "B" cell in sync
      updateBuyTopbar(); // CR-05: keep the "N buyback edits pending" pill in sync
      const item = ITEMS[tpl];
