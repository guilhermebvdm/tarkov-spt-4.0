## Maximum press-to-release time (in milliseconds) classified as a single click. Single click = snap to Stance 0 without firing. Held longer = snap + 1 natural shot (semi-auto/burst) or short fullauto burst (~1 shot at 600 RPM).
## 
## Tempo máximo entre pressionar e soltar (em milissegundos) classificado como clique único. Clique único = snap para a Stance 0 sem disparar. Segurar mais = snap + 1 tiro natural (semi-auto/burst) ou rajada curta em fullauto (~1 tiro a 600 RPM).
# Setting type: Int32
# Default value: 600
# Acceptable value range: From 50 to 1000
Snap Fire Threshold (ms) = 600

## Maximum time (seconds) the snap intercept can stay active without a button-up before being auto-cleared. Lower values reduce risk of stale state in rare weapon-swap-during-hold edge cases. Default 2s is safe.
## 
## Tempo máximo (segundos) que o intercept do snap pode ficar ativo sem o soltar do botão antes de ser limpo automaticamente. Valores menores reduzem o risco de estado preso em casos raros de troca de arma durante o hold. O padrão de 2s é seguro.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0,5 to 10
Snap Stale Timeout (s) = 2

## When enabled, the player starts every raid already in Stance 2 - Low Ready, with no transition animation (immediate set). Applies even if Stance 2 is excluded from the cycle.
## 
## Quando ativado, o jogador começa toda raid já na Stance 2 - Low Ready, sem animação de transição (set imediato). Vale mesmo que a Stance 2 esteja fora do ciclo.
# Setting type: Boolean
# Default value: true
Start In Low Ready On Raid Begin = true

## Automatically raises the weapon to Stance 0 (Ready) when reloading, checking ammo/chamber, examining the weapon, checking fire mode and UNLOADING THE CHAMBER — and returns to the previous stance when done. Real time.
## 
## Levanta a arma para a Stance 0 (Pronto) automaticamente ao recarregar, checar munição/câmara, examinar a arma, checar modo de fogo e ESVAZIAR A CÂMARA — e retorna à postura anterior ao fim. Tempo real.
# Setting type: Boolean
# Default value: true
Enable Action Stance Swap = true

[Stance Transition & Kick]

## Speed multiplier for switching BETWEEN STANCES (including back to the default view). Does not affect aiming — see ADS Transition Speed.
## 
## Multiplicador de velocidade da troca ENTRE POSTURAS (incluindo a volta para a visão padrão). Não afeta a mira — veja ADS Transition Speed.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,1 to 5
Stance Transition Speed = 0.8

## Speed multiplier for RAISING AND LOWERING THE SIGHTS (aiming in and out). Split from Stance Transition Speed, which used to drive both.
## 
## Multiplicador de velocidade de LEVANTAR E BAIXAR A MIRA (entrar e sair do ADS). Separado do Stance Transition Speed, que antes controlava os dois.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,1 to 5
ADS Transition Speed = 1

## How much the weapon kicks towards your chest when changing stances or ADS. Negative values pull it towards you.
## 
## Quanto a arma recua em direção ao seu peito ao trocar de postura ou mirar (ADS). Valores negativos puxam a arma em sua direção.
# Setting type: Single
# Default value: -0.05
# Acceptable value range: From -0,3 to 0,3
Stance Kick Intensity (Toward the Chest) = -0.05

## Delay in seconds before the kick is applied when entering ADS. Use this to sync the kick with the end of the ADS animation.
## 
## Atraso em segundos antes de aplicar o kick ao entrar em ADS. Use para sincronizar o kick com o fim da animação de mira.
# Setting type: Single
# Default value: 0.15
# Acceptable value range: From 0 to 1
ADS Kick Delay (In) = 0.15

## Damping for the spring physics. Lower values mean more overshoot/bounce. Default is 12.
## 
## Amortecimento da física de mola. Valores menores geram mais overshoot/quicada. Padrão é 12.
# Setting type: Single
# Default value: 12
# Acceptable value range: From 1 to 30
Stance Overshoot Damping (Lower Means More Bounce) = 12

[Tac Sprint Settings (Advanced)]

## Maximum weapon weight (kg) to allow tac sprint animation. Default: 5.1kg
## 
## Peso máximo da arma (kg) para permitir a animação de tac sprint. Padrão: 5.1kg
# Setting type: Single
# Default value: 5.1
# Acceptable value range: From 1 to 15
Tac Sprint Weight Limit = 5.1

## Maximum weapon weight (kg) for bullpup weapons to allow tac sprint. Bullpups get a higher limit. Default: 5.75kg
## 
## Peso máximo da arma (kg) para armas bullpup permitirem tac sprint. Bullpups têm um limite maior. Padrão: 5.75kg
# Setting type: Single
# Default value: 5.75
# Acceptable value range: From 1 to 15
Tac Sprint Weight Limit (Bullpup) = 5.75

## Maximum weapon length (inventory cells) to allow tac sprint animation. Default: 6 cells
## 
## Comprimento máximo da arma (células de inventário) para permitir a animação de tac sprint. Padrão: 6 células
# Setting type: Int32
# Default value: 6
# Acceptable value range: From 1 to 10
Tac Sprint Length Limit = 6

## Minimum weapon ergonomics to allow tac sprint animation. Default: 35
## 
## Ergonomia mínima da arma para permitir a animação de tac sprint. Padrão: 35
# Setting type: Single
# Default value: 35
# Acceptable value range: From 0 to 100
Tac Sprint Ergo Limit = 35

## Delay (seconds) after sprint ends before weapon returns to normal size. 0 = instant. Prevents jarring snap-back.
## 
## Atraso (segundos) após o fim do sprint antes da arma voltar ao tamanho normal. 0 = instantâneo. Evita o snap-back brusco.
# Setting type: Single
# Default value: 0.35
# Acceptable value range: From 0 to 1
Tac Sprint Reset Delay = 0.35

[Weapon Mount (Active)]

## Prevents mounting the weapon on surfaces while in Stance 1/2/3 without aiming. In Stance 0, while aiming, or while prone, mounting works normally.
## 
## Impede apoiar a arma em superfícies (mount) enquanto estiver em Stance 1/2/3 sem mirar. Em Stance 0, mirando ou deitado (prone), o mount funciona normalmente.
# Setting type: Boolean
# Default value: true
Block Active Mount In Stance = true

[Weapon Mount (Passive)]

## Enables passive mounting: resting the weapon against a surface (without the mount key) grants a light stability benefit. Off = only the game's native mount.
## 
## Liga o apoio passivo: ao encostar a arma numa superfície (sem a tecla de mount) você ganha um benefício leve de estabilidade. Desligado = só o mount nativo do jogo.
# Setting type: Boolean
# Default value: true
Enable Passive Mount = true

## Recoil multiplier while passively mounted. 0.7 = 30% less recoil. Must be HIGHER than the active (vanilla) mount — passive is weaker.
## 
## Multiplicador de recuo enquanto apoiado (passivo). 0.7 = 30% menos recuo. Deve ser MAIOR que o do mount ativo (vanilla) — o passivo é mais fraco.
# Setting type: Single
# Default value: 0.7
# Acceptable value range: From 0,1 to 1
Passive Recoil Multiplier = 0.7

## Sway (breathing) multiplier while passively mounted. 0.65 = 35% less sway.
## 
## Multiplicador de sway (respiração) enquanto apoiado. 0.65 = 35% menos sway.
# Setting type: Single
# Default value: 0.65
# Acceptable value range: From 0 to 1
Passive Sway Multiplier = 0.65

## While passively mounted, pauses/reduces arm stamina drain (weaker than the native mount).
## 
## Enquanto apoiado, pausa/reduz o drain de stamina de braço (mais fraco que o mount nativo).
# Setting type: Boolean
# Default value: true
Passive Stamina Save = true

## Shows the directional icon (left/right/down) in the bottom-right corner when passive mount is active.
## 
## Mostra o ícone direcional (esquerda/direita/baixo) no canto inferior direito quando o apoio passivo está ativo.
# Setting type: Boolean
# Default value: true
Show Mount Icon = true
