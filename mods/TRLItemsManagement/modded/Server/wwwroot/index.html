<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TRL Items Management — mod spike</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; background:#14140f; color:#e8e2cf; margin:0; padding:2rem; }
    h1 { color:#ecc94b; } code { background:#26261c; padding:.1rem .3rem; border-radius:4px; }
    #ping { margin-top:1rem; padding:.75rem 1rem; border:1px solid #3d3410; border-radius:8px; background:#1c1c14; }
    .ok { color:#68d391; } .err { color:#fc8181; }
  </style>
</head>
<body>
  <h1>TRL Items Management — served by the SPT mod ✓</h1>
  <p>Esta página é servida por <code>wwwroot/index.html</code> do mod <code>TRLItemsManagement</code>,
     na Kestrel do próprio SPT (<code>https://127.0.0.1:6969/TRLItemsManagement-Server/index.html</code>).
     Prova o Milestone 1 do B-2 (virar mod).</p>
  <div id="ping">testando <code>GET /TRLItemsManagement-Server/api/ping</code>…</div>
  <script type="module">
    // .mjs/inline module only — a bare .js file anywhere in the mod dir makes ModValidator reject the mod.
    const el = document.getElementById('ping');
    try {
      const r = await fetch('/TRLItemsManagement-Server/api/ping');
      const j = await r.json();
      el.innerHTML = `API <span class="ok">${r.status} OK</span> — <code>${JSON.stringify(j)}</code>`;
    } catch (e) {
      el.innerHTML = `API <span class="err">falhou</span>: ${e.message}`;
    }
  </script>
</body>
</html>
